# Force Dockerfile (not Railpack) when Railway deploys the repo root.
# Variables still come from GitHub Keys via Actions, or Railway Variables.
#
# This file is the BACKEND service config. The office-console service must set
# Config as Code to `/frontend/railway.toml` or it will inherit this file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# GitHub autodeploy / PR environments skip this service unless these paths change.
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "node dist/index.js"
