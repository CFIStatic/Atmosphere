# Force Dockerfile (not Railpack) when Railway deploys the repo root.
# Variables still come from GitHub Keys via Actions, or Railway Variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "node dist/index.js"
