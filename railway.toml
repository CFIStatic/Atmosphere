# Backend service only — used when Railway deploys the repo root with the
# default Config File (/railway.toml). The office app is a second service
# whose Config File must be /frontend/railway.toml (see docs/production.md).
# Variables still come from GitHub Keys via Actions, or Railway Variables.
#
# Deploy probe is liveness (/api/health), not readiness (/api/ready).
# The process binds and answers /api/health before config/guards load.
# /api/ready talks to Supabase and reports production-guard errors; a
# paused project or a mailbox check must not fail the replica.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# GitHub autodeploy / PR environments skip this service unless these paths change.
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# No startCommand here on purpose. The root Dockerfile's CMD is already
# `node dist/index.js`, so the backend behaves identically — but a service
# whose Config File was never pointed at its own railway.toml (website,
# office app) resolves THIS file on GitHub autodeploys. With a startCommand
# here, those nginx images tried to run Node, crash-looped, and failed the
# healthcheck. Without it they fall back to their image's own entrypoint.
