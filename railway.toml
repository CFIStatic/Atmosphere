# Backend service only — used when Railway deploys the repo root with the
# default Config File (/railway.toml). The office app is a second service
# whose Config File must be /frontend/railway.toml (see docs/production.md).
# Variables still come from GitHub Keys via Actions, or Railway Variables.
#
# Deploy probe is liveness (/api/health), not readiness (/api/ready).
# /api/ready talks to Supabase; a paused project or egress blip would
# fail the Railway replica even when Node is serving.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "node dist/index.js"
