# Backend service only — used when Railway deploys the repo root with the
# default Config File (/railway.toml). The office app is a second service
# whose Config File must be /frontend/railway.toml (see docs/production.md).
# Variables still come from GitHub Keys via Actions, or Railway Variables.
#
# Deploy probe is liveness (/api/health), not readiness (/api/ready).
# /api/ready talks to Supabase; a paused project or egress blip would
# fail the Railway replica even when Node is serving.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# GitHub autodeploy / PR environments skip this service unless these paths change.
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# No startCommand here on purpose. The root Dockerfile's CMD is already
# `node dist/index.js`, so the backend behaves identically — but a service
# whose Config File was never pointed at its own railway.toml (website,
# office app) resolves THIS file on GitHub autodeploys. With a startCommand
# here, those nginx images tried to run Node, crash-looped, and failed the
# healthcheck. Without it they fall back to their image's own entrypoint.
#
# Dropping startCommand narrowed that blast radius; it did not close it.
# build.dockerfilePath and watchPatterns above still reach any service
# reading this file, and config-as-code outranks whatever
# `railway environment edit` stamped onto it — so an inheriting service
# rebuilds on backend-only commits and gets the BFF image, whatever its
# own settings say. That is how Corporate Website came to build tsc and
# ffmpeg and then fail its nginx pre-deploy command in four seconds.
# The fix is per-service and cannot live here: point each service's
# Config File at its own file. backend/scripts/applyRailwayConfigFile.mjs
# does that from CI. See docs/production.md.
