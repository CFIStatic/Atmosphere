# Backend service only — used when Railway deploys the repo root with the
# default Config File (/railway.toml). The office app is a second service
# whose Config File must be /frontend/railway.toml (see docs/production.md).
# Variables still come from GitHub Keys via Actions, or Railway Variables.
#
# Deploy probe is liveness (/api/health), not readiness (/api/ready).
# /api/ready talks to Supabase; a paused project or egress blip would
# fail the Railway replica even when Node is serving.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# GitHub autodeploy / PR environments skip this service unless these paths change.
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# No startCommand here on purpose. The root Dockerfile's CMD is already
# `node dist/index.js`, so the backend behaves identically, and a CLI deploy
# that uploads the repo root cannot hand a nginx image a Node start command.
#
# It does NOT rescue a service whose Config File was never pointed at its own
# railway.toml (website, office app, staff site). Such a service resolves THIS
# file on GitHub autodeploys — including `dockerfilePath = "Dockerfile"` above,
# which builds the BFF. There is no nginx image left to fall back to: the
# deployed image IS the backend, and it dies on the first backend variable the
# service does not carry:
#
#   Error: Missing required environment variable: SUPABASE_URL
#       at required (file:///app/dist/config.js:18:15)
#
# then burns the full 300s /api/health probe and reports "Deployment failed
# during network process". Do not add SUPABASE_URL to that service — set its
# Config File. backend/scripts/applyRailwayConfigFile.mjs does it from CI, and
# docs/production.md has the by-hand steps.
