# Staff data platform (internal/). Same settings as railway.json.
#
# Point the Railway service Config File at this file or at
# /internal/railway.json. New services that cannot set Config File should
# run internal/scripts/apply-railway-config.sh (the deploy job does this).
#
# One-time:
#   Root Directory = /
#   Config File    = /internal/railway.json
#   Branch         = a commit that contains internal/
#   API_UPSTREAM   = http://${{ "Atmosphere APIs".RAILWAY_PRIVATE_DOMAIN }}:${{ "Atmosphere APIs".PORT }}

[build]
builder = "DOCKERFILE"
dockerfilePath = "internal/Dockerfile"
watchPatterns = [
  "internal/**",
  "internal/Dockerfile",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# nginx image entrypoint (envsubst of PORT). Never node dist/index.js.
startCommand = "/docker-entrypoint.sh nginx -g 'daemon off;'"
