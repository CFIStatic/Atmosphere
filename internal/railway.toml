# Staff data platform (internal/). Do not reuse the API railway.toml —
# that probes /api/health for 300s and starts `node dist/index.js`.
#
# One-time on this service (Settings):
#   Config File    = /internal/railway.toml
#   Root Directory = /
#   Branch         = a commit that contains internal/ (this file).
#                     Deploying `main` before this lands uses /railway.toml
#                     and fails Network → Healthcheck after ~5 minutes.
#
# Runtime variable (Variables tab, not GitHub Keys):
#   API_UPSTREAM=http://${{Atmosphere.RAILWAY_PRIVATE_DOMAIN}}:${{Atmosphere.PORT}}

[build]
builder = "DOCKERFILE"
dockerfilePath = "internal/Dockerfile"
watchPatterns = [
  "internal/**",
  "internal/Dockerfile",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# nginx image entrypoint (envsubst of PORT). Never node dist/index.js.
startCommand = "/docker-entrypoint.sh nginx -g 'daemon off;'"
