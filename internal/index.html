<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Atmosphere Analytics — staff reporting on revenue, product usage, capture pipeline, AI, accounts, and campaigns."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <title>Atmosphere Analytics</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('atmosphere.theme');
          if (pref !== 'light' && pref !== 'dark') {
            try {
              var prefs = JSON.parse(localStorage.getItem('atmosphere.preferences') || '{}');
              pref = prefs.theme;
            } catch (e) {}
          }
          if (pref !== 'light' && pref !== 'dark') {
            pref = localStorage.getItem('atm-theme');
          }
          if (pref !== 'light' && pref !== 'dark') {
            pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', pref);
          document.documentElement.setAttribute('data-theme-preference', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme-preference', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
