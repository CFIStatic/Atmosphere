# Railway service config for the Work Verification BFF.
# Root directory in Railway must be `backend` (this folder).
#
# Variables are NOT stored here. GitHub Actions copies them from the
# `Keys` environment — see .github/workflows/deploy-production.yml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Patterns are matched from the GitHub repo root on Autodeploy, and from the
# upload root on `railway up`. Include both so a backend/ cwd upload still builds.
watchPatterns = ["backend/**", "src/**", "package.json", "package-lock.json", "Dockerfile", "tsconfig.json", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
