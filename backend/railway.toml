# Railway service config for the Work Verification BFF.
#
# Point the service's Config File at /backend/railway.toml with Root Directory
# `/`: dockerfilePath then resolves to the repo-root Dockerfile (the backend
# image, which needs sibling paths in its context) and the watch paths below
# are matched from the repo root. Setting it is what keeps this service off
# the inert repo-root /railway.toml — see railway.toml and docs/production.md.
# deploy-production.yml copies this file over the root one before `railway up`,
# so the CLI path works either way.
#
# Variables are NOT stored here. GitHub Actions copies them from the
# `Keys` environment — see .github/workflows/deploy-production.yml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Patterns are matched from the GitHub repo root on Autodeploy, and from the
# upload root on `railway up`. Include both so a backend/ cwd upload still builds.
watchPatterns = ["backend/**", "src/**", "package.json", "package-lock.json", "Dockerfile", "tsconfig.json", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
