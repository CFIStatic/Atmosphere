# Railway service config for the Work Verification BFF.
# Root directory in Railway must be `backend` (this folder).
#
# Variables are NOT stored here. GitHub Actions copies them from the
# `Keys` environment — see .github/workflows/deploy-production.yml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Patterns are matched from the repo root even when the service root is `backend`.
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
