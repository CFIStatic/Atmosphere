<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atmosphere Verifier — evidence review</title>
<meta name="description" content="Every proof-of-work video on every job, with the analysis, the integrity checks, and the chain of custody behind it." />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/atmosphere-180.png" />
<script>
  // Follow the same atmosphere.theme preference as the console (light|dark).
  (function () {
    try {
      var p = localStorage.getItem('atmosphere.theme');
      if (p !== 'light' && p !== 'dark') {
        try { p = JSON.parse(localStorage.getItem('atmosphere.preferences') || '{}').theme; } catch (e) {}
      }
      if (p !== 'light' && p !== 'dark') p = localStorage.getItem('atm-theme');
      if (p !== 'light' && p !== 'dark') {
        p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', p);
      document.documentElement.setAttribute('data-theme-preference', p);
    } catch (e) {}
  })();
</script>
<!--
  Atmosphere Verifier
  ===================
  A separate property from the platform on purpose. The people who need to
  review proof — an adjuster, a carrier's desk examiner, a GC's project
  manager, an attorney six months later — do not need an operations console
  and should not be given one. They need one screen: every clip, what the
  analysis found, whether the footage can be trusted, and who has touched it.

  Modelled on evidence-management systems rather than on media galleries. The
  differences that matter:

    * Integrity is a first-class column, not a detail. A clip whose GPS puts it
      two miles from the site is worse than no clip, and the list says so
      before anybody opens it.
    * The analysis and the ground truth are visually separate. What a model
      concluded and what a person accepted are different claims, and a screen
      that renders them identically is how the first gets mistaken for the
      second.
    * "Unknown" is its own state, styled as neither pass nor fail, because an
      unchecked clip is not a clean one.

  Self-contained by design: no external requests, no build step. It is a static
  file that can be served from anywhere, and it drops into the demo artifact as
  its own view.
-->
<style>
  /* One design system across the whole product. These tokens are the same
     values as frontend/src/index.css and website/assets/site.css — paper
     surfaces, warm ink, one load-bearing terracotta accent — so the Verifier
     is recognisably the same software as the console and the marketing site
     rather than a third look that happens to share a name. */
  :root {
    --bg: #FBFAF7;
    --panel: #FFFFFF;
    --line: #E3DED4;
    --line-soft: #EFEBE3;
    --ink: #1C1917;
    --ink-2: #57534E;
    --muted: #57534E;
    --faint: #78716C;
    --accent: #BC4508;
    --accent-soft: #FDF4EE;
    --pass: #1F7A3A;
    --pass-soft: #E7F6EC;
    --fail: #C62828;
    --fail-soft: #FDECEC;
    --unknown: #B45309;
    --unknown-soft: #FFF6D8;
    /* The media stage stays dark in both themes — footage is reviewed against
       a dark ground — but it is the brand's warm black, not a blue-black. */
    --stage: #1C1917;
    --stage-2: #2A2724;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(28,25,23,.04), 0 1px 3px rgba(28,25,23,.03);
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --glass-tint: 251 250 247;
    --glass-alpha: 0.1;
    --glass-blur: 10px;
    --glass-sat: 140%;
    --glass-sheen: 0.22;
    --glass-edge: 28 25 23;
    --glass-edge-alpha: 0.1;
    --glass-panel: 255 255 255;
    --glass-panel-alpha: 0.62;
  }

  /* Follow the console's stored preference when present; otherwise the OS.
     The top-bar toggle writes the same keys as the workspace and marketing
     site so a choice here sticks everywhere on this origin. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --panel: #1D1B18;
      --line: #2A2825;
      --line-soft: #242220;
      --ink: #F1EFEB;
      --ink-2: #A09C93;
      --muted: #A09C93;
      --faint: #807C74;
      --accent: #F26E22;
      --accent-soft: #31190C;
      --pass: #4ADE80;
      --pass-soft: #14301C;
      --fail: #F87171;
      --fail-soft: #3A1414;
      --unknown: #FBBF24;
      --unknown-soft: #3A2E0A;
      --stage: #100F0E;
      --stage-2: #26231F;
      --stage-ink: #E8E4DD;
      --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
      --glass-tint: 20 19 17;
      --glass-alpha: 0.22;
      --glass-sheen: 0.1;
      --glass-edge: 255 255 255;
      --glass-edge-alpha: 0.12;
      --glass-panel: 29 27 24;
      --glass-panel-alpha: 0.52;
    }
  }
  :root[data-theme="light"] {
    --bg: #FBFAF7;
    --panel: #FFFFFF;
    --line: #E3DED4;
    --line-soft: #EFEBE3;
    --ink: #1C1917;
    --ink-2: #57534E;
    --muted: #57534E;
    --faint: #78716C;
    --accent: #BC4508;
    --accent-soft: #FDF4EE;
    --pass: #1F7A3A;
    --pass-soft: #E7F6EC;
    --fail: #C62828;
    --fail-soft: #FDECEC;
    --unknown: #B45309;
    --unknown-soft: #FFF6D8;
    --stage: #1C1917;
    --stage-2: #2A2724;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(28,25,23,.04), 0 1px 3px rgba(28,25,23,.03);
    --glass-tint: 251 250 247;
    --glass-alpha: 0.1;
    --glass-sheen: 0.22;
    --glass-edge: 28 25 23;
    --glass-edge-alpha: 0.1;
    --glass-panel: 255 255 255;
    --glass-panel-alpha: 0.62;
  }
  :root[data-theme="dark"] {
    --bg: #141311;
    --panel: #1D1B18;
    --line: #2A2825;
    --line-soft: #242220;
    --ink: #F1EFEB;
    --ink-2: #A09C93;
    --muted: #A09C93;
    --faint: #807C74;
    --accent: #F26E22;
    --accent-soft: #31190C;
    --pass: #4ADE80;
    --pass-soft: #14301C;
    --fail: #F87171;
    --fail-soft: #3A1414;
    --unknown: #FBBF24;
    --unknown-soft: #3A2E0A;
    --stage: #100F0E;
    --stage-2: #26231F;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
    --glass-tint: 20 19 17;
    --glass-alpha: 0.22;
    --glass-sheen: 0.1;
    --glass-edge: 255 255 255;
    --glass-edge-alpha: 0.12;
    --glass-panel: 29 27 24;
    --glass-panel-alpha: 0.52;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- chrome ---------- */
  /* Mounted, opaque search bar. It is a grid sibling of the list, not a
     sticky overlay, so footage never scrolls through it and the bar itself
     does not travel with the table. */
  .topbar {
    display: flex; align-items: center; gap: 18px;
    height: 72px; padding: 0 16px;
    background: var(--panel); color: var(--ink);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;
    flex-shrink: 0;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* The wordmark, identical to the console's and the site's: four bars of ink
     at rising opacity over one terracotta base. The same asset works on paper
     and on a dark ground because the bars take their colour from the text. */
  .brand {
    display: flex; align-items: center; gap: 14px;
    font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: var(--ink);
    background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
  }
  .brand:hover { opacity: 0.88; }
  .brand svg { display: block; flex: none; width: 40px; height: 40px; color: var(--ink); }

  .search { flex: 1; max-width: 520px; position: relative; }
  .search input {
    width: 100%; height: 34px; padding: 0 10px 0 30px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font-size: 13px; outline: none;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 9px; top: 10px; color: var(--faint); }

  .topbar .spacer { flex: 1; }
  /* Moon in light (switch to dark), sun in dark (switch to light) — same
     destination-icon rule as the console header and the marketing site. */
  .theme-toggle {
    width: 32px; height: 32px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 50%;
    color: var(--ink-2); cursor: pointer; padding: 0;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover {
    color: var(--ink); border-color: var(--muted); background: var(--line-soft);
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .theme-toggle svg { display: none; }
  .theme-toggle .icon-moon { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  .who-wrap { position: relative; }
  .who {
    display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-2);
    background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 8px;
    font: inherit; text-align: left;
  }
  .who:hover, .who[aria-expanded="true"] { background: var(--line-soft); }
  .who .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; overflow: hidden;
    font-size: 11px; font-weight: 700; color: #FFFFFF; flex: none;
  }
  .who .avatar img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .who .role { color: var(--faint); font-size: 11.5px; }
  .who-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 80;
    min-width: 220px; padding: 5px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 14px 36px -14px rgba(0,0,0,.4);
  }
  .who-menu-head {
    padding: 8px 9px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .who-menu-head .name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .who-menu-head .email { font-size: 11.5px; color: var(--faint); margin-top: 2px; word-break: break-all; }
  .who-menu-head .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .who-menu button {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 9px;
    border: 0; background: none; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 550; color: var(--ink); text-align: left;
  }
  .who-menu button:hover, .who-menu button:focus-visible { background: var(--bg); outline: none; }
  .who-menu button.danger { color: var(--fail); border-top: 1px solid var(--line); margin-top: 4px; border-radius: 0 0 6px 6px; }
  .who-menu .theme-toggle {
    width: 100%;
    height: auto;
    border: 0;
    border-radius: 6px;
    justify-content: flex-start;
    gap: 9px;
    padding: 7px 9px;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 550;
  }
  .who-menu .theme-toggle:hover {
    color: var(--ink);
    border-color: transparent;
    background: var(--bg);
  }
  .who-menu .theme-toggle svg { flex: none; }

  /* ---------- layout ---------- */
  .app-frame {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .app-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  /* Full-height rail beside a top bar that only spans the work area — the
     classic app shell, without a band of search bar floating over empty rail. */
  .app-frame.has-sidebar .app-body {
    display: grid;
    grid-template-columns: var(--rail-w, 248px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      'rail topbar'
      'rail main';
  }
  .app-frame.has-sidebar .rail { grid-area: rail; }
  .app-frame.has-sidebar .topbar {
    grid-area: topbar;
    border-left: 0;
  }
  .app-frame.has-sidebar .shell {
    grid-area: main;
    min-height: 0;
    overflow: hidden;
  }
  .shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shell-main {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .screen-dashboard {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .screen-dashboard[hidden] { display: none !important; }

  /* Clip preview is a liquid-glass overlay: the dashboard stays in place
     underneath so the rail, search, and list remain visible as frosted
     glass beyond the video perimeter. The framed pane and the Ask chat
     are solid theme surfaces so footage and conversation stay readable
     in both light and dark. */
  .screen-preview {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    padding: clamp(36px, 6vh, 72px) clamp(40px, 7vw, 96px) clamp(40px, 7vh, 80px);
    overflow: hidden;
    background: transparent;
  }
  .screen-preview[data-open="1"] { display: flex; }
  .screen-preview[hidden] { display: none !important; }
  .screen-preview .liquid-glass {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: auto;
    background: rgb(28 25 23 / 0.08);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    backdrop-filter: blur(6px) saturate(120%);
  }
  .screen-preview .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(165deg, rgb(255 255 255 / var(--glass-sheen)) 0%, transparent 42%);
  }
  .screen-preview .liquid-glass::after {
    content: '';
    position: absolute;
    inset: -35%;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgb(255 255 255 / 0.16) 50%, transparent 62%);
    mix-blend-mode: overlay;
    animation: liquid-sheen 9s ease-in-out infinite;
  }
  @keyframes liquid-sheen {
    0% { transform: translateX(-10%) rotate(0deg); opacity: 0.35; }
    50% { transform: translateX(10%) rotate(2.5deg); opacity: 0.72; }
    100% { transform: translateX(-10%) rotate(0deg); opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen-preview .liquid-glass::after { animation: none; }
  }
  .screen-preview .sheet {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: min(1080px, 100%);
    height: 100%;
    max-height: none;
    margin: 0 auto;
    border-radius: 22px;
    box-shadow: none;
    background: transparent;
    pointer-events: auto;
  }
  .screen-preview .sheethead {
    position: relative;
    z-index: 1;
    padding: 12px 16px;
    margin: 0;
    background: var(--panel);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .screen-preview .preview-pane {
    position: relative;
    flex: 1;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 2px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 22px 54px -26px rgba(0,0,0,.38);
  }
  .screen-preview .sheetbody {
    position: relative;
    z-index: 1;
    flex: 1;
    grid-template-columns: minmax(0, 1.9fr) minmax(300px, 0.8fr);
    min-height: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  .screen-preview .preview-pane-fill {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: var(--panel);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .screen-preview .stage {
    position: relative;
    z-index: 1;
    padding: 14px 10px 14px 14px;
    border-right: 0;
    background: transparent;
  }
  .screen-preview .player {
    border-radius: 14px;
    box-shadow: 0 28px 70px -28px rgba(0,0,0,.62);
  }
  .screen-preview .player .frame {
    min-height: 0;
    position: relative;
    background: var(--stage);
  }
  .screen-preview .side {
    position: relative;
    z-index: 1;
    margin: 14px 14px 14px 4px;
    padding: 16px 16px 20px;
    border-radius: 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .screen-preview .tabs {
    background: var(--line-soft);
  }
  .screen-preview .tabs button[aria-selected="true"] {
    background: var(--panel);
  }
  .screen-preview .backbtn,
  .screen-preview .closebtn {
    background: var(--panel);
    border-color: var(--line);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  @media (max-width: 860px) {
    .screen-preview { padding: 12px; }
    .screen-preview .sheet { border-radius: 14px; }
    .screen-preview .sheethead { border-radius: 12px; }
    .screen-preview .preview-pane { border-radius: 16px; }
    .screen-preview .side { margin: 10px 10px 10px 10px; }
    .screen-preview .sheetbody {
      grid-template-columns: 1fr;
      overflow-y: auto;
    }
  }
  /* Phone / Field Capture: full-screen clip, video above the notes. */
  @media (max-width: 640px) {
    .screen-preview { padding: 0; }
    .screen-preview .sheet,
    .screen-preview .preview-pane {
      width: 100%;
      height: 100%;
      max-height: 100%;
      border-radius: 0;
    }
    .screen-preview .preview-pane { border-width: 0; box-shadow: none; }
    .screen-preview .sheethead {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }
    .screen-preview .sheethead > div { min-width: 0; }
    .screen-preview .sheethead h2 {
      font-size: 16px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .screen-preview .sheethead .id { display: none; }
    .screen-preview .sheethead .meta {
      margin-top: 2px;
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .screen-preview .backbtn,
    .screen-preview .closebtn {
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      place-items: center;
    }
    .screen-preview .backbtn { display: grid; }
    .screen-preview .back-label { display: none; }
    .screen-preview .sheetbody {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    .screen-preview .stage { padding: 0; flex: none; }
    .screen-preview .player { border-radius: 0; box-shadow: none; }
    .screen-preview .player .frame,
    .screen-preview .preview-stage {
      min-height: 0;
      width: 100%;
      height: auto;
      max-height: min(58vh, 520px);
      aspect-ratio: 9 / 16;
    }
    .screen-preview .player .frame video,
    .screen-preview .player .frame img,
    .screen-preview .preview-stage video,
    .screen-preview .preview-stage img {
      object-fit: contain;
    }
    .screen-preview .controls { padding: 8px 10px; }
    .screen-preview .controls button { width: 44px; height: 44px; }
    .screen-preview .side {
      margin: 0;
      padding: 10px 12px 24px;
      border-radius: 0;
      border: 0;
      border-top: 1px solid var(--line);
      min-height: 0;
    }
    .screen-preview .tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .screen-preview .tabs button {
      flex: 0 0 auto;
      padding: 10px 12px;
      font-size: 14px;
    }
    .screen-preview .alog li { font-size: 14px; padding: 12px 8px; }
  }
  .preview-stage {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 280px;
    aspect-ratio: 16 / 9;
    display: grid;
    place-items: center;
    background: var(--stage);
    overflow: hidden;
  }
  .preview-stage video,
  .preview-stage img,
  .screen-preview .player .frame video,
  .screen-preview .player .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--stage);
  }
  .preview-stage[data-preview-state="video"] video { object-fit: contain; }
  .yt-play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 74px;
    height: 52px;
    border: 0;
    border-radius: 16px;
    background: rgba(0, 0, 0, .72);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .yt-play:hover { background: var(--accent); }

  .backbtn {

  .rail {

  .rail-body {

  .rail-head {
    flex: none;

    display: flex;

  }
  .rail-head .brand { font-size: 24px; flex: 1; min-width: 0; }
  .rail-section { padding: 0; }
  .rail-section + .rail-section {
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .app-frame.has-sidebar .topbar .brand-fallback { display: none; }
  /* Rail-only embed: sidebar beside a React page — hide top bar and main pane. */
  body[data-atm-rail-only] .topbar,
  body[data-atm-rail-only] .shell { display: none !important; }
  body[data-atm-rail-only] .app-body,
  body[data-atm-rail-only] .app-frame { height: 100%; min-height: 0; }
  body[data-atm-rail-only] .app-frame.has-sidebar .app-body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 1fr;
    grid-template-areas: 'rail';
  }
  body[data-atm-rail-only] .rail {
    grid-area: rail;
    height: 100%;
    overflow-x: hidden;
  }
  body[data-atm-rail-only] .app-frame { overflow: hidden; }
  /* Office rail: Videos filters stay on Overview, Start a job, Job Files, and
     the job record — not only on Dashboard. */
  .navitem.nav-icon { justify-content: flex-start; gap: 10px; }
  .navitem.nav-icon svg { flex: none; color: var(--muted); width: 16px; height: 16px; }
  .navitem.nav-icon[aria-current="true"] svg { color: var(--accent); }
  @media (max-width: 1100px) {
    .app-frame.has-sidebar { --rail-w: 236px; }
  }
  @media (max-width: 900px) {
    .app-frame.has-sidebar { --rail-w: 228px; }
  }

  /* Phone / Field Capture 480px frame: rail becomes a drawer so the
     dashboard and search stay full width and easy to tap. */
  .rail-menu {
    display: none;
    place-items: center;
    width: 44px; height: 44px; flex: none;
    margin: 0 0 0 -6px; padding: 0;
    border: 0; border-radius: 10px;
    background: none; color: var(--ink);
    cursor: pointer;
  }
  .rail-backdrop { display: none; }
  @media (max-width: 640px) {
    .app-frame.has-sidebar { --rail-w: 0px; }
    .app-frame.has-sidebar .app-body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        'topbar'
        'main';
    }
    .app-frame.has-sidebar .rail {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(280px, 86vw);
      z-index: 40;
      transform: translateX(-105%);
      transition: transform 0.2s ease;
      border-right: 1px solid var(--line);
      background: var(--bg);
    }
    html[data-rail-open] .app-frame.has-sidebar .rail {
      transform: none;
      box-shadow: 8px 0 28px rgba(28, 25, 23, 0.18);
    }
    .rail-menu { display: grid; }
    html[data-rail-open] .rail-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(0, 0, 0, 0.45);
      border: 0;
      padding: 0;
    }
    .topbar {
      height: auto;
      min-height: 56px;
      gap: 8px;
      padding: 6px 10px 8px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .topbar .spacer { display: none; }
    .brand-fallback { display: none; }
    .search {
      flex: 1 1 100%;
      order: 5;
      min-width: 0;
      max-width: none;
    }
    .search input { min-width: 0; width: 100%; }
    .rail-menu { order: 1; }
    .who-wrap { order: 2; margin-left: auto; }
    /* Fat tap targets on a real phone Dashboard. The office rail iframe is
       ~248px even on a desktop tab, so this query matches there too — keep
       those rows on Dashboard’s desktop metrics unless the shell is the
       phone / Field Capture hamburger drawer. */
    body:not([data-atm-rail-only]) .navitem,
    body[data-atm-phone-drawer] .navitem {
      min-height: 44px;
      padding: 11px 12px;
      font-size: 14px;
    }
    .who-wrap { flex: none; }
    .who { gap: 9px; padding: 4px 6px; }
    .who .role { display: block; color: var(--faint); font-size: 11.5px; }
    .who-name, #who-name { font-size: 12.5px; }
    .tablewrap { overflow-x: hidden; padding: 0 10px 48px; }
    table { table-layout: fixed; width: 100%; max-width: 100%; }
    thead { display: none; }
    tbody { display: block; width: 100%; max-width: 100%; }
    .titlecell { min-width: 0; }
    .titlecell .t { white-space: normal; overflow: visible; text-overflow: unset; }
    .when, .id { white-space: normal; }
  }
  body[data-atm-rail-only] .rail-menu { display: none !important; }
  body[data-atm-rail-only] .rail-backdrop { display: none !important; }
  /* Office shell already slides this iframe as the phone drawer. The
     ≤640px rules above would hide .rail (higher specificity + no
     html[data-rail-open] in this document), so keep the rail on-screen. */
  body[data-atm-rail-only] .app-frame.has-sidebar .rail {
    position: relative;
    inset: auto;
    width: auto;
    transform: none;
    box-shadow: none;
    z-index: auto;
  }

  .rail h3 {
    margin: 4px 12px 8px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 600;
  }
  .navitem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: calc(100% - 16px);
    margin: 2px 8px;
    padding: 8px 10px;
    background: none;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    color: var(--ink-2);
    transition: background 0.12s ease, color 0.12s ease;
  }
  .navitem:hover { background: var(--line-soft); color: var(--ink); }
  .navitem[aria-current="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .navitem .count {
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--line-soft);
  }
  .navitem .label { min-width: 0; flex: 1; }
  .navitem[aria-current="true"] .count {
    color: var(--accent);
    background: var(--accent-soft);
  }
  /* Desktop office rail iframe is ~248px, which matches the phone
     breakpoint. Pin Overview / Start a job / Job Files (and Videos) to
     Dashboard’s desktop row metrics so selected-pill height, padding,
     type, and icons do not change when switching tabs. */
  body[data-atm-rail-only]:not([data-atm-phone-drawer]) .navitem {
    min-height: 0;
    height: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: normal;
  }
  body[data-atm-rail-only]:not([data-atm-phone-drawer]) .navitem.nav-icon {
    gap: 10px;
  }
  body[data-atm-rail-only]:not([data-atm-phone-drawer]) .navitem.nav-icon svg {
    width: 16px;
    height: 16px;
  }

  .facet { padding: 2px 14px 8px; }
  .facet label {
    display: flex; align-items: center; gap: 8px; padding: 4px 0;
    font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  }
  .facet input { accent-color: var(--accent); margin: 0; }
  .facet .n { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* ---------- toolbar ---------- */
  /* Sits above the scrolling table, same as the search bar: opaque and
     mounted, so row stills cannot show through it on the way past. */
  .toolbar {
    position: relative; z-index: 5;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--bg);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .toolbar h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .toolbar .result { font-size: 12.5px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button {
    border: 0; background: none; padding: 6px 12px; font-size: 12.5px;
    cursor: pointer; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

  /* ---------- table ---------- */
  .tablewrap { padding: 0 18px 60px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 4; background: var(--bg);
    text-align: left; font-size: 12px; letter-spacing: 0;
    text-transform: none;
    color: var(--muted); font-weight: 600; padding: 0; white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  thead th button {
    display: inline-flex; align-items: center; gap: 5px;
    width: 100%; padding: 10px 10px; margin: 0; border: 0; background: transparent;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    cursor: pointer; text-align: left;
  }
  thead th button:hover { color: var(--ink); }
  thead th[aria-sort="ascending"] button,
  thead th[aria-sort="descending"] button { color: var(--ink); }
  thead th .sortcaret {
    font-size: 9px; opacity: 0; transition: opacity .12s ease;
  }
  thead th button:hover .sortcaret { opacity: .45; }
  thead th[aria-sort="ascending"] .sortcaret,
  thead th[aria-sort="descending"] .sortcaret { opacity: 1; }
  tbody tr { background: var(--panel); cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  tbody td { padding: 6px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Compact 16:9 still — same screenshot as before, less list height. */
  .thumb {
    width: 112px; height: 63px; border-radius: 5px; overflow: hidden;
    background: var(--stage); flex: none; position: relative; display: block;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur {
    position: absolute; right: 4px; bottom: 4px; padding: 0 4px; border-radius: 3px;
    background: rgba(0,0,0,.82); color: #fff; font-size: 10px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 16px;
  }
  .titlecell { min-width: 220px; }
  .titlecell .t { font-weight: 600; font-size: 13px; }
  .titlecell .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .chip.pass, .chip.green { background: var(--pass-soft); color: var(--pass); }
  .chip.fail, .chip.red { background: var(--fail-soft); color: var(--fail); }
  .chip.unknown, .chip.yellow { background: var(--unknown-soft); color: var(--unknown); }
  .chip.hold { background: var(--ink); color: var(--panel); }
  .chip.neutral { background: var(--line-soft); color: var(--ink-2); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  tr .chip.yellow .dot,
  tr.jobrow .chip.unknown .dot { animation: recpulse 1.2s ease-in-out infinite; }
  @keyframes recpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  .tier {
    display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px;
    font-weight: 700; background: var(--line-soft); color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .when { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .when small { display: block; color: var(--faint); font-size: 11px; }

  /* ---------- job files ---------- */
  tr.jobrow { background: var(--bg); cursor: pointer; }
  tr.jobrow:hover { background: var(--line-soft); }
  tr.jobrow td {

    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;

  tr.jobrow td.jobpreview { width: 128px; padding-right: 4px; }
  tr.jobrow td.titlecell { padding-left: 18px; }
  tr.jobrow td.titlecell .t {
    display: inline-block;
    vertical-align: middle;
    max-width: 100%;
    font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  tr.jobrow td.titlecell .job-open {
    display: inline-block;

    max-width: 100%;

    padding: 0;

    font: inherit;
    color: inherit;
    text-align: left;

  tr.jobrow td.titlecell .job-open:hover { color: var(--accent); text-decoration: underline; }
  .jobfile { display: inline-flex; align-items: center; gap: 12px; min-width: 0; vertical-align: middle; }
  .jobfile .caret2 { flex: none; color: var(--faint); transition: transform .15s; }
  tr.jobrow[aria-expanded="false"] .caret2 { transform: rotate(-90deg); }
  .jobfile .folder { flex: none; color: var(--accent); width: 22px; height: 22px; }
  .job-acts { display: flex; align-items: center; gap: 2px; flex: none; }
  .job-act {

    background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center;
  }
  .job-act:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .job-act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .job-card-meta { display: none; }
  .job-card-meta .job-card-sep::before {

  /* Phone All videos: one compact card per job, not a stacked desktop table.
     Long "Site — work" names used to wrap as one block next to the action
     cluster, which left a single leftover word on the second line. Split
     those names: the site stays on the icon row, the work line uses the
     width under the buttons, each line ellipsizes instead of wrapping. */
  @media (max-width: 640px) {
    .toolbar { padding: 10px 14px 8px; gap: 6px 10px; }
    .toolbar h1 { font-size: 18px; }
    .tablewrap { padding: 10px 12px 36px; }
    tbody tr.jobrow,
    tbody tr.cliprow {
      display: grid;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      position: relative;
      margin: 0 0 8px;
      background: var(--panel);
      border: 1px solid var(--line);

    tbody tr.jobrow > td,
    tbody tr.cliprow > td {
      display: block;
      width: auto;
      min-width: 0;
      max-width: 100%;
      padding: 0 !important;
      border: 0 !important;
      border-top: none !important;
      border-bottom: none !important;
      box-sizing: border-box;
    }
    tbody tr.jobrow {
      grid-template-columns: 28px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 10px;
      row-gap: 4px;
      align-items: start;
      padding: 12px;
      border-radius: 14px;
    }
    tbody tr.jobrow td.jobpreview {
      grid-column: 1;
      grid-row: 1;
      padding-top: 2px !important;
    }
    tbody tr.jobrow .jobfile { gap: 0; }
    tbody tr.jobrow .caret2 { display: none; }
    tbody tr.jobrow .folder { width: 22px; height: 22px; }
    tbody tr.jobrow td.titlecell { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
    tbody tr.jobrow td.titlecell .t,
    tbody tr.jobrow td.titlecell .job-open {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-align: left;
    }
    tbody tr.jobrow td.titlecell .t:not(.job-title-split) {
      padding-right: 104px;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-wrap: pretty;
    }
    tbody tr.jobrow td.titlecell .t.job-title-split {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      white-space: normal;
      overflow: visible;
      -webkit-line-clamp: unset;
    }
    tbody tr.jobrow td.titlecell .t-lead {
      display: block;
      min-width: 0;
      padding-right: 104px;
      box-sizing: border-box;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr.jobrow td.titlecell .t-dash { display: none; }
    tbody tr.jobrow td.titlecell .t-rest {
      display: block;
      min-width: 0;
      padding-right: 104px;
      box-sizing: border-box;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr.jobrow .job-card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 8px;
      margin-top: 8px;
      padding-right: 104px;
      box-sizing: border-box;
    }
    tbody tr.jobrow .job-card-meta .chip { padding: 2px 7px; font-size: 11px; }
    tbody tr.jobrow .job-card-sep { color: var(--muted); font-size: 12px; line-height: 1.3; }
    tbody tr.jobrow td.job-status,
    tbody tr.jobrow td.job-when { display: none !important; }
    tbody tr.jobrow td.job-who {
      position: absolute;
      top: 8px;
      right: 8px;
      width: auto;
    }
    tbody tr.jobrow td.job-who .cellrow { display: block; width: auto; }
    tbody tr.jobrow td.job-who .cellrow > span:first-child { display: none; }
    tbody tr.jobrow .job-acts { gap: 0; }
    tbody tr.jobrow .job-act,
    tbody tr.jobrow .kebab {
      width: 36px;
      height: 36px;
    }

    tbody tr.cliprow {
      grid-template-columns: 72px minmax(0, 1fr);
      column-gap: 10px;
      align-items: center;
      margin-left: 10px;
      width: calc(100% - 10px);
      padding: 8px 44px 8px 8px;
      border-radius: 12px;
      background: var(--bg);
      border-color: var(--line-soft);
    }
    tbody tr.cliprow td:first-child { grid-column: 1; grid-row: 1 / span 2; }
    tbody tr.cliprow .thumb {
      width: 72px;
      height: 42px;
      max-width: 72px;
      aspect-ratio: 16 / 9;
    }
    tbody tr.cliprow td.titlecell { grid-column: 2; grid-row: 1 / span 2; }
    tbody tr.cliprow-nested td.titlecell .t { display: none; }
    tbody tr.cliprow td.titlecell .s {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }
    tbody tr.cliprow .job-card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 8px;
      margin-top: 4px;
    }
    tbody tr.cliprow .job-card-sep { color: var(--muted); font-size: 11.5px; }
    tbody tr.cliprow td.job-status,
    tbody tr.cliprow td.job-when { display: none !important; }
    tbody tr.cliprow td.job-who {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: auto;
    }
    tbody tr.cliprow td.job-who .cellrow { display: block; width: auto; }
    tbody tr.cliprow td.job-who .cellrow > span:first-child { display: none; }
    tbody tr.cliprow .kebab { width: 36px; height: 36px; }
  }

  .sheet-narrow { width: min(520px, 100%); height: auto; max-height: min(88vh, 720px); }
  .jf-tabs { display: flex; gap: 4px; padding: 10px 16px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .jf-tabs[hidden] { display: none; }
  .jf-tabs button {
    border: 0; background: none; padding: 8px 10px; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .jf-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .jf-body { padding: 16px 18px 20px; overflow-y: auto; }
  .jf-body label { display: block; margin-top: 10px; }
  .jf-body label > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
  .jf-body input, .jf-body select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px;
  }
  .jf-body .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .jf-submit {
    margin-top: 14px; width: 100%; border: 0; border-radius: 8px; padding: 10px 14px;
    background: var(--accent); color: #fff; font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer;
  }
  .jf-submit:disabled { opacity: .55; cursor: default; }
  .jf-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .jf-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .jf-list .who { font-size: 13px; font-weight: 600; color: var(--ink); }
  .jf-list .meta { font-size: 11.5px; color: var(--muted); }
  .jf-copy { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
  .jf-copy:hover { color: var(--ink); }
  .jf-note { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .jf-made { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--line); font-size: 12.5px; }
  .jf-made code { display: block; margin-top: 4px; font-size: 11px; word-break: break-all; color: var(--ink-2); }

  /* ---------- row actions ---------- */
  td.uploader .cellrow {
    display: inline-flex; align-items: center; justify-content: space-between;
    gap: 10px; width: 100%; box-sizing: border-box; vertical-align: middle;
  }
  .kebab {
    flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center;
  }
  .kebab:hover, .kebab[aria-expanded="true"] { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .kebab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rowmenu {
    position: fixed; z-index: 60; min-width: 172px; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 14px 36px -14px rgba(0,0,0,.4);
  }
  .rowmenu button {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 9px;
    border: 0; background: none; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 550; color: var(--ink); text-align: left;
  }
  .rowmenu button:hover, .rowmenu button:focus-visible { background: var(--bg); outline: none; }
  .rowmenu button svg { flex: none; color: var(--muted); }
  .rowmenu button.danger { color: var(--fail); }
  .rowmenu button.danger svg { color: currentColor; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(6px);
    z-index: 70; padding: 9px 14px; border-radius: 9px; font-size: 12.5px; line-height: 1.45;
    background: var(--ink); color: var(--panel); opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; max-width: min(92vw, 460px); text-align: center;
  }
  .toast[data-on="1"] { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty {
    padding: 48px 24px; text-align: center; color: var(--muted);
    max-width: 28rem; margin: 0 auto;
  }
  .empty .empty-title {
    margin: 0; font-size: 16px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em;
  }
  .empty .empty-body {
    margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted);
  }

  /* ---------- detail ---------- */
  .detail {
    position: fixed; inset: 0; z-index: 40; display: none;
    place-items: center;
    padding: 16px 20px;
    background: rgba(28, 25, 23, .48);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .detail[data-open="1"] { display: grid; }
  .sheet {
    position: relative;
    width: min(1440px, 100%);
    height: 100%;
    max-height: 100%;
    overflow: hidden;
    border-radius: 14px;
    background: var(--bg);
    box-shadow: 0 28px 80px -24px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  @media (max-width: 860px) {
    .detail { padding: 8px; }
    .sheet { border-radius: 10px; }
  }
  .sheethead {
    display: flex; align-items: flex-start; gap: 14px; flex: none;
    padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .sheethead h2 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; }
  .sheethead .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .sheethead .id + .meta-line::before { content: " · "; }
  .closebtn {
    margin-left: auto; border: 1px solid var(--line); background: var(--panel);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer; color: var(--muted);
    display: grid; place-items: center; flex: none;
  }
  .closebtn:hover { background: var(--line-soft); color: var(--ink); }

  .sheetbody { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.85fr); }
  @media (max-width: 860px) { .sheetbody { grid-template-columns: 1fr; overflow-y: auto; } }

  .stage { padding: 16px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .player { background: var(--stage); border-radius: 10px; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .player .frame { flex: 1; min-height: 240px; display: grid; place-items: center; }
  .player .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .controls {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; flex: none;
    border-top: 1px solid var(--stage-2); color: var(--stage-ink);
  }
  .controls button {
    border: 0; background: var(--stage-2); color: var(--stage-ink); width: 30px; height: 30px;
    border-radius: 7px; cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .controls button:hover { background: var(--accent); color: #FFFFFF; }
  .scrub { flex: 1; display: flex; gap: 3px; }
  .scrub button {
    flex: 1; height: 6px; border-radius: 3px; background: var(--stage-2); width: auto;
    padding: 0; border: 0; cursor: pointer;
  }
  .scrub button[aria-pressed="true"] { background: var(--accent); }
  .controls .time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); min-width: 74px; text-align: right; }

  .player video {
    display: block; width: 100%; height: 100%; max-height: none; object-fit: contain; background: #1A1815;
  }

  .side { padding: 16px 18px 24px; overflow-y: auto; min-height: 0; }
  .side.ask-mode { display: flex; flex-direction: column; overflow: hidden; }
  .side.ask-mode .tabs { flex: none; }
  .side.ask-mode #d-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; }
  .tabs { display: flex; gap: 3px; background: var(--line-soft); padding: 3px; border-radius: 8px; }
  .tabs button {
    flex: 1; min-width: 0; border: 0; background: none; padding: 7px 4px; border-radius: 6px;
    font-size: 12px; cursor: pointer; color: var(--muted); font-weight: 550;
  }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .alog-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 0 0 10px;
  }
  .alog-head h4 {
    margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); font-weight: 750;
  }
  .alog-head .livepill {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px;
  }
  .alog { list-style: none; margin: 0; padding: 0; }
  .alog li {
    display: grid; grid-template-columns: 52px 1fr; gap: 10px;
    padding: 10px 8px 10px 10px; border-radius: 8px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13px; line-height: 1.45; color: var(--ink-2);
  }
  .alog li:last-child { border-bottom: 0; }
  .alog li.soon { display: grid; opacity: .48; }
  .alog li.seen { color: var(--ink); opacity: 1; }
  .alog li.on {
    display: grid; background: var(--accent-soft); color: var(--ink);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .alog .t { font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 2px; }
  .alog li.on .t { color: var(--accent); font-weight: 700; }
  .alog li.writing [data-full]::after {
    content: ''; display: inline-block; width: 6px; height: 12px; margin-left: 3px;
    background: var(--accent); vertical-align: text-bottom;
    animation: alog-caret 1s step-end infinite;
  }
  @keyframes alog-caret { 50% { opacity: 0; } }
  .alog-wait { margin-top: 4px; }
  .alog-wait[hidden] { display: none; }
  .saw-block {
    margin: 0 0 14px; padding: 12px 13px; border-radius: 10px;
    background: var(--accent-soft); color: var(--ink); font-size: 13.5px; line-height: 1.55;
  }
  .saw-block p { margin: 0; }
  .saw-k {
    margin: 16px 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); font-weight: 750;
  }

  .ask-pane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .ask-thread { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 120px; overflow-y: auto; padding-bottom: 4px; }
  .ask-empty { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
  .ask-bubble {
    max-width: 92%; padding: 9px 12px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.5; white-space: pre-wrap;
  }
  .ask-bubble.user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ask-bubble.assistant {
    align-self: flex-start; background: var(--line-soft); color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .ask-bubble.pending { color: var(--muted); font-style: italic; }
  .ask-suggest { display: flex; flex-wrap: wrap; gap: 6px; }
  .ask-suggest button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 999px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .ask-suggest button:hover { border-color: var(--accent); color: var(--accent); }
  .ask-form { display: flex; gap: 6px; margin-top: 12px; flex: none; align-items: flex-end; }
  .ask-form textarea {
    flex: 1; min-width: 0; min-height: 40px; max-height: 120px; resize: none;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; background: var(--bg); color: var(--ink); font: inherit; outline: none;
    line-height: 1.4;
  }
  .ask-form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ask-form button[type="submit"] {
    border: 0; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 14px; height: 40px; font-weight: 650; cursor: pointer; flex: none;
  }
  .ask-form button[type="submit"]:disabled { opacity: .55; cursor: default; }

  .kv { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 6px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--ink); word-break: break-word; }
  .kv dd.mono { font-family: var(--mono); font-size: 11.5px; }

  .checkrow { display: flex; gap: 9px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .checkrow:last-child { border-bottom: 0; }
  .checkrow .what { font-size: 12.5px; font-weight: 600; }
  .checkrow .detail-txt { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

  .verdictline {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 9px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
  }
  .verdictline.pass { background: var(--pass-soft); color: var(--pass); }
  .verdictline.fail { background: var(--fail-soft); color: var(--fail); }
  .verdictline.unknown { background: var(--unknown-soft); color: var(--unknown); }

  .scopelist { list-style: none; margin: 0; padding: 0; }
  .scopelist li {
    display: flex; align-items: flex-start; gap: 9px; padding: 8px 0;
    border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
  }
  .scopelist li:last-child { border-bottom: 0; }
  .scopelist .label { flex: 1; }

  .custody { list-style: none; margin: 0; padding: 0; position: relative; }
  .custody::before {
    content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 1px; background: var(--line);
  }
  .custody li { position: relative; padding: 0 0 15px 24px; font-size: 12.5px; }
  .custody li::before {
    content: ''; position: absolute; left: 2px; top: 4px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--panel); border: 2px solid var(--accent);
  }
  .custody li.ai::before { border-color: var(--accent); }
  .custody .act { font-weight: 650; }
  .custody .by { color: var(--muted); }
  .custody .at { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .banner {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 11px 13px; border-radius: 9px; font-size: 12.5px; line-height: 1.5;
    margin-bottom: 14px;
  }
  .banner.hold { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .banner.warn { background: var(--unknown-soft); color: var(--unknown); }

  .footnote { font-size: 11.5px; color: var(--faint); line-height: 1.55; margin-top: 10px; }
  .srhide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<div class="app-frame" id="app-frame">
  <div class="app-body">
  <aside class="rail" id="main-rail" aria-label="Navigation">
    <div class="rail-head" id="rail-head" hidden>

          <rect y="4.8" width="22" height="2.8" fill="currentColor" opacity="0.5" />
          <rect y="9.6" width="22" height="2.8" fill="currentColor" opacity="0.68" />
          <rect y="14.4" width="22" height="2.8" fill="currentColor" opacity="0.88" />
          <rect y="19.2" width="22" height="2.8" fill="#F2670C" />
        </svg>
        <span>Atmosphere</span>
      </button>
    </div>

    <div class="rail-body">
    <div class="rail-section" id="platform-nav" hidden>
      <button type="button" class="navitem nav-icon" id="nav-field" data-route="/field">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17 16 12"/></svg>
        <span class="label">Overview</span>
      </button>
      <button type="button" class="navitem nav-icon" id="nav-start-job" data-tour="nav-start-job">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span class="label">Start a job</span>
      </button>
      <button type="button" class="navitem nav-icon app-nav" data-screen="dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="label">Dashboard</span>
      </button>
      <button type="button" class="navitem nav-icon" id="nav-jobs" data-route="/jobs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.75" y="7.25" width="18.5" height="12" rx="2.25"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M2.75 12h18.5"/></svg>
        <span class="label">Job Files</span>
      </button>
    </div>

    <div class="rail-section" id="evidence-nav">

    <button class="navitem nav-icon" data-view="all" data-label="All videos" title="All videos"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l4.2-2.6a.7.7 0 0 1 1.05.6v6.99a.7.7 0 0 1-1.06.6l-4.19-2.59"/></svg><span class="label">All videos</span> <span class="count" id="n-all">0</span></button>
    <button class="navitem nav-icon" data-view="classified" data-label="Classified" title="Classified"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h14"/></svg><span class="label">Classified</span> <span class="count" id="n-classified">0</span></button>
    <button class="navitem nav-icon" data-view="unanalysed" data-label="Awaiting analysis" title="Awaiting analysis"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">Awaiting analysis</span> <span class="count" id="n-unan">0</span></button>
    <button class="navitem nav-icon" data-view="flagged" data-label="Needs review" title="Needs review"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4"/><path d="M4 4h11l-1.5 4L15 12H4"/></svg><span class="label">Needs review</span> <span class="count" id="n-flag">0</span></button>
    <button class="navitem nav-icon" data-view="hold" data-label="Legal hold" title="Legal hold"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="label">Legal hold</span> <span class="count" id="n-hold">0</span></button>
    </div>
    </div>

    <div class="rail-footer" id="rail-footer" hidden>
      <button type="button" class="navitem nav-icon" id="nav-settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l-.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0 .34 1.87v.09A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        <span class="label">Settings</span>
      </button>
    </div>
  </aside>

<header class="topbar">
  <button type="button" class="rail-menu" id="rail-menu" aria-label="Open navigation" aria-controls="main-rail" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button type="button" class="rail-backdrop" id="rail-backdrop" aria-label="Close navigation"></button>

    parts.push('<path d="M90 70 L550 70 L550 320 L90 320 Z" fill="' + wall + '"/>');
    parts.push('<path d="M90 320 L20 380 L620 380 L550 320 Z" fill="#57514A"/>');
    parts.push('<path d="M90 70 L20 20 L620 20 L550 70 Z" fill="#3B3630"/>');

    }

    if (cut > 0) {

      parts.push('<rect x="120" y="' + (320 - ch) + '" width="380" height="' + ch + '" fill="#2B2723"/>');
      for (var s = 0; s < 6; s++) {
        parts.push('<rect x="' + (135 + s * 62) + '" y="' + (320 - ch) + '" width="13" height="' + ch + '" fill="#8a7a5f"/>');
      }
      parts.push('<rect x="120" y="' + (320 - ch - 4) + '" width="380" height="4" fill="#CFC8BE" opacity=".55"/>');
    }
    // Equipment.
    for (var g = 0; g < gear; g++) {
      var x = 150 + g * 105;
      parts.push('<rect x="' + x + '" y="286" width="58" height="34" rx="5" fill="#BC4508"/>');

  function clipInstant(e, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = e[keys[i]];

      if (!isNaN(t)) return t;

    return 0;

  function latestClip(items, keys) {
    var best = null;
    var bestT = -1;

    });
    return best;

  /**

  function isActiveRecording(e) {

    if (a === 'queued' || a === 'done' || a === 'failed') {
      return false;
    }
    var t = clipInstant(e, ['uploadedAt', 'capturedAt']);
    return Boolean(t && (Date.now() - t) < 30 * 60 * 1000);
  }

  function boardFromClips(key, items) {
    var daysMap = {};
    items.forEach(function (e) { if (e.workDate) daysMap[e.workDate] = true; });
    var dayKeys = Object.keys(daysMap).sort().reverse();
    var people = (DEMO_PEOPLE[key] || []).slice();
    var seenC = {};
    people.forEach(function (p) { seenC[p.name] = 1; });
    items.forEach(function (e) {
      if (e.company && !seenC[e.company]) {
        seenC[e.company] = 1;
        people.push({ name: e.company, role: 'subcontractor' });
      }
    });
    var scope = [];
    items.forEach(function (e) {
      if (e.analysis && e.analysis.scope && e.analysis.scope.length) scope = e.analysis.scope;
    });
    var done = scope.filter(function (s) { return s.verdict === 'appears_complete'; }).length;
    var verifiedDays = 0;
    dayKeys.forEach(function (d) {
      var onDay = items.filter(function (e) { return e.workDate === d; });
      if (onDay.some(function (e) { return integrityOf(e) === 'pass' && !isActiveRecording(e); })) verifiedDays += 1;
    });
    var inProgress = items.some(isActiveRecording) ? 1 : 0;
    var recent = dayKeys.slice(0, 5).map(function (d) {
      var onDay = items.filter(function (e) { return e.workDate === d; });
      var active = onDay.some(isActiveRecording);
      var fail = onDay.some(function (e) { return integrityOf(e) === 'fail'; });
      var pass = onDay.some(function (e) { return integrityOf(e) === 'pass'; });
      return {
        day: d,
        label: active ? 'Active' : fail ? 'Issue' : pass ? 'Verified' : 'In review',
        tone: active ? 'caution' : fail ? 'danger' : pass ? 'success' : 'neutral'
      };
    });
    return {
      status: 'ready',
      scopePct: scope.length ? Math.round((done / scope.length) * 100) : 0,
      days: dayKeys.length,
      verified: verifiedDays,
      inProgress: inProgress,
      people: people,
      shares: DEMO_SHARES[key] || [],
      recent: recent,
      attention: null
    };
  }

  function boardFromRecord(record, proof, shares) {
    var scope = (record.scope || []).filter(function (s) { return s.state !== 'excluded'; });
    var approved = scope.filter(function (s) { return s.state === 'approved'; }).length;
    var days = (proof && proof.days) || [];
    var counts = (proof && proof.counts) || {};
    var risks = (record.risks || []).filter(function (r) { return r.level === 'blocker' || r.level === 'warn'; });
    var people = (record.parties || []).filter(function (p) { return !p.revoked_at; }).map(function (p) {
      return { name: p.company, role: p.role, id: p.id, email: p.email, trade: p.trade };
    });
    var recent = days.slice(0, 5).map(function (d) {
      var label = d.contradicted ? 'Issue' : (d.accepted || d.payable) ? 'Verified' : (d.hasBefore && !d.hasAfter) ? 'On site' : 'In review';
      var tone = d.contradicted ? 'danger' : (d.accepted || d.payable) ? 'success' : (d.hasBefore && !d.hasAfter) ? 'caution' : 'neutral';
      return { day: d.workDate, label: label, tone: tone };
    });
    return {
      status: 'ready',
      scopePct: scope.length ? Math.round((approved / scope.length) * 100) : 0,
      days: counts.days || days.length,
      verified: days.filter(function (d) { return d.payable || d.accepted; }).length,
      inProgress: days.filter(function (d) { return d.hasBefore && !d.hasAfter; }).length,
      people: people,
      shares: shares || [],
      recent: recent,
      attention: risks[0] ? risks[0].title : null,
      record: record
    };
  }

  function apiFetch(url, opts) {

  function hydrateJobBoard(key) {
    var items = EVIDENCE.filter(function (e) { return e.job === key; });
    if (!canOpenJobRecord(key)) {
      JOB_BOARD[key] = boardFromClips(key, items);
      return;
    }
    var cur = JOB_BOARD[key];
    if (cur && (cur.status === 'loading' || cur.status === 'ready')) return;
    JOB_BOARD[key] = { status: 'loading' };
    Promise.all([
      apiFetch('/api/operations/shared/' + encodeURIComponent(key)).then(jsonOrNull).catch(function () { return null; }),
      apiFetch('/api/operations/shared/' + encodeURIComponent(key) + '/proof').then(jsonOrNull).catch(function () { return null; }),
      apiFetch('/api/evidence-portal/shares?jobId=' + encodeURIComponent(key) + '&kind=progress').then(jsonOrNull).catch(function () { return null; })
    ]).then(function (parts) {
      var record = parts[0];
      var proof = parts[1];
      var sharePayload = parts[2];
      if (record && record.job) {
        JOB_BOARD[key] = boardFromRecord(record, proof, (sharePayload && sharePayload.shares) || []);
      } else {
        JOB_BOARD[key] = boardFromClips(key, items);
      }
      if (jobSheet.key === key) paintJobFileSheet();
    });
  }

  /**
   * Job files are named "site — work". On a phone the em-dash wrap left a
   * leftover word under a two-line block; splitting at that separator keeps
   * the site on one line and the work as a quieter second line.
   */
  function splitJobTitle(name) {
    var text = String(name || '').trim();
    var match = text.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    if (!match) return { lead: text, rest: '' };
    return { lead: match[1].trim(), rest: match[2].trim() };
  }

  function jobTitleMarkup(name) {
    var parts = splitJobTitle(name);
    if (!parts.rest) return esc(parts.lead);
    return '<span class="t-lead">' + esc(parts.lead) + '</span>' +
      '<span class="t-dash"> — </span>' +
      '<span class="t-rest">' + esc(parts.rest) + '</span>';
  }

    var latestUpload = latestClip(items, ['uploadedAt', 'capturedAt']);

    if (latestRecorded) {

          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>' +

        '</button>' +
        '<button type="button" class="kebab" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + esc(job.name) + '">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>' +
        '</button>' +
      '</span>';
    var metaBits = [];
    if (recordedDay && recordedDay !== '—') metaBits.push('<span class="job-card-sep">' + recordedDay + '</span>');
    if (latestUpload && latestUpload.person) metaBits.push('<span class="job-card-sep">' + esc(latestUpload.person) + '</span>');
