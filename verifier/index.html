<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atmosphere Verifier — evidence review</title>
<meta name="description" content="Every proof-of-work video on every job, with the analysis, the integrity checks, and the chain of custody behind it." />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/atmosphere-180.png" />
<script>
  // Follow the same atmosphere.theme preference as the console (light|dark).
  (function () {
    try {
      var p = localStorage.getItem('atmosphere.theme');
      if (p !== 'light' && p !== 'dark') {
        try { p = JSON.parse(localStorage.getItem('atmosphere.preferences') || '{}').theme; } catch (e) {}
      }
      if (p !== 'light' && p !== 'dark') p = localStorage.getItem('atm-theme');
      if (p !== 'light' && p !== 'dark') {
        p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', p);
      document.documentElement.setAttribute('data-theme-preference', p);
    } catch (e) {}
  })();
</script>
<!--
  Atmosphere Verifier
  ===================
  A separate property from the platform on purpose. The people who need to
  review proof — an adjuster, a carrier's desk examiner, a GC's project
  manager, an attorney six months later — do not need an operations console
  and should not be given one. They need one screen: every clip, what the
  analysis found, whether the footage can be trusted, and who has touched it.

  Modelled on evidence-management systems rather than on media galleries. The
  differences that matter:

    * Integrity is a first-class column, not a detail. A clip whose GPS puts it
      two miles from the site is worse than no clip, and the list says so
      before anybody opens it.
    * The analysis and the ground truth are visually separate. What a model
      concluded and what a person accepted are different claims, and a screen
      that renders them identically is how the first gets mistaken for the
      second.
    * "Unknown" is its own state, styled as neither pass nor fail, because an
      unchecked clip is not a clean one.

  Self-contained by design: no external requests, no build step. It is a static
  file that can be served from anywhere, and it drops into the demo artifact as
  its own view.
-->
<style>
  /* One design system across the whole product. These tokens are the same
     values as frontend/src/index.css and website/assets/site.css — paper
     surfaces, warm ink, one load-bearing terracotta accent — so the Verifier
     is recognisably the same software as the console and the marketing site
     rather than a third look that happens to share a name. */
  :root {
    --bg: #FBFAF7;
    --panel: #FFFFFF;
    --line: #E3DED4;
    --line-soft: #EFEBE3;
    --ink: #1C1917;
    --ink-2: #57534E;
    --muted: #57534E;
    --faint: #78716C;
    --accent: #BC4508;
    --accent-soft: #FDF4EE;
    --pass: #1F7A3A;
    --pass-soft: #E7F6EC;
    --fail: #C62828;
    --fail-soft: #FDECEC;
    --unknown: #B45309;
    --unknown-soft: #FFF6D8;
    /* The media stage stays dark in both themes — footage is reviewed against
       a dark ground — but it is the brand's warm black, not a blue-black. */
    --stage: #1C1917;
    --stage-2: #2A2724;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(28,25,23,.04), 0 1px 3px rgba(28,25,23,.03);
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* Follow the console's stored preference when present; otherwise the OS.
     The top-bar toggle writes the same keys as the workspace and marketing
     site so a choice here sticks everywhere on this origin. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --panel: #1D1B18;
      --line: #2A2825;
      --line-soft: #242220;
      --ink: #F1EFEB;
      --ink-2: #A09C93;
      --muted: #A09C93;
      --faint: #807C74;
      --accent: #F26E22;
      --accent-soft: #31190C;
      --pass: #4ADE80;
      --pass-soft: #14301C;
      --fail: #F87171;
      --fail-soft: #3A1414;
      --unknown: #FBBF24;
      --unknown-soft: #3A2E0A;
      --stage: #100F0E;
      --stage-2: #26231F;
      --stage-ink: #E8E4DD;
      --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="light"] {
    --bg: #FBFAF7;
    --panel: #FFFFFF;
    --line: #E3DED4;
    --line-soft: #EFEBE3;
    --ink: #1C1917;
    --ink-2: #57534E;
    --muted: #57534E;
    --faint: #78716C;
    --accent: #BC4508;
    --accent-soft: #FDF4EE;
    --pass: #1F7A3A;
    --pass-soft: #E7F6EC;
    --fail: #C62828;
    --fail-soft: #FDECEC;
    --unknown: #B45309;
    --unknown-soft: #FFF6D8;
    --stage: #1C1917;
    --stage-2: #2A2724;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(28,25,23,.04), 0 1px 3px rgba(28,25,23,.03);
  }
  :root[data-theme="dark"] {
    --bg: #141311;
    --panel: #1D1B18;
    --line: #2A2825;
    --line-soft: #242220;
    --ink: #F1EFEB;
    --ink-2: #A09C93;
    --muted: #A09C93;
    --faint: #807C74;
    --accent: #F26E22;
    --accent-soft: #31190C;
    --pass: #4ADE80;
    --pass-soft: #14301C;
    --fail: #F87171;
    --fail-soft: #3A1414;
    --unknown: #FBBF24;
    --unknown-soft: #3A2E0A;
    --stage: #100F0E;
    --stage-2: #26231F;
    --stage-ink: #E8E4DD;
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- chrome ---------- */
  .topbar {
    display: flex; align-items: center; gap: 18px;
    height: 56px; padding: 0 16px;
    background: var(--panel); color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  /* The wordmark, identical to the console's and the site's: four bars of ink
     at rising opacity over one terracotta base. The same asset works on paper
     and on a dark ground because the bars take their colour from the text. */
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 16px; letter-spacing: -0.02em; color: var(--ink);
    background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
  }
  .brand:hover { opacity: 0.88; }
  .brand svg { display: block; flex: none; color: var(--ink); }

  .search { flex: 1; max-width: 520px; position: relative; }
  .search input {
    width: 100%; height: 34px; padding: 0 10px 0 30px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font-size: 13px; outline: none;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 9px; top: 10px; color: var(--faint); }

  .topbar .spacer { flex: 1; }
  /* Moon in light (switch to dark), sun in dark (switch to light) — same
     destination-icon rule as the console header and the marketing site. */
  .theme-toggle {
    width: 32px; height: 32px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 50%;
    color: var(--ink-2); cursor: pointer; padding: 0;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover {
    color: var(--ink); border-color: var(--muted); background: var(--line-soft);
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .theme-toggle svg { display: none; }
  .theme-toggle .icon-moon { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  .who-wrap { position: relative; }
  .who {
    display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-2);
    background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 8px;
    font: inherit; text-align: left;
  }
  .who:hover, .who[aria-expanded="true"] { background: var(--line-soft); }
  .who .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #FFFFFF; flex: none;
  }
  .who .role { color: var(--faint); font-size: 11.5px; }
  .who-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 80;
    min-width: 220px; padding: 5px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 14px 36px -14px rgba(0,0,0,.4);
  }
  .who-menu-head {
    padding: 8px 9px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .who-menu-head .name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .who-menu-head .email { font-size: 11.5px; color: var(--faint); margin-top: 2px; word-break: break-all; }
  .who-menu-head .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .who-menu button {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 9px;
    border: 0; background: none; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 550; color: var(--ink); text-align: left;
  }
  .who-menu button:hover, .who-menu button:focus-visible { background: var(--bg); outline: none; }
  .who-menu button.danger { color: var(--fail); border-top: 1px solid var(--line); margin-top: 4px; border-radius: 0 0 6px 6px; }

  /* ---------- layout ---------- */
  .app-frame {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-height: 0;
  }
  .app-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  /* Full-height rail beside a top bar that only spans the work area — the
     classic app shell, without a band of search bar floating over empty rail. */
  .app-frame.has-sidebar .app-body {
    display: grid;
    grid-template-columns: var(--rail-w, 220px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      'rail topbar'
      'rail main';
  }
  .app-frame.has-sidebar .rail { grid-area: rail; }
  .app-frame.has-sidebar .topbar {
    grid-area: topbar;
    border-left: 0;
  }
  .app-frame.has-sidebar .shell {
    grid-area: main;
    min-height: 0;
    overflow: hidden;
  }
  .shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shell-main {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .screen-dashboard {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .screen-dashboard[hidden] { display: none !important; }
  .rail {
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: width 0.2s ease;
  }
  .rail-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 0 8px;
    scrollbar-gutter: stable;
  }
  .rail-footer {
    flex: none;
    margin-top: auto;
    padding: 8px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rail-head {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    gap: 8px;
  }
  .rail-head .brand { font-size: 15px; flex: 1; min-width: 0; }
  .rail-section { padding: 0; }
  .rail-section + .rail-section {
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .app-frame.has-sidebar .topbar .brand-fallback { display: none; }
  /* Rail-only embed: sidebar beside a React page — hide top bar and main pane. */
  body[data-atm-rail-only] .topbar,
  body[data-atm-rail-only] .shell { display: none !important; }
  body[data-atm-rail-only] .app-body,
  body[data-atm-rail-only] .app-frame { height: 100%; min-height: 0; }
  body[data-atm-rail-only] .app-frame.has-sidebar .app-body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 1fr;
    grid-template-areas: 'rail';
  }
  body[data-atm-rail-only] .rail {
    grid-area: rail;
    height: 100%;
    border-right: 0;
    overflow-x: hidden;
  }
  body[data-atm-rail-only] .app-frame { overflow: hidden; }
  .navitem.nav-icon { justify-content: flex-start; gap: 10px; }
  .navitem.nav-icon svg { flex: none; color: var(--muted); width: 16px; height: 16px; }
  .navitem.nav-icon[aria-current="true"] svg { color: var(--accent); }
  @media (max-width: 1100px) {
    .app-frame.has-sidebar { --rail-w: 204px; }
  }
  @media (max-width: 900px) {
    .app-frame.has-sidebar { --rail-w: 188px; }
  }

  .rail h3 {
    margin: 4px 12px 8px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 600;
  }
  .navitem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: calc(100% - 16px);
    margin: 2px 8px;
    padding: 8px 10px;
    background: none;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    color: var(--ink-2);
    transition: background 0.12s ease, color 0.12s ease;
  }
  .navitem:hover { background: var(--line-soft); color: var(--ink); }
  .navitem[aria-current="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .navitem .count {
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--line-soft);
  }
  .navitem .label { min-width: 0; flex: 1; }
  .navitem[aria-current="true"] .count {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .facet { padding: 2px 14px 8px; }
  .facet label {
    display: flex; align-items: center; gap: 8px; padding: 4px 0;
    font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  }
  .facet input { accent-color: var(--accent); margin: 0; }
  .facet .n { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .main {
    flex: 1;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: scroll;
    scrollbar-gutter: stable;
    scrollbar-width: auto;
    scrollbar-color: var(--muted) var(--line-soft);
  }
  .main::-webkit-scrollbar {
    width: 14px;
    height: 14px;
  }
  .main::-webkit-scrollbar-track {
    background: var(--line-soft);
  }
  .main::-webkit-scrollbar-thumb {
    background: var(--muted);
    border-radius: 8px;
    border: 3px solid var(--line-soft);
  }
  .main::-webkit-scrollbar-thumb:hover {
    background: var(--ink-2);
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .toolbar h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .toolbar .result { font-size: 12.5px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button {
    border: 0; background: none; padding: 6px 12px; font-size: 12.5px;
    cursor: pointer; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

  /* ---------- table ---------- */
  .tablewrap { padding: 0 18px 60px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 53px; z-index: 4; background: var(--bg);
    text-align: left; font-size: 12px; letter-spacing: 0;
    text-transform: none;
    color: var(--muted); font-weight: 600; padding: 0; white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  thead th button {
    display: inline-flex; align-items: center; gap: 5px;
    width: 100%; padding: 10px 10px; margin: 0; border: 0; background: transparent;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    cursor: pointer; text-align: left;
  }
  thead th button:hover { color: var(--ink); }
  thead th[aria-sort="ascending"] button,
  thead th[aria-sort="descending"] button { color: var(--ink); }
  thead th .sortcaret {
    font-size: 9px; opacity: 0; transition: opacity .12s ease;
  }
  thead th button:hover .sortcaret { opacity: .45; }
  thead th[aria-sort="ascending"] .sortcaret,
  thead th[aria-sort="descending"] .sortcaret { opacity: 1; }
  tbody tr { background: var(--panel); cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .thumb {
    width: 84px; height: 50px; border-radius: 4px; overflow: hidden;
    background: var(--stage); flex: none; position: relative; display: block;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur {
    position: absolute; right: 3px; bottom: 3px; padding: 1px 4px; border-radius: 3px;
    background: rgba(0,0,0,.78); color: #fff; font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .titlecell { min-width: 220px; }
  .titlecell .t { font-weight: 600; font-size: 13px; }
  .titlecell .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .chip.pass, .chip.green { background: var(--pass-soft); color: var(--pass); }
  .chip.fail, .chip.red { background: var(--fail-soft); color: var(--fail); }
  .chip.unknown, .chip.yellow { background: var(--unknown-soft); color: var(--unknown); }
  .chip.hold { background: var(--ink); color: var(--panel); }
  .chip.neutral { background: var(--line-soft); color: var(--ink-2); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  tr .chip.yellow .dot,
  tr.jobrow .chip.unknown .dot { animation: recpulse 1.2s ease-in-out infinite; }
  @keyframes recpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  .tier {
    display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px;
    font-weight: 700; background: var(--line-soft); color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .when { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .when small { display: block; color: var(--faint); font-size: 11px; }

  /* ---------- job files ---------- */
  tr.jobrow { background: var(--bg); cursor: pointer; }
  tr.jobrow:hover { background: var(--line-soft); }
  tr.jobrow td {
    padding: 10px 10px;
    border-top: 2px solid var(--line);
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  tr.jobrow td.jobpreview { width: 96px; padding-right: 4px; }
  tr.jobrow td.titlecell { padding-left: 18px; }
  tr.jobrow td.titlecell .t {
    display: inline-block;
    vertical-align: middle;
    max-width: 100%;
    font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  tr.jobrow td.titlecell .job-open {
    display: inline-block;
    vertical-align: middle;
    max-width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  tr.jobrow td.titlecell .job-open:hover { color: var(--accent); text-decoration: underline; }
  .jobfile { display: inline-flex; align-items: center; gap: 12px; min-width: 0; vertical-align: middle; }
  .jobfile .caret2 { flex: none; color: var(--faint); transition: transform .15s; }
  tr.jobrow[aria-expanded="false"] .caret2 { transform: rotate(-90deg); }
  .jobfile .folder { flex: none; color: var(--accent); width: 22px; height: 22px; }
  .job-acts { display: flex; align-items: center; gap: 2px; flex: none; }
  .job-act {
    flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center;
  }
  .job-act:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .job-act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .sheet-narrow { width: min(520px, 100%); height: auto; max-height: min(88vh, 720px); }
  .jf-tabs { display: flex; gap: 4px; padding: 10px 16px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .jf-tabs button {
    border: 0; background: none; padding: 8px 10px; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .jf-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .jf-body { padding: 16px 18px 20px; overflow-y: auto; }
  .jf-body label { display: block; margin-top: 10px; }
  .jf-body label > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
  .jf-body input, .jf-body select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px;
  }
  .jf-body .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .jf-submit {
    margin-top: 14px; width: 100%; border: 0; border-radius: 8px; padding: 10px 14px;
    background: var(--accent); color: #fff; font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer;
  }
  .jf-submit:disabled { opacity: .55; cursor: default; }
  .jf-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .jf-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .jf-list .who { font-size: 13px; font-weight: 600; color: var(--ink); }
  .jf-list .meta { font-size: 11.5px; color: var(--muted); }
  .jf-copy { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
  .jf-copy:hover { color: var(--ink); }
  .jf-note { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .jf-made { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--line); font-size: 12.5px; }
  .jf-made code { display: block; margin-top: 4px; font-size: 11px; word-break: break-all; color: var(--ink-2); }

  /* ---------- row actions ---------- */
  td.uploader .cellrow {
    display: inline-flex; align-items: center; justify-content: space-between;
    gap: 10px; width: 100%; box-sizing: border-box; vertical-align: middle;
  }
  .kebab {
    flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center;
  }
  .kebab:hover, .kebab[aria-expanded="true"] { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .kebab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rowmenu {
    position: fixed; z-index: 60; min-width: 172px; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 14px 36px -14px rgba(0,0,0,.4);
  }
  .rowmenu button {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 9px;
    border: 0; background: none; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 550; color: var(--ink); text-align: left;
  }
  .rowmenu button:hover, .rowmenu button:focus-visible { background: var(--bg); outline: none; }
  .rowmenu button svg { flex: none; color: var(--muted); }
  .rowmenu button.danger { color: var(--fail); }
  .rowmenu button.danger svg { color: currentColor; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(6px);
    z-index: 70; padding: 9px 14px; border-radius: 9px; font-size: 12.5px; line-height: 1.45;
    background: var(--ink); color: var(--panel); opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; max-width: min(92vw, 460px); text-align: center;
  }
  .toast[data-on="1"] { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty {
    padding: 48px 24px; text-align: center; color: var(--muted);
    max-width: 28rem; margin: 0 auto;
  }
  .empty .empty-title {
    margin: 0; font-size: 16px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em;
  }
  .empty .empty-body {
    margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted);
  }

  /* ---------- detail ---------- */
  .detail {
    position: fixed; inset: 0; z-index: 40; display: none;
    place-items: center;
    padding: 16px 20px;
    background: rgba(28, 25, 23, .48);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .detail[data-open="1"] { display: grid; }
  .sheet {
    position: relative;
    width: min(1440px, 100%);
    height: 100%;
    max-height: 100%;
    overflow: hidden;
    border-radius: 14px;
    background: var(--bg);
    box-shadow: 0 28px 80px -24px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  @media (max-width: 860px) {
    .detail { padding: 8px; }
    .sheet { border-radius: 10px; }
  }
  .sheethead {
    display: flex; align-items: flex-start; gap: 14px; flex: none;
    padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .sheethead h2 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; }
  .sheethead .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .closebtn {
    margin-left: auto; border: 1px solid var(--line); background: var(--panel);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer; color: var(--muted);
    display: grid; place-items: center; flex: none;
  }
  .closebtn:hover { background: var(--line-soft); color: var(--ink); }

  .sheetbody {
    flex: 1; min-height: 0; overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.85fr);
    grid-template-rows: minmax(0, 1fr);
  }
  @media (max-width: 860px) { .sheetbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 1fr); overflow-y: auto; } }

  .stage { padding: 16px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .player { background: var(--stage); border-radius: 10px; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .player .frame { flex: 1; min-height: 240px; display: grid; place-items: center; }
  .player .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .controls {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; flex: none;
    border-top: 1px solid var(--stage-2); color: var(--stage-ink);
  }
  .controls button {
    border: 0; background: var(--stage-2); color: var(--stage-ink); width: 30px; height: 30px;
    border-radius: 7px; cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .controls button:hover { background: var(--accent); color: #FFFFFF; }
  .scrub { flex: 1; display: flex; gap: 3px; }
  .scrub button {
    flex: 1; height: 6px; border-radius: 3px; background: var(--stage-2); width: auto;
    padding: 0; border: 0; cursor: pointer;
  }
  .scrub button[aria-pressed="true"] { background: var(--accent); }
  .controls .time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); min-width: 74px; text-align: right; }

  .player video {
    display: block; width: 100%; height: 100%; max-height: none; object-fit: contain; background: #1A1815;
  }

  .side {
    padding: 16px 18px 0;
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 860px) { .side { min-height: 420px; } }
  .tabs { display: flex; gap: 3px; background: var(--line-soft); padding: 3px; border-radius: 8px; flex: none; }
  .tabs button {
    flex: 1; min-width: 0; border: 0; background: none; padding: 7px 8px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; color: var(--muted); font-weight: 550;
  }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  #d-panel {
    flex: 1;
    min-height: 0;
    margin-top: 14px;
    overflow-y: auto;
  }
  #d-panel.panel-analysis {
    overflow: hidden;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
  }

  .analysis-pane {
    min-height: 0;
    height: 100%;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
  }
  .analysis-notes {
    min-height: 0;
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  .analysis-ask {
    min-width: 0;
    padding: 12px 0 16px;
    border-top: 1px solid var(--line-soft);
    background: var(--panel);
  }

  .alog-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 8px;
  }
  .alog-head h4 {
    margin: 0; font-size: 13px; letter-spacing: -0.01em;
    color: var(--ink); font-weight: 650;
  }
  .alog-head .livepill {
    font-size: 11px; font-weight: 650; letter-spacing: .01em;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 8px; border-radius: 999px;
  }
  .alog { list-style: none; margin: 0; padding: 0; }
  .alog li {
    display: grid; grid-template-columns: 46px 1fr; gap: 10px;
    padding: 9px 8px 9px 4px; border-radius: 8px; cursor: pointer;
    font-size: 13px; line-height: 1.45; color: var(--ink-2);
  }
  .alog li + li { border-top: 1px solid var(--line-soft); }
  .alog li.soon { display: none; }
  .alog li.seen { color: var(--ink); }
  .alog li.on {
    display: grid; background: var(--accent-soft); color: var(--ink);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .alog .t { font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 2px; }
  .alog li.on .t { color: var(--accent); font-weight: 700; }
  .alog li.writing [data-full]::after {
    content: ''; display: inline-block; width: 6px; height: 12px; margin-left: 3px;
    background: var(--accent); vertical-align: text-bottom;
    animation: alog-caret 1s step-end infinite;
  }
  @keyframes alog-caret { 50% { opacity: 0; } }
  .alog-wait {
    margin: 18px 4px 8px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }
  .alog-wait[hidden] { display: none; }

  .ask-thread {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 168px; overflow-y: auto;
    scrollbar-width: thin;
  }
  .ask-bubble {
    max-width: 94%; padding: 8px 11px; border-radius: 12px;
    font-size: 13px; line-height: 1.45; white-space: pre-wrap;
  }
  .ask-bubble.user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ask-bubble.assistant {
    align-self: flex-start; background: var(--line-soft); color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .ask-bubble.pending { color: var(--muted); font-style: italic; }
  .ask-suggest { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
  .ask-suggest button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .ask-suggest button:hover { border-color: var(--accent); color: var(--accent); }
  .ask-form { display: flex; gap: 6px; margin-top: 10px; }
  .ask-form input {
    flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px;
    padding: 0 12px; background: var(--bg); color: var(--ink); font: inherit; outline: none;
  }
  .ask-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ask-form button[type="submit"] {
    border: 0; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 14px; font-weight: 650; cursor: pointer; flex: none;
  }
  .ask-form button[type="submit"]:disabled { opacity: .55; cursor: default; }

  .kv { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 6px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--ink); word-break: break-word; }
  .kv dd.mono { font-family: var(--mono); font-size: 11.5px; }

  .checkrow { display: flex; gap: 9px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .checkrow:last-child { border-bottom: 0; }
  .checkrow .what { font-size: 12.5px; font-weight: 600; }
  .checkrow .detail-txt { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

  .verdictline {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 9px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
  }
  .verdictline.pass { background: var(--pass-soft); color: var(--pass); }
  .verdictline.fail { background: var(--fail-soft); color: var(--fail); }
  .verdictline.unknown { background: var(--unknown-soft); color: var(--unknown); }

  .scopelist { list-style: none; margin: 0; padding: 0; }
  .scopelist li {
    display: flex; align-items: flex-start; gap: 9px; padding: 8px 0;
    border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
  }
  .scopelist li:last-child { border-bottom: 0; }
  .scopelist .label { flex: 1; }

  .custody { list-style: none; margin: 0; padding: 0; position: relative; }
  .custody::before {
    content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 1px; background: var(--line);
  }
  .custody li { position: relative; padding: 0 0 15px 24px; font-size: 12.5px; }
  .custody li::before {
    content: ''; position: absolute; left: 2px; top: 4px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--panel); border: 2px solid var(--accent);
  }
  .custody li.ai::before { border-color: var(--accent); }
  .custody .act { font-weight: 650; }
  .custody .by { color: var(--muted); }
  .custody .at { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .banner {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 11px 13px; border-radius: 9px; font-size: 12.5px; line-height: 1.5;
    margin-bottom: 14px;
  }
  .banner.hold { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .banner.warn { background: var(--unknown-soft); color: var(--unknown); }

  .footnote { font-size: 11.5px; color: var(--faint); line-height: 1.55; margin-top: 10px; }
  .srhide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<div class="app-frame" id="app-frame">
  <div class="app-body">
  <aside class="rail" id="main-rail" aria-label="Navigation">
    <div class="rail-head" id="rail-head" hidden>
      <button type="button" class="brand" id="brand-home" aria-label="Atmosphere home">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect width="22" height="2.8" fill="currentColor" opacity="0.3" />
          <rect y="4.8" width="22" height="2.8" fill="currentColor" opacity="0.5" />
          <rect y="9.6" width="22" height="2.8" fill="currentColor" opacity="0.68" />
          <rect y="14.4" width="22" height="2.8" fill="currentColor" opacity="0.88" />
          <rect y="19.2" width="22" height="2.8" fill="#F2670C" />
        </svg>
        <span>Atmosphere</span>
      </button>
    </div>

    <div class="rail-body">
    <div class="rail-section" id="platform-nav" hidden>
      <button type="button" class="navitem nav-icon" id="nav-field" data-route="/field">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17 16 12"/></svg>
        <span class="label">Overview</span>
      </button>
      <button type="button" class="navitem nav-icon" id="nav-start-job" data-tour="nav-start-job">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span class="label">Start a job</span>
      </button>
      <button type="button" class="navitem nav-icon app-nav" data-screen="dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="label">Dashboard</span>
      </button>
      <button type="button" class="navitem nav-icon" id="nav-jobs" data-route="/jobs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.75" y="7.25" width="18.5" height="12" rx="2.25"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M2.75 12h18.5"/></svg>
        <span class="label">My jobs</span>
      </button>
    </div>

    <div class="rail-section" id="evidence-nav">
    <h3>Videos</h3>
    <button class="navitem nav-icon" data-view="all" data-label="All videos" title="All videos"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l4.2-2.6a.7.7 0 0 1 1.05.6v6.99a.7.7 0 0 1-1.06.6l-4.19-2.59"/></svg><span class="label">All videos</span> <span class="count" id="n-all">0</span></button>
    <button class="navitem nav-icon" data-view="classified" data-label="Classified" title="Classified"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h14"/></svg><span class="label">Classified</span> <span class="count" id="n-classified">0</span></button>
    <button class="navitem nav-icon" data-view="unanalysed" data-label="Awaiting analysis" title="Awaiting analysis"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">Awaiting analysis</span> <span class="count" id="n-unan">0</span></button>
    <button class="navitem nav-icon" data-view="flagged" data-label="Needs review" title="Needs review"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4"/><path d="M4 4h11l-1.5 4L15 12H4"/></svg><span class="label">Needs review</span> <span class="count" id="n-flag">0</span></button>
    <button class="navitem nav-icon" data-view="hold" data-label="Legal hold" title="Legal hold"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="label">Legal hold</span> <span class="count" id="n-hold">0</span></button>
    </div>
    </div>

    var a = item.analysis || {};
    return integrityOf(item) !== 'pass' ||
      (a.state === 'done' && (a.materialChange === 'none' || a.materialChange === 'unclear'));
  }

  /* ------------------------------------------------------------------ *
   * Filters and list
   * ------------------------------------------------------------------ */

  function buildFacet(el, values, group) {
    el.innerHTML = values.map(function (v) {
      return '<label><input type="checkbox" data-group="' + group + '" value="' + esc(v.key) + '" /> ' +
        '<span>' + esc(v.label) + '</span><span class="n">' + v.n + '</span></label>';
    }).join('');
  }

  function tally(fn) {
    var out = {};
    EVIDENCE.forEach(function (e) { var k = fn(e); out[k] = (out[k] || 0) + 1; });
    return out;
  }

  function initFacets() {
    /* Job / company / capture facet filters removed from the sidebar — search
       and the evidence view tabs carry enough filtering for most work. */
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return EVIDENCE.filter(function (e) {
      if (state.view === 'flagged' && !needsAttention(e)) return false;
      if (state.view === 'classified' && (e.analysis || {}).state !== 'done') return false;
      if (state.view === 'unanalysed' && (e.analysis || {}).state === 'done') return false;
      if (state.view === 'hold' && !(e.hold && e.hold.on)) return false;
      if (Object.keys(state.jobs).length && !state.jobs[e.job]) return false;
      if (Object.keys(state.companies).length && !state.companies[e.company]) return false;
      if (Object.keys(state.phases).length && !state.phases[e.phase]) return false;
      if (q) {
        var hay = [e.id, e.company, e.person, e.hash, JOBS[e.job].name, JOBS[e.job].number, e.phase].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(compareEvidence);
  }

  function integrityRank(item) {
    var v = integrityOf(item);
    return v === 'fail' ? 2 : v === 'unknown' ? 1 : 0;
  }

  function sortValue(item, key) {
    if (key === 'preview' || key === 'clip') return Number(item.duration) || 0;
    if (key === 'job' || key === 'video') {
      var job = JOBS[item.job] || {};
      return String(job.name || item.jobName || '') + ' ' + String(item.phase || '');
    }
    if (key === 'status') return isActiveRecording(item) ? 1 : 0;
    if (key === 'integrity') return integrityRank(item);
    if (key === 'recorded') return String(item.workDate || '') + 'T' + String(item.uploadedAt || '');
    if (key === 'uploader') return String(item.person || '') + ' ' + String(item.company || '');
    return String(item.uploadedAt || '');
  }

  function compareEvidence(a, b) {
    var key = state.sortKey || 'recorded';
    var dir = state.sortDir === 'asc' ? 1 : -1;
    var av = sortValue(a, key);
    var bv = sortValue(b, key);
    var cmp = 0;
    if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
    else cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
    if (cmp) return cmp * dir;
    // Stable tie-break: newest upload first.
    return String(b.uploadedAt || '').localeCompare(String(a.uploadedAt || ''));
  }

  function syncSortHeaders() {
    var heads = document.getElementById('colheads');
    if (!heads) return;
    Array.prototype.forEach.call(heads.querySelectorAll('th[data-sort-key]'), function (th) {
      var key = th.getAttribute('data-sort-key');
      var caret = th.querySelector('.sortcaret');
      var active = key === state.sortKey;
      th.setAttribute('aria-sort', active ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
      if (caret) caret.textContent = active ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
      var btn = th.querySelector('button');
      if (btn) {
        btn.setAttribute(
          'aria-label',
          'Sort by ' + (btn.textContent || key).replace(/[↑↓↕]/g, '').trim() +
            (active ? (state.sortDir === 'asc' ? ', ascending' : ', descending') : ''),
        );
      }
    });
  }

  function setColumnSort(key) {
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      // Dates / ranks start newest / highest first; names start A→Z.
      state.sortDir = (key === 'job' || key === 'uploader') ? 'asc' : 'desc';
    }
    syncSortHeaders();
    render();
  }

  /**
   * The preview cell.
   *
   * A real clip shows a still out of itself — the frame the pipeline kept,
   * signed by the portal — because a column of identical drawn rectangles is
   * a column nobody can scan. The drawn frame stays for the demo artifact,
   * which has no footage behind it, and for a clip whose stills have not been
   * extracted yet.
   */
  function drawnFrame(item) {
    var after = item && item.after;
    if (!after) return frameSVG({ wet: 0.3, cut: 0.2, gear: 0, night: false, label: null });
    return frameSVG({ wet: after.wet, cut: after.cut, gear: after.gear, night: false, label: null });
  }

  function thumbFor(item) {
    return item.poster || drawnFrame(item);
  }

  function clipRow(e) {
    var job = JOBS[e.job] || { name: e.jobName || 'Job', number: null };
    var status = clipStatus(e);
    var phase = e.phase ? String(e.phase).replace(/_/g, ' ') : 'Video';
    phase = phase.charAt(0).toUpperCase() + phase.slice(1);
    return '' +
      '<tr tabindex="0" data-id="' + e.id + '">' +
        '<td><span class="thumb"><img class="shot" alt="" loading="lazy" decoding="async" src="' + esc(thumbFor(e)) + '" /><span class="dur">' + dur(e.duration) + '</span></span></td>' +
        '<td class="titlecell">' +
          '<div class="t">' + esc(job.name) + '</div>' +
          '<div class="s">' + esc(phase) +
            (e.hold && e.hold.on ? ' · <span class="chip hold"><span class="dot"></span>Legal hold</span>' : '') +
          '</div>' +
        '</td>' +
        '<td><span class="chip ' + status.cls + '"><span class="dot"></span>' + status.text + '</span></td>' +
        '<td class="when">' + dayLabel(e.workDate) + '<small>' + stamp(e.uploadedAt) + '</small></td>' +
        '<td class="when uploader"><span class="cellrow"><span>' + esc(e.person || '—') + '<small>' + esc(e.company || '') + '</small></span>' +
          '<button class="kebab" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + esc(e.id) + '">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>' +
          '</button></span></td>' +
      '</tr>';
  }

  function clipInstant(e, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = e[keys[i]];
      if (!v) continue;
      var t = Date.parse(keys[i] === 'workDate' ? v + 'T12:00:00' : v);
      if (!isNaN(t)) return t;
    }
    return 0;
  }

  function latestClip(items, keys) {
    var best = null;
    var bestT = -1;
    items.forEach(function (e) {
      var t = clipInstant(e, keys);
      if (t >= bestT) { bestT = t; best = e; }
    });
    return best;
  }

  /**
   * Filming still in flight — not an uploaded file whose analysis is queued.
   * A landed video is Recorded even when the model has not read it yet.
   */
  function isActiveRecording(e) {
    var a = (e.analysis || {}).state;
    if (a === 'queued' || a === 'done' || a === 'paired' || a === 'skipped' || a === 'failed') {
      return false;
    }
    var t = clipInstant(e, ['uploadedAt', 'capturedAt']);
    return Boolean(t && (Date.now() - t) < 30 * 60 * 1000);
  }

  function jobRecordingStatus(items) {
    if (!items.length) return { cls: 'red', text: 'No recording' };
    if (items.some(isActiveRecording)) return { cls: 'yellow', text: 'Recording' };
    return { cls: 'green', text: 'Recorded' };
  }

  function clipStatus(e) {
    if (isActiveRecording(e)) return { cls: 'yellow', text: 'Recording' };
    return { cls: 'green', text: 'Recorded' };
  }

  /**
   * Any Dashboard folder can open the job record. Demo keys (cedar / …) map
   * onto the Job Progress fixtures; org folders use the real job id.
   */
  function recordJobId(key) {
    if (key === 'cedar') return 'job-1038';
    if (key === 'meridian') return 'job-1041';
    if (key === 'camden') return 'job-1044';
    return key;
  }

  function canOpenJobRecord(key) {
    return Boolean(key) && key !== 'shared';
  }

  function openJobRecord(jobKey) {
    if (!canOpenJobRecord(jobKey)) return;
    var job = JOBS[jobKey] || {};
    var id = recordJobId(jobKey);
    var to = '/job-progress?job=' + encodeURIComponent(id);
    if (job.name) to += '&title=' + encodeURIComponent(job.name);
    if (job.number != null) to += '&number=' + encodeURIComponent(String(job.number));
    if (EMBEDDED) window.parent.postMessage({ atmosphere: 'navigate', to: to }, '*');
    else location.href = to;
  }

  var JOB_BOARD = {};
  var DEMO_SHARES = {};
  var DEMO_PEOPLE = {
    cedar: [
      { name: 'Cedar Ridge HOA', role: 'owner' },
      { name: 'Delgado Roofing', role: 'subcontractor', trade: 'roofing' }
    ],
    meridian: [{ name: 'Property owner', role: 'owner' }],
    camden: [{ name: 'Camden Court HOA', role: 'owner' }]
  };
  var jobSheet = { key: null, tab: 'share', made: null, error: null, busy: false };

  /**
   * Trades a person on a job can be. Keep in sync with
   * frontend/src/components/setup/verifierSetupOptions.ts JOB_PARTY_TRADE_OPTIONS.
   * General contractor is a party role below, not a trade.
   */
  var JOB_TRADES = [
    { value: 'hvac', label: 'HVAC' },

    { value: 'electrical', label: 'Electrical' },
    { value: 'drywall', label: 'Drywall' },
    { value: 'painting', label: 'Painting' },
    { value: 'roofing', label: 'Roofing' },
    { value: 'flooring', label: 'Flooring' },
    { value: 'carpentry', label: 'Carpentry' },
    { value: 'masonry', label: 'Masonry & concrete' },
    { value: 'insulation', label: 'Insulation' },
    { value: 'siding', label: 'Siding & exterior' },
    { value: 'windows_doors', label: 'Windows & doors' },
    { value: 'landscaping', label: 'Landscaping' },
    { value: 'cleaning', label: 'Cleaning & janitorial' },
    { value: 'facilities', label: 'Facilities maintenance' },
    { value: 'fire_life_safety', label: 'Fire & life safety' },

  ];
  var JOB_PARTY_ROLES = [

  function jsonOrNull(r) { return r.ok ? r.json() : Promise.resolve(null); }

  function tradeLabel(value) {
    if (!value) return '';
    for (var i = 0; i < JOB_TRADES.length; i++) {
      if (JOB_TRADES[i].value === value) return JOB_TRADES[i].label;
    }
    return value;
  }

  function roleWord(role, trade) {
    if (trade) return tradeLabel(trade);
    if (role === 'owner') return 'Homeowner';
    if (role === 'adjuster') return 'Adjuster';
    if (role === 'general_contractor') return 'General contractor';
    if (role === 'subcontractor') return 'Subcontractor';
    return role || 'On the job';
  }

  function parseInviteKind(value) {
    if (value && value.indexOf('role:') === 0) return { role: value.slice(5), trade: null };
    if (value && value.indexOf('trade:') === 0) return { role: 'subcontractor', trade: value.slice(6) };
    return { role: 'subcontractor', trade: null };
  }

  function inviteKindOptionsHtml() {
    var html = '<option value="" disabled selected>Choose a trade or role</option>';
    html += '<optgroup label="Trade">';
    JOB_TRADES.forEach(function (t) {
      html += '<option value="trade:' + t.value + '">' + esc(t.label) + '</option>';
    });
    html += '</optgroup><optgroup label="On this job">';
    JOB_PARTY_ROLES.forEach(function (r) {
      html += '<option value="role:' + r.value + '">' + esc(r.label) + '</option>';
    });
    html += '</optgroup>';
    return html;
  }

  function boardFromClips(key, items) {
    var daysMap = {};
    items.forEach(function (e) { if (e.workDate) daysMap[e.workDate] = true; });
    var dayKeys = Object.keys(daysMap).sort().reverse();
    var people = (DEMO_PEOPLE[key] || []).slice();
    var seenC = {};
    people.forEach(function (p) { seenC[p.name] = 1; });
    items.forEach(function (e) {
      if (e.company && !seenC[e.company]) {
        seenC[e.company] = 1;
        people.push({ name: e.company, role: 'subcontractor' });
      }
    });
    var scope = [];
    items.forEach(function (e) {
      if (e.analysis && e.analysis.scope && e.analysis.scope.length) scope = e.analysis.scope;
    });
    var done = scope.filter(function (s) { return s.verdict === 'appears_complete'; }).length;
    var verifiedDays = 0;
    dayKeys.forEach(function (d) {
      var onDay = items.filter(function (e) { return e.workDate === d; });
      if (onDay.some(function (e) { return integrityOf(e) === 'pass' && !isActiveRecording(e); })) verifiedDays += 1;
    });
    var inProgress = items.some(isActiveRecording) ? 1 : 0;
    var recent = dayKeys.slice(0, 5).map(function (d) {
      var onDay = items.filter(function (e) { return e.workDate === d; });
      var active = onDay.some(isActiveRecording);
      var fail = onDay.some(function (e) { return integrityOf(e) === 'fail'; });
      var pass = onDay.some(function (e) { return integrityOf(e) === 'pass'; });
      return {
        day: d,
        label: active ? 'Active' : fail ? 'Issue' : pass ? 'Verified' : 'In review',
        tone: active ? 'caution' : fail ? 'danger' : pass ? 'success' : 'neutral'
      };
    });
    return {
      status: 'ready',
      scopePct: scope.length ? Math.round((done / scope.length) * 100) : 0,
      days: dayKeys.length,
      verified: verifiedDays,
      inProgress: inProgress,
      people: people,
      shares: DEMO_SHARES[key] || [],
      recent: recent,
      attention: null
    };
  }

  function boardFromRecord(record, proof, shares) {
    var scope = (record.scope || []).filter(function (s) { return s.state !== 'excluded'; });
    var approved = scope.filter(function (s) { return s.state === 'approved'; }).length;
    var days = (proof && proof.days) || [];
    var counts = (proof && proof.counts) || {};
    var risks = (record.risks || []).filter(function (r) { return r.level === 'blocker' || r.level === 'warn'; });
    var people = (record.parties || []).filter(function (p) { return !p.revoked_at; }).map(function (p) {
      return { name: p.company, role: p.role, id: p.id, email: p.email, trade: p.trade };
    });
    var recent = days.slice(0, 5).map(function (d) {
      var label = d.contradicted ? 'Issue' : (d.accepted || d.payable) ? 'Verified' : (d.hasBefore && !d.hasAfter) ? 'On site' : 'In review';
      var tone = d.contradicted ? 'danger' : (d.accepted || d.payable) ? 'success' : (d.hasBefore && !d.hasAfter) ? 'caution' : 'neutral';
      return { day: d.workDate, label: label, tone: tone };
    });
    return {
      status: 'ready',
      scopePct: scope.length ? Math.round((approved / scope.length) * 100) : 0,
      days: counts.days || days.length,
      verified: days.filter(function (d) { return d.payable || d.accepted; }).length,
      inProgress: days.filter(function (d) { return d.hasBefore && !d.hasAfter; }).length,
      people: people,
      shares: shares || [],
      recent: recent,
      attention: risks[0] ? risks[0].title : null,
      record: record
    };
  }

  function hydrateJobBoard(key) {
    var items = EVIDENCE.filter(function (e) { return e.job === key; });
    if (!canOpenJobRecord(key)) {
      JOB_BOARD[key] = boardFromClips(key, items);
      return;
    }
    var cur = JOB_BOARD[key];
    if (cur && (cur.status === 'loading' || cur.status === 'ready')) return;
    JOB_BOARD[key] = { status: 'loading' };
    Promise.all([
      fetch('/api/operations/shared/' + encodeURIComponent(key), { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; }),
      fetch('/api/operations/shared/' + encodeURIComponent(key) + '/proof', { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; }),
      fetch('/api/evidence-portal/shares?jobId=' + encodeURIComponent(key) + '&kind=progress', { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; })
    ]).then(function (parts) {
      var record = parts[0];
      var proof = parts[1];
      var sharePayload = parts[2];
      if (record && record.job) {
        JOB_BOARD[key] = boardFromRecord(record, proof, (sharePayload && sharePayload.shares) || []);
      } else {
        JOB_BOARD[key] = boardFromClips(key, items);
      }
      if (jobSheet.key === key) paintJobFileSheet();
    });
  }

  /**

      : '<div class="t fname">' + nameInner + '</div>';
    var acts =
      '<span class="job-acts">' +
        '<button type="button" class="job-act" data-job-act="invite" title="Invite people" aria-label="Invite people to ' + esc(job.name) + '">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>' +
        '</button>' +
        '<button type="button" class="job-act" data-job-act="share" title="Share this job" aria-label="Share ' + esc(job.name) + '">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 4v12"/><path d="M8 8l4-4 4 4"/></svg>' +
        '</button>' +
        '<button type="button" class="kebab" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + esc(job.name) + '">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>' +
        '</button>' +
      '</span>';
    return '' +
      '<tr class="jobrow" tabindex="0" data-job="' + esc(key) + '" aria-expanded="' + String(!collapsed) + '">' +
        '<td class="jobpreview"><span class="jobfile">' +
          '<svg class="caret2" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<svg class="folder" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg>' +
        '</span></td>' +
        '<td class="titlecell">' + nameCell + '</td>' +
        '<td><span class="chip ' + status.cls + '"><span class="dot"></span>' + status.text + '</span></td>' +
        '<td class="when">' + recordedDay + (recordedStamp ? '<small>' + recordedStamp + '</small>' : '') + '</td>' +
        '<td class="when uploader"><span class="cellrow"><span>' + uploader + '</span>' + acts + '</span></td>' +
      '</tr>';
  }

  function render() {
    var list = visible();
    var emptyEl = $('#empty');
    var emptyTitle = document.getElementById('empty-title');
    var emptyBody = document.getElementById('empty-body');
    var clipTable = document.getElementById('clip-table');
    var jobFileKeys = Object.keys(JOBS);
    var showJobFiles = state.groupByJob && jobFileKeys.length > 0 && !state.q && state.view === 'all';
    var hasRows = list.length > 0 || showJobFiles;
    if (emptyEl) {
      emptyEl.hidden = hasRows;
      if (!hasRows) {
        if (!EVIDENCE.length && !jobFileKeys.length) {
          if (emptyTitle) emptyTitle.textContent = 'No jobs yet';
          if (emptyBody) emptyBody.textContent = 'Start a job and the name shows up here. Footage files under it as crews film.';
        } else if (!EVIDENCE.length) {
          if (emptyTitle) emptyTitle.textContent = 'No clips yet';
          if (emptyBody) emptyBody.textContent = 'When Field Capture uploads a day film, it shows up here.';
        } else {
          if (emptyTitle) emptyTitle.textContent = 'No matches';
          if (emptyBody) emptyBody.textContent = 'Try clearing search or picking another view.';
        }
      }
    }
    // Keep column headers visible even with no rows.
    if (clipTable) clipTable.hidden = false;
    syncSortHeaders();

    if (!hasRows) {
      $('#resultcount').textContent = EVIDENCE.length
        ? '0 of ' + EVIDENCE.length + ' clips'
        : '0 clips';
      rowsEl.innerHTML = '';
      return;
    }

    if (state.groupByJob) {
      // Job files exist as soon as the office starts a job. Clips file
      // themselves under the job they arrived with.
      var order = [];
      var groups = {};
      jobFileKeys.forEach(function (k) {
        groups[k] = [];
        order.push(k);
      });
      list.forEach(function (e) {
        if (!groups[e.job]) { groups[e.job] = []; order.push(e.job); }
        groups[e.job].push(e);
      });
      if (state.q || state.view !== 'all') {
        order = order.filter(function (k) { return (groups[k] || []).length > 0; });
      }
      if (!jobFileKeys.length) {
        order.sort(function (ka, kb) {
          return compareEvidence(groups[ka][0], groups[kb][0]);
        });
      }
      $('#resultcount').textContent = list.length + ' of ' + EVIDENCE.length + ' clips · ' +
        order.length + ' job file' + (order.length === 1 ? '' : 's');
      rowsEl.innerHTML = order.map(function (k) {
        var collapsed = !!state.collapsed[k];
        var clips = collapsed ? '' : (groups[k] || []).map(clipRow).join('');
        return jobRow(k, groups[k] || [], collapsed) + clips;
      }).join('');
    } else {
      $('#resultcount').textContent = list.length + ' of ' + EVIDENCE.length + ' clips';
      rowsEl.innerHTML = list.map(clipRow).join('');
    }

    Array.prototype.forEach.call(rowsEl.querySelectorAll('tr[data-id]'), function (tr) {
      tr.addEventListener('click', function () { open(tr.dataset.id); });
      tr.addEventListener('keydown', function (ev2) {
        if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); open(tr.dataset.id); }
      });
      // The dots are on the row but not of the row: opening the menu must not
      // open the clip, on click or on Enter.
      var kb = tr.querySelector('.kebab');
      kb.addEventListener('click', function (ev2) { ev2.stopPropagation(); toggleMenu(kb, tr.dataset.id); });
      kb.addEventListener('keydown', function (ev2) { ev2.stopPropagation(); });
    });

    Array.prototype.forEach.call(rowsEl.querySelectorAll('tr.jobrow'), function (tr) {
      function flip() {
        state.collapsed[tr.dataset.job] = !state.collapsed[tr.dataset.job];
        render();
      }
      tr.addEventListener('click', function (ev) {
        if (ev.target.closest('.job-open, .job-act, .kebab, .job-acts')) return;
        flip();
      });
      tr.addEventListener('keydown', function (ev2) {
        if (ev2.target.closest && ev2.target.closest('.job-open, .job-act, .kebab')) return;
        if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); flip(); }
      });
      var openBtn = tr.querySelector('.job-open');
      if (openBtn) {
        openBtn.addEventListener('click', function (ev2) {
          ev2.preventDefault();
          ev2.stopPropagation();
          openJobRecord(tr.dataset.job);
        });
      }
      Array.prototype.forEach.call(tr.querySelectorAll('[data-job-act]'), function (btn) {
        btn.addEventListener('click', function (ev2) {
          ev2.preventDefault();
          ev2.stopPropagation();
          openJobFileSheet(tr.dataset.job, btn.getAttribute('data-job-act'));
        });
      });
      var kb = tr.querySelector('.kebab');
      if (kb) {
        kb.addEventListener('click', function (ev2) {
          ev2.stopPropagation();
          toggleJobMenu(kb, tr.dataset.job);
        });
        kb.addEventListener('keydown', function (ev2) { ev2.stopPropagation(); });
      }
    });
  }

  function counts() {
    $('#n-all').textContent = EVIDENCE.length;
    $('#n-classified').textContent = EVIDENCE.filter(function (e) { return (e.analysis || {}).state === 'done'; }).length;
    $('#n-flag').textContent = EVIDENCE.filter(needsAttention).length;
    $('#n-unan').textContent = EVIDENCE.filter(function (e) { return (e.analysis || {}).state !== 'done'; }).length;
    $('#n-hold').textContent = EVIDENCE.filter(function (e) { return e.hold && e.hold.on; }).length;
  }

  /* ------------------------------------------------------------------ *
   * Row actions
   *
   * One menu element, moved to whichever row's dots opened it — a menu per
   * row is a hundred hidden nodes doing the job of one. Each action lands
   * somewhere honest today: share hands over a reference and names where
   * real shares come from, delete respects a legal hold before it respects
   * a click, save routes to the download flow that settles the fee, and
   * export produces the record itself.
   * ------------------------------------------------------------------ */

  var menuEl = $('#rowmenu');
  var menuFor = null;   // clip id the open menu belongs to
  var menuBtn = null;   // the dots that opened it, for focus return

  function toggleMenu(btn, id) {
    if (menuFor === id && !menuEl.hidden) { closeMenu(); return; }
    closeMenu();
    closeJobMenu();
    menuFor = id; menuBtn = btn;
    btn.setAttribute('aria-expanded', 'true');
    menuEl.hidden = false;
    var r = btn.getBoundingClientRect();
    var mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = r.top - mh - 6; // flip up near the bottom
    menuEl.style.left = left + 'px';
    menuEl.style.top = Math.max(8, top) + 'px';
    menuEl.querySelector('button').focus();
  }

  function closeMenu() {
    if (menuEl.hidden) return;
    menuEl.hidden = true;
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    menuFor = null; menuBtn = null;
  }

  var jobMenuEl = $('#jobmenu');
  var jobMenuFor = null;
  var jobMenuBtn = null;

  function toggleJobMenu(btn, jobKey) {
    if (jobMenuFor === jobKey && jobMenuEl && !jobMenuEl.hidden) { closeJobMenu(); return; }
    closeMenu();
    closeJobMenu();
    jobMenuFor = jobKey; jobMenuBtn = btn;
    btn.setAttribute('aria-expanded', 'true');
    jobMenuEl.hidden = false;
    var r = btn.getBoundingClientRect();
    var mw = jobMenuEl.offsetWidth, mh = jobMenuEl.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
    jobMenuEl.style.left = left + 'px';
    jobMenuEl.style.top = Math.max(8, top) + 'px';
    jobMenuEl.querySelector('button').focus();
  }

  function closeJobMenu() {
    if (!jobMenuEl || jobMenuEl.hidden) return;
    jobMenuEl.hidden = true;
    if (jobMenuBtn) jobMenuBtn.setAttribute('aria-expanded', 'false');
    jobMenuFor = null; jobMenuBtn = null;
  }

  document.addEventListener('click', function (ev) {
    if (!menuEl.hidden && !menuEl.contains(ev.target)) closeMenu();
    if (jobMenuEl && !jobMenuEl.hidden && !jobMenuEl.contains(ev.target)) closeJobMenu();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      var sheet = document.getElementById('jobfile-sheet');
      if (sheet && sheet.getAttribute('data-open') === '1') { closeJobFileSheet(); return; }
      if (!menuEl.hidden) { var b = menuBtn; closeMenu(); if (b) b.focus(); return; }
      if (jobMenuEl && !jobMenuEl.hidden) { var jb = jobMenuBtn; closeJobMenu(); if (jb) jb.focus(); return; }
    }
    var openMenu = !menuEl.hidden ? menuEl : (jobMenuEl && !jobMenuEl.hidden ? jobMenuEl : null);
    if (!openMenu) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      var items = Array.prototype.slice.call(openMenu.querySelectorAll('button'));
      var i = items.indexOf(document.activeElement);
      items[(ev.key === 'ArrowDown' ? i + 1 : i - 1 + items.length) % items.length].focus();
    }
  });
  window.addEventListener('resize', function () { closeMenu(); closeJobMenu(); });
  window.addEventListener('scroll', function () { closeMenu(); closeJobMenu(); }, true);

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.setAttribute('data-on', '1');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.removeAttribute('data-on'); }, 3600);
  }

  Array.prototype.forEach.call(menuEl.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var id = menuFor;
      closeMenu();
      var item = EVIDENCE.filter(function (e) { return e.id === id; })[0];
      if (item) menuAction(b.dataset.act, item);
    });
  });

  function menuAction(act, item) {
    if (act === 'share') {
      // Real shares are issued from the platform, to a named account — what
      // this page can hand a colleague today is a reference to the clip.
      var link = location.href.split('#')[0] + '#' + item.id;
      var done = function () {
        toast('Clip reference copied. A new reviewer gets their own link from the platform — shares are account-to-account.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done, function () { window.prompt('Clip reference', link); done(); });
      } else { window.prompt('Clip reference', link); done(); }
      return;
    }

    if (act === 'delete') {
      // The hold outranks the click, exactly as it outranks the retention
      // schedule. The refusal is the feature.
      if (item.hold && item.hold.on) {
        toast('On legal hold — this clip cannot be deleted while the hold stands.');
        return;
      }
      if (!window.confirm('Delete ' + item.id + '? The chain of custody keeps the record of its life either way.')) return;
      EVIDENCE = EVIDENCE.filter(function (e) { return e.id !== item.id; });
      render();
      counts();
      toast('Removed from this library view. Deletion on the record itself is wired next.');
      return;
    }

    if (act === 'save') {
      // Keeping a copy IS the download flow — it settles the fee and lands
      // in the custody log, so the menu routes there rather than growing a
      // second, quieter way to walk off with a file.
      open(item.id, 'details');
      toast('Saving a copy is the download on the Details tab — it settles the fee first and enters the custody log.');
      return;
    }

    if (act === 'export') {
      var record = {
        exportedAt: new Date().toISOString(),
        id: item.id,
        job: (JOBS[item.job] || { name: item.jobName || 'Job' }).name,
        phase: item.phase,
        workDate: item.workDate,
        capturedAt: item.capturedAt || null,
        uploadedAt: item.uploadedAt || null,
        durationSeconds: item.duration || null,
        sha256: item.hash || null,
        tier: item.tier || null,
        integrity: integrityOf(item),
        checks: item.checks || [],
        analysis: item.analysis || null,
        custody: item.custody || [],
        note: 'Metadata export. The video file itself is obtained through the download flow, which settles the fee and enters the chain of custody.'
      };
      var blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'evidence-' + item.id + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      toast('Record exported: metadata, checks, analysis, custody. The video itself goes through the download flow.');
      return;
    }

    if (act === 'twin') {
      // Twins belong to a filed clip's job — open from the row menu once a
      // video exists, not from the empty library chrome.
      var twinUrl = '/verifier/twin.html';
      if (item.job) twinUrl += '?job=' + encodeURIComponent(item.job);
      var embedded = document.body.hasAttribute('data-atm-embed') ||
        new URLSearchParams(location.search).get('embed') === '1';
      if (embedded) window.open(twinUrl, '_blank', 'noopener');
      else location.href = twinUrl;
      return;
    }
  }

  if (jobMenuEl) {
    Array.prototype.forEach.call(jobMenuEl.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var key = jobMenuFor;
        var act = b.getAttribute('data-job-act');
        closeJobMenu();
        if (!key) return;
        if (act === 'record') openJobRecord(key);
        else openJobFileSheet(key, act);
      });
    });
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || 'Copied.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link', text); done(); });
    } else { window.prompt('Copy this link', text); done(); }
  }

  function openJobFileSheet(jobKey, tab) {
    closeJobMenu();
    hydrateJobBoard(jobKey);
    jobSheet.key = jobKey;
    jobSheet.tab = tab === 'invite' ? 'invite' : 'share';
    jobSheet.made = null;
    jobSheet.error = null;
    jobSheet.busy = false;
    var job = JOBS[jobKey] || { name: 'Job' };
    var title = document.getElementById('jf-title');
    var meta = document.getElementById('jf-meta');
    if (title) title.textContent = jobSheet.tab === 'invite' ? 'Add people to this job' : 'Share this job';
    if (meta) meta.textContent = job.name + (job.number ? ' · #' + job.number : '');
    document.querySelectorAll('#jobfile-sheet [data-jf-tab]').forEach(function (btn) {
      btn.setAttribute('aria-selected', btn.getAttribute('data-jf-tab') === jobSheet.tab ? 'true' : 'false');
    });
    var sheet = document.getElementById('jobfile-sheet');
    if (sheet) sheet.setAttribute('data-open', '1');
    paintJobFileSheet();
  }

  function closeJobFileSheet() {
    var sheet = document.getElementById('jobfile-sheet');
    if (sheet) sheet.removeAttribute('data-open');
    jobSheet.key = null;
  }

  function paintJobFileSheet() {
    var body = document.getElementById('jf-body');
    if (!body || !jobSheet.key) return;
    var key = jobSheet.key;
    var b = JOB_BOARD[key];
    var live = canOpenJobRecord(key);
    if (jobSheet.tab === 'invite') {
      body.innerHTML =
        '<p class="jf-note">Add a trade, homeowner, or adjuster to this job file. Trades get a capture link; homeowners and other parties can be sent a read-only progress link from Send a link.</p>' +
        (jobSheet.error ? '<p class="jf-note" style="color:var(--fail)">' + esc(jobSheet.error) + '</p>' : '') +
        '<form id="jf-invite-form">' +
          '<div class="row2">' +
            '<label><span>Company or name</span><input name="company" required placeholder="Delgado Roofing" /></label>' +
            '<label><span>Trade / role</span><select name="kind" required>' +
              inviteKindOptionsHtml() +
            '</select></label>' +
          '</div>' +
          '<label><span>Email (optional)</span><input name="email" type="email" placeholder="crew@example.com" /></label>' +
          '<button class="jf-submit" type="submit"' + (jobSheet.busy ? ' disabled' : '') + '>Add to this job</button>' +
        '</form>' +
        peopleListHtml(b);
      var form = document.getElementById('jf-invite-form');
      if (form) form.addEventListener('submit', function (ev) { ev.preventDefault(); submitInvite(form); });
      return;
    }
    body.innerHTML =
      '<p class="jf-note">Send a read-only progress link — no account needed. Homeowners, HOAs, attorneys, banks, and insurers can see the board and daily site updates.</p>' +
      (jobSheet.error ? '<p class="jf-note" style="color:var(--fail)">' + esc(jobSheet.error) + '</p>' : '') +
      '<form id="jf-share-form">' +
        '<label><span>Who is this for?</span><input name="label" required placeholder="e.g. Cedar Ridge HOA — homeowner" /></label>' +
        '<label><span>Email them (optional)</span><input name="email" type="email" placeholder="Leave blank to copy the link yourself" /></label>' +
        '<label><span>Link expires</span><select name="days">' +
          '<option value="7">In 7 days</option>' +
          '<option value="30" selected>In 30 days</option>' +
          '<option value="90">In 90 days</option>' +
          '<option value="0">Never — until you revoke it</option>' +
        '</select></label>' +
        '<button class="jf-submit" type="submit"' + (jobSheet.busy ? ' disabled' : '') + '>Create link</button>' +
      '</form>' +
      (jobSheet.made ? '<div class="jf-made">' + esc(jobSheet.made.note) +
        (jobSheet.made.path ? '<code>' + esc(jobSheet.made.path) + '</code>' : '') + '</div>' : '') +
      shareListHtml(b, live);
    var shareForm = document.getElementById('jf-share-form');
    if (shareForm) shareForm.addEventListener('submit', function (ev) { ev.preventDefault(); submitShare(shareForm); });
    Array.prototype.forEach.call(body.querySelectorAll('[data-copy]'), function (btn) {
      btn.addEventListener('click', function () {
        copyText(btn.getAttribute('data-copy'), 'Link copied.');
      });
    });
  }

  function peopleListHtml(b) {
    var people = (b && b.people) || [];
    if (!people.length) return '<p class="jf-note" style="margin-top:14px">Nobody is on this job yet.</p>';
    return '<ul class="jf-list">' + people.map(function (p) {
      return '<li><div><div class="who">' + esc(p.name) + '</div><div class="meta">' + esc(roleWord(p.role, p.trade)) +
        (p.email ? ' · ' + esc(p.email) : '') + '</div></div></li>';
    }).join('') + '</ul>';
  }

  function shareListHtml(b) {
    var shares = (b && b.shares) || [];
    if (!shares.length) return '<p class="jf-note" style="margin-top:14px">No progress links issued yet.</p>';
    return '<ul class="jf-list">' + shares.map(function (s) {
      var path = s.path || '';
      var full = path.indexOf('http') === 0 ? path : (location.origin + path);
      var state = s.state || 'live';
      return '<li><div><div class="who">' + esc(s.label || 'Share') + '</div><div class="meta">' +
        esc(state) + (s.recipientEmail || s.recipient_email ? ' · ' + esc(s.recipientEmail || s.recipient_email) : '') +
        '</div></div>' +
