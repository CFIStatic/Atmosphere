  function initialsFrom(fullName, email) {
    var name = (fullName && String(fullName).trim()) || (email && String(email).split('@')[0]) || '';
    var words = name.split(/[\s._-]+/).filter(Boolean);
    if (words.length >= 2) return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
    return name.slice(0, 2).toUpperCase() || '—';
  }

  function isDisplayableAvatarUrl(url) {
    return typeof url === 'string' && /^(https?:|data:image\/)/.test(url.trim());
  }

  function paintAvatar(el, initials, avatarUrl) {
    if (!el) return;
    el.replaceChildren();
    var photo = isDisplayableAvatarUrl(avatarUrl) ? String(avatarUrl).trim() : '';
    if (!photo) {
      el.textContent = initials;
      return;
    }
    var img = document.createElement('img');
    img.src = photo;
    img.alt = '';
    img.addEventListener('error', function () {
      el.replaceChildren();
      el.textContent = initials;
    });
    el.appendChild(img);
  }

  function currentAvatarSrc() {
    var el = document.getElementById('who-avatar');
    var img = el && el.querySelector('img');
    return img ? img.getAttribute('src') : null;
  }

  function avatarCacheVersion(url) {
    if (typeof url !== 'string' || !url) return 0;
    if (url.indexOf('data:image/') === 0) return Number.MAX_SAFE_INTEGER;
    var match = /[?&]v=(\d+)/.exec(url);
    return match ? Number(match[1]) : 0;
  }

  // '' = parent cleared the photo; undefined = parent has not posted one yet.
  var lastParentAvatar;

  function applySession(payload, source) {
    if (!payload || !payload.user) return;
    var u = payload.user;
    var name = u.name || 'Teammate';
    var email = u.email || '';
    var init = u.initials || initialsFrom(name, email);
    var sub = u.orgName || email || 'Atmosphere';
    var nextAvatar = u.avatarUrl;
    if (source === 'parent' && nextAvatar !== undefined) {
      lastParentAvatar = isDisplayableAvatarUrl(nextAvatar) ? String(nextAvatar).trim() : '';
    } else if (lastParentAvatar === '') {
      // Settings removed the photo — a slower GET must not put the old one back.
      nextAvatar = '';
    } else if (typeof lastParentAvatar === 'string' && lastParentAvatar) {
      if (
        !isDisplayableAvatarUrl(nextAvatar) ||
        avatarCacheVersion(lastParentAvatar) >= avatarCacheVersion(nextAvatar)
      ) {
        nextAvatar = lastParentAvatar;
      }
    } else if (!isDisplayableAvatarUrl(nextAvatar)) {
      nextAvatar = currentAvatarSrc() || nextAvatar;
    }

    var whoName = document.getElementById('who-name');
    var whoSub = document.getElementById('who-sub');
    var whoAvatar = document.getElementById('who-avatar');
    var menuName = document.getElementById('menu-name');
    var menuEmail = document.getElementById('menu-email');
    var menuMeta = document.getElementById('menu-meta');
    if (whoName) whoName.textContent = name;
    if (whoSub) whoSub.textContent = sub;
    paintAvatar(whoAvatar, init, nextAvatar);
    if (menuName) menuName.textContent = name;
    if (menuEmail) menuEmail.textContent = email;
    if (menuMeta) menuMeta.textContent = u.orgName || '';
    if (typeof officeAccessToken === 'function' && typeof loadOrgLibrary === 'function') {
      var token = officeAccessToken();
      if (!SHARE_TOKEN && !libraryLoaded && token && token !== lastLibraryToken) {
        lastLibraryToken = token;
        libraryAttempts = 0;
        loadOrgLibrary();
      }
    }
  }

  function loadAccountFromApi() {
    function jsonOrNull(r) { return r.ok ? r.json() : Promise.resolve(null); }
    Promise.all([
      apiFetch('/api/auth/me').then(jsonOrNull).catch(function () { return null; }),
      apiFetch('/api/profile').then(jsonOrNull).catch(function () { return null; }),
      apiFetch('/api/org/me').then(jsonOrNull).catch(function () { return null; })
    ]).then(function (parts) {
      var me = parts[0] && parts[0].user;
      var profile = parts[1] && parts[1].profile;
      var membership = parts[2] && parts[2].membership;
      if (!me && !profile) return;
      var meta = (me && me.metadata) || {};
      var fullName = (profile && profile.fullName) || meta.full_name || meta.fullName || meta.name || null;
      var email = (profile && profile.email) || (me && me.email) || '';
      var orgName = membership && membership.org && membership.org.name;
      var avatarUrl = (profile && profile.avatarUrl) || null;
      if (!isDisplayableAvatarUrl(avatarUrl)) avatarUrl = currentAvatarSrc();
      applySession({
        user: {
          name: (fullName && String(fullName).trim()) || (email ? String(email).split('@')[0] : '') || 'Teammate',
          email: email,
          initials: initialsFrom(fullName, email),
          avatarUrl: avatarUrl,
          orgName: orgName || null
        }
      }, 'api');
    });
  }

  /* ------------------------------------------------------------------ *
   * Live mode.
   *
   * Opened as /verifier/?share=<token>, the page trades the token for one
   * job's evidence at /api/verifier-share/<token> — the outward door the
   * backend guards. Every mapping below narrows the API shape onto the shape
   * this page already renders, so live and demo rows go through identical
   * code and cannot drift apart.
   * ------------------------------------------------------------------ */

  var SHARE_TOKEN = new URLSearchParams(location.search).get('share');
  // Inside the platform the same page hydrates with the org's whole library —
  // no token, the signed-in session is the credential.
  var ORG_MODE = false;

  function mapRemoteItem(raw, jobKey) {
    var reading = raw.analysis || {};
    var hasReading = raw.analysisState === 'done' ||
      Boolean(reading.dictation || reading.summary || reading.transcript) ||
      (Array.isArray(reading.actions) && reading.actions.length > 0);
    return {
      _remote: true,
      id: raw.id,
      job: jobKey || 'shared',
      jobName: raw.jobName,
      address: raw.address || '',
      claimNumber: raw.claimNumber || '',
      company: raw.company || '—',
      person: raw.person || raw.company || '—',
      phase: raw.phase,
      workDate: raw.workDate,
      capturedAt: raw.capturedAt,
      uploadedAt: raw.uploadedAt,
      duration: raw.durationSeconds,
      bytes: raw.byteSize,
      // A signed still out of the clip itself, minted with the list.
      poster: raw.posterUrl || null,
      device: null,
      gps: raw.gps ? { lat: raw.gps.lat, lon: raw.gps.lon, accuracy: raw.gps.accuracyM, distanceFt: null } : null,
      hash: raw.hash,
      labels: Array.isArray(raw.labels) ? raw.labels : [],
      analysisError: raw.analysisError || null,
      tier: raw.tier || 1,
      hold: raw.legalHold ? { on: true, reason: 'This clip is under legal hold. Retention cannot delete it while the hold stands.', by: '', at: '' } : null,
      checks: raw.checks || [],
      analysis: hasReading
        ? {
            state: 'done',
            materialChange: reading.materialChange,
            materialBecause: reading.materialBecause,
            summary: reading.summary || '',
            dictation: reading.dictation || reading.summary || '',
            dictationEntries: reading.dictationEntries || [],
            actions: reading.actions || [],
            changes: reading.changes || [],
            scope: reading.scope || [],
            couldNotTell: reading.couldNotTell || [],
            longForm: Boolean(reading.longForm),
            timeline: reading.timeline || null,
            windowsTotal: reading.windowsTotal,
            windowsRead: reading.windowsRead,
            transcript: reading.transcript || '',
            conversationDetails: reading.conversationDetails || [],
            conversationAgreements: reading.conversationAgreements || [],
            conversationConcerns: reading.conversationConcerns || [],
            conversationRooms: reading.conversationRooms || []
          }
        : raw.analysisState === 'queued'
          ? { state: 'queued', reason: 'This clip is being read now.' }
          : raw.analysisState === 'failed'
            ? { state: 'failed', reason: raw.analysisError || 'The reading of this clip failed.' }
            : raw.analysisState === 'skipped'
              ? { state: 'skipped', reason: raw.analysisError || 'This clip could not be read.' }
              : { state: 'none' },
      custody: [],
      _loaded: false
    };
  }

  function clipHasLocalReading(item) {
    var a = item && item.analysis;
    return Boolean(a && (a.dictation || a.summary || a.transcript || (a.actions && a.actions.length)));
  }

  function applyRemoteReading(item, mapped) {
    var prev = item.analysis && item.analysis.state;
    item.analysis = mapped.analysis;
    item.analysisError = mapped.analysisError;
    if (mapped.duration != null) item.duration = mapped.duration;
    var next = item.analysis && item.analysis.state;
    var settled = clipHasLocalReading(item) || next === 'failed' || next === 'skipped';
    if (settled && item._watchReading) {
      clearInterval(item._watchReading);
      item._watchReading = null;
    }
    if (state.open && state.open.id === item.id && (settled || next !== prev)) {
      fillPreviewChrome(item);
      var time = document.getElementById('d-time');
      if (time && item._videoUrl) time.textContent = 'full clip · ' + dur(item.duration);
      if (state.tab === 'integrity') setTab('integrity');
    }
    return settled;
  }

  /** Scope of Work reads the video. Keep asking the server until that reading lands. */
  function watchRemoteReading(item) {
    if (!item || !item._remote || clipHasLocalReading(item) || item._watchReading) return;
    var next = item.analysis && item.analysis.state;
    if (next === 'failed' || next === 'skipped') return;
    var tries = 0;
    item._watchReading = setInterval(function () {
      tries += 1;
      if (tries > 45 || (state.open && state.open.id !== item.id)) {
        clearInterval(item._watchReading);
        item._watchReading = null;
        return;
      }
      var detailUrl = ORG_MODE
        ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id)
        : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id);
      apiFetch(detailUrl).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (payload) {
        if (!payload || !payload.item) return;
        applyRemoteReading(item, mapRemoteItem(payload.item, item.job));
      }).catch(function () {});
    }, 4000);
  }

  function fetchRemoteDetail(item) {
    var detailUrl = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id)
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id);
    var videoUrl = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/video'
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id) + '/video';
    return Promise.all([
      apiFetch(detailUrl).then(function (r) {
        if (!r.ok) throw new Error('detail');
        return r.json();
      }),
      apiFetch(videoUrl)
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
    ])
      .then(function (parts) {
        var payload = parts[0];
        var video = parts[1];
        // Prefer the freshest analysis/dictation from the detail payload.
        if (payload.item) {
          var mapped = mapRemoteItem(payload.item, item.job);
          item.analysis = mapped.analysis;
          item.checks = mapped.checks;
          item.hold = mapped.hold;
          item.analysisError = mapped.analysisError;
          if (mapped.duration != null) item.duration = mapped.duration;
        }
        item.custody = (payload.custody || []).map(function (c) {
          return {
            action: c.action,
            by: c.by,
            role: c.by === 'Atmosphere' ? 'ai' : (c.role || ''),
            at: c.at,
            detail: c.detail || ''
          };
        });
        item._remoteFrames = (payload.frames || []).map(function (f) {
          return { at: f.atSeconds, src: f.url };
        });
        item._videoUrl = video && video.url ? video.url : null;
        item._loaded = true;
      })
      .catch(function () {
        // The list still opens; the tabs just say less. An error here must
        // not eat the click.
        item._loaded = true;
      });
  }

  function deadLink(status, body) {
    var main = document.querySelector('.main');
    document.querySelector('.rail').innerHTML = '';

    // Evidence is shared account-to-account. No session, or the wrong one,
    // is not a dead link — it is a door that knows who it opens for.
    if (status === 401) {
      main.innerHTML =
        '<div class="empty" style="padding-top:120px">' +
        '<p style="font-size:16px;font-weight:650;color:var(--ink)">Sign in to view this evidence.</p>' +
        '<p style="margin-top:8px">This record was shared with your Atmosphere account. Signing in is what puts your name — rather than \u201csomeone with the link\u201d — on the access log.</p>' +
        '<p style="margin-top:14px"><a href="/login?src=verifier-share" style="display:inline-block;background:var(--accent);color:#fff;font-weight:600;border-radius:8px;padding:9px 16px;text-decoration:none">Sign in</a>' +
        '<a href="/login?mode=signup&src=verifier-share" style="display:inline-block;margin-left:10px;color:var(--accent);font-weight:600;text-decoration:none">Create a free account</a></p>' +
        '</div>';
      return;
    }
    if (status === 403) {
      main.innerHTML =
        '<div class="empty" style="padding-top:120px">' +
        '<p style="font-size:16px;font-weight:650;color:var(--ink)">This share belongs to a different account.</p>' +
        '<p style="margin-top:8px">' + esc((body && body.error) || 'Sign in with the account the share was issued to.') + '</p>' +
        '</div>';
      return;
    }

    var word = (body && body.code === 'revoked') ? 'revoked'
      : (body && body.code === 'expired') ? 'expired'
      : status === 404 ? 'not recognised' : 'unavailable';
    main.innerHTML =
      '<div class="empty" style="padding-top:120px">' +
      '<p style="font-size:16px;font-weight:650;color:var(--ink)">This evidence link is ' + word + '.</p>' +
      '<p style="margin-top:8px">Ask the person who sent it to issue a new one — links are scoped, expiring, and revocable by design.</p>' +
      '</div>';
  }

  function applyOrgLibrary(payload) {
    ORG_MODE = true;
    JOBS = {};
    (payload.jobs || []).forEach(function (j) {
      if (!j || !j.jobId) return;
      JOBS[j.jobId] = {
        key: j.jobId,
        name: j.jobName || 'Job',
        number: j.jobNumber != null ? j.jobNumber : null,
        address: j.address || '',
        claimNumber: j.claimNumber || '',
        company: j.company || '',
        person: j.person || ''
      };
    });
    (payload.items || []).forEach(function (raw) {
      if (raw.jobId && !JOBS[raw.jobId]) {
        JOBS[raw.jobId] = {
          key: raw.jobId,
          name: raw.jobName || 'Job',
          number: raw.jobNumber != null ? raw.jobNumber : null,
          address: raw.address || '',
          claimNumber: raw.claimNumber || '',
          company: raw.company || '',
          person: raw.person || ''
        };
      }
    });
    EVIDENCE = (payload.items || []).map(function (raw) { return mapRemoteItem(raw, raw.jobId); });
  }

  var libraryLoaded = false;
  var libraryAttempts = 0;
  var lastLibraryToken = null;

  function loadOrgLibrary() {
    var wantDemo = new URLSearchParams(location.search).get('demo') === '1';
    return apiFetch('/api/evidence-portal/library')
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          if (wantDemo) { boot(); return null; }
          // Field Capture iframe cookies often fail (SameSite). Retry while
          // the parent handshake writes the Bearer token into sessionStorage.
          if (libraryAttempts < 10 && (EMBEDDED || !officeAccessToken())) {
            libraryAttempts += 1;
            setTimeout(loadOrgLibrary, 400);
            return null;
          }
          ORG_MODE = false;
          EVIDENCE = [];
          JOBS = {};
          boot();
          return null;
        }
        if (!r.ok) throw new Error('no library');
        return r.json();
      })
      .then(function (payload) {
        if (!payload) return;
        libraryLoaded = true;
        applyOrgLibrary(payload);
        boot();
      })
      .catch(function () {
        if (wantDemo) boot();
        else if (libraryAttempts < 10 && (EMBEDDED || !officeAccessToken())) {
          libraryAttempts += 1;
          setTimeout(loadOrgLibrary, 400);
        } else {
          EVIDENCE = [];
          boot();
        }
      });
  }

  if (SHARE_TOKEN) {
    apiFetch('/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN))
      .then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) { deadLink(r.status, body); return null; }
          return body;
        });
      })
      .then(function (payload) {
        if (!payload) return;
        JOBS = {
          shared: {
            key: 'shared',
            name: payload.job ? payload.job.title : 'Shared job',
            number: payload.job ? payload.job.number : null,
            address: payload.job && payload.job.claimNumber ? 'Claim ' + payload.job.claimNumber : ''
          }
        };
        EVIDENCE = (payload.items || []).map(function (raw) { return mapRemoteItem(raw); });
        if (payload.share) {
          // Its own element — #resultcount belongs to render() and would
          // overwrite anything written there on the next filter change.
          var badge = document.createElement('span');
          badge.className = 'result';
          badge.textContent = 'shared with ' + payload.share.label +
            (payload.share.expiresAt ? ' · expires ' + payload.share.expiresAt.slice(0, 10) : '');
          var anchor = document.getElementById('resultcount');
          anchor.parentNode.insertBefore(badge, anchor.nextSibling);
        }
        boot();
      })
      .catch(function () { deadLink(0, null); });
  } else {
    loadOrgLibrary();
  }
})();
</script>
</body>
</html>
