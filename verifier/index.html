  function render() {
    var list = visible();
    var emptyEl = $('#empty');
    var emptyTitle = document.getElementById('empty-title');
    var emptyBody = document.getElementById('empty-body');
    var clipTable = document.getElementById('clip-table');
    var jobFileKeys = Object.keys(JOBS);
    var q = state.q.trim();
    var matchingJobKeys = jobFileKeys.filter(function (k) {
      if (!q) return true;
      return jobFileMatchesQuery(k, q);
    });
    var showJobFiles = state.groupByJob && matchingJobKeys.length > 0 && (q || state.view === 'all');
    var hasRows = list.length > 0 || showJobFiles;
    if (emptyEl) {
      emptyEl.hidden = hasRows;
      if (!hasRows) {
        if (!EVIDENCE.length && !jobFileKeys.length) {
          if (emptyTitle) emptyTitle.textContent = 'No jobs yet';
          if (emptyBody) emptyBody.textContent = 'Start a job and the name shows up here. Footage files under it as crews film.';
        } else if (!EVIDENCE.length) {
          if (emptyTitle) emptyTitle.textContent = 'No clips yet';
          if (emptyBody) emptyBody.textContent = 'When Field Capture uploads a video, it shows up here.';
        } else {
          if (emptyTitle) emptyTitle.textContent = 'No matches';
          if (emptyBody) emptyBody.textContent = 'Try clearing search or picking another view.';
        }
      }
    }
    // Keep column headers visible even with no rows.
    if (clipTable) clipTable.hidden = false;
    syncSortHeaders();

    if (!hasRows) {
      $('#resultcount').textContent = EVIDENCE.length
        ? '0 of ' + EVIDENCE.length + ' clips'
        : '0 clips';
      rowsEl.innerHTML = '';
      return;
    }

    if (state.groupByJob) {
      // Job files exist as soon as the office starts a job. Clips file
      // themselves under the job they arrived with.
      var order = [];
      var groups = {};
      matchingJobKeys.forEach(function (k) {
        groups[k] = [];
        order.push(k);
      });
      list.forEach(function (e) {
        if (!groups[e.job]) { groups[e.job] = []; order.push(e.job); }
        groups[e.job].push(e);
      });
      if (q || state.view !== 'all') {
        order = order.filter(function (k) {
          return (groups[k] || []).length > 0 || (q && jobFileMatchesQuery(k, q));
        });
      }
      if (!jobFileKeys.length) {
        order.sort(function (ka, kb) {
          return compareEvidence(groups[ka][0], groups[kb][0]);
        });
      }
      $('#resultcount').textContent = list.length + ' of ' + EVIDENCE.length + ' clips · ' +
        order.length + ' job file' + (order.length === 1 ? '' : 's');
      rowsEl.innerHTML = order.map(function (k) {
        var collapsed = !!state.collapsed[k];
        var clips = collapsed ? '' : (groups[k] || []).map(function (e) { return clipRow(e, true); }).join('');
        return jobRow(k, groups[k] || [], collapsed) + clips;
      }).join('');
    } else {
      $('#resultcount').textContent = list.length + ' of ' + EVIDENCE.length + ' clips';
      rowsEl.innerHTML = list.map(clipRow).join('');
    }

    Array.prototype.forEach.call(rowsEl.querySelectorAll('tr[data-id]'), function (tr) {
      tr.addEventListener('click', function () { open(tr.dataset.id); });
      tr.addEventListener('keydown', function (ev2) {
        if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); open(tr.dataset.id); }
      });
      // The dots are on the row but not of the row: opening the menu must not
      // open the clip, on click or on Enter.
      var kb = tr.querySelector('.kebab');
      kb.addEventListener('click', function (ev2) { ev2.stopPropagation(); toggleMenu(kb, tr.dataset.id); });
      kb.addEventListener('keydown', function (ev2) { ev2.stopPropagation(); });
    });

    Array.prototype.forEach.call(rowsEl.querySelectorAll('tr.jobrow'), function (tr) {
      function flip() {
        state.collapsed[tr.dataset.job] = !state.collapsed[tr.dataset.job];
        render();
      }
      tr.addEventListener('click', function (ev) {
        if (ev.target.closest('.job-open, .job-act, .kebab, .job-acts')) return;
        flip();
      });
      tr.addEventListener('keydown', function (ev2) {
        if (ev2.target.closest && ev2.target.closest('.job-open, .job-act, .kebab')) return;
        if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); flip(); }
      });
      var openBtn = tr.querySelector('.job-open');
      if (openBtn) {
        openBtn.addEventListener('click', function (ev2) {
          ev2.preventDefault();
          ev2.stopPropagation();
          openJobRecord(tr.dataset.job);
        });
      }
      Array.prototype.forEach.call(tr.querySelectorAll('[data-job-act]'), function (btn) {
        btn.addEventListener('click', function (ev2) {
          ev2.preventDefault();
          ev2.stopPropagation();
          openJobFileSheet(tr.dataset.job, btn.getAttribute('data-job-act'));
        });
      });
      var kb = tr.querySelector('.kebab');
      if (kb) {
        kb.addEventListener('click', function (ev2) {
          ev2.stopPropagation();
          toggleJobMenu(kb, tr.dataset.job);
        });
        kb.addEventListener('keydown', function (ev2) { ev2.stopPropagation(); });
      }
    });
  }

  function counts() {
    $('#n-all').textContent = EVIDENCE.length;
    $('#n-classified').textContent = EVIDENCE.filter(function (e) { return (e.analysis || {}).state === 'done'; }).length;
    $('#n-flag').textContent = EVIDENCE.filter(needsAttention).length;
    $('#n-unan').textContent = EVIDENCE.filter(function (e) { return (e.analysis || {}).state !== 'done'; }).length;
    $('#n-hold').textContent = EVIDENCE.filter(function (e) { return e.hold && e.hold.on; }).length;
  }

  /* ------------------------------------------------------------------ *
   * Row actions
   *
   * One menu element, moved to whichever row's dots opened it — a menu per
   * row is a hundred hidden nodes doing the job of one. Each action lands
   * somewhere honest today: share hands over a reference and names where
   * real shares come from, delete respects a legal hold before it respects
   * a click, save routes to the download flow that settles the fee, and
   * export produces the record itself.
   * ------------------------------------------------------------------ */

  var menuEl = $('#rowmenu');
  var menuFor = null;   // clip id the open menu belongs to
  var menuBtn = null;   // the dots that opened it, for focus return

  function toggleMenu(btn, id) {
    if (menuFor === id && !menuEl.hidden) { closeMenu(); return; }
    closeMenu();
    closeJobMenu();
    menuFor = id; menuBtn = btn;
    btn.setAttribute('aria-expanded', 'true');
    menuEl.hidden = false;
    var r = btn.getBoundingClientRect();
    var mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = r.top - mh - 6; // flip up near the bottom
    menuEl.style.left = left + 'px';
    menuEl.style.top = Math.max(8, top) + 'px';
    menuEl.querySelector('button').focus();
  }

  function closeMenu() {
    if (menuEl.hidden) return;
    menuEl.hidden = true;
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    menuFor = null; menuBtn = null;
  }

  var jobMenuEl = $('#jobmenu');
  var jobMenuFor = null;
  var jobMenuBtn = null;

  function toggleJobMenu(btn, jobKey) {
    if (jobMenuFor === jobKey && jobMenuEl && !jobMenuEl.hidden) { closeJobMenu(); return; }
    closeMenu();
    closeJobMenu();
    jobMenuFor = jobKey; jobMenuBtn = btn;
    btn.setAttribute('aria-expanded', 'true');
    jobMenuEl.hidden = false;
    var r = btn.getBoundingClientRect();
    var mw = jobMenuEl.offsetWidth, mh = jobMenuEl.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
    jobMenuEl.style.left = left + 'px';
    jobMenuEl.style.top = Math.max(8, top) + 'px';
    jobMenuEl.querySelector('button').focus();
  }

  function closeJobMenu() {
    if (!jobMenuEl || jobMenuEl.hidden) return;
    jobMenuEl.hidden = true;
    if (jobMenuBtn) jobMenuBtn.setAttribute('aria-expanded', 'false');
    jobMenuFor = null; jobMenuBtn = null;
  }

  document.addEventListener('click', function (ev) {
    if (!menuEl.hidden && !menuEl.contains(ev.target)) closeMenu();
    if (jobMenuEl && !jobMenuEl.hidden && !jobMenuEl.contains(ev.target)) closeJobMenu();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      var sheet = document.getElementById('jobfile-sheet');
      if (sheet && sheet.getAttribute('data-open') === '1') { closeJobFileSheet(); return; }
      if (!menuEl.hidden) { var b = menuBtn; closeMenu(); if (b) b.focus(); return; }
      if (jobMenuEl && !jobMenuEl.hidden) { var jb = jobMenuBtn; closeJobMenu(); if (jb) jb.focus(); return; }
    }
    var openMenu = !menuEl.hidden ? menuEl : (jobMenuEl && !jobMenuEl.hidden ? jobMenuEl : null);
    if (!openMenu) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      var items = Array.prototype.slice.call(openMenu.querySelectorAll('button'));
      var i = items.indexOf(document.activeElement);
      items[(ev.key === 'ArrowDown' ? i + 1 : i - 1 + items.length) % items.length].focus();
    }
  });
  window.addEventListener('resize', function () { closeMenu(); closeJobMenu(); });
  window.addEventListener('scroll', function () { closeMenu(); closeJobMenu(); }, true);

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.setAttribute('data-on', '1');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.removeAttribute('data-on'); }, 3600);
  }

  Array.prototype.forEach.call(menuEl.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var id = menuFor;
      closeMenu();
      var item = EVIDENCE.filter(function (e) { return e.id === id; })[0];
      if (item) menuAction(b.dataset.act, item);
    });
  });

  function menuAction(act, item) {
    if (act === 'share') {
      // Real shares are issued from the platform, to a named account — what
      // this page can hand a colleague today is a reference to the clip.
      var link = location.href.split('#')[0] + '#' + item.id;
      var done = function () {
        toast('Clip reference copied. A new reviewer gets their own link from the platform — shares are account-to-account.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done, function () { window.prompt('Clip reference', link); done(); });
      } else { window.prompt('Clip reference', link); done(); }
      return;
    }

    if (act === 'delete') {
      // The hold outranks the click, exactly as it outranks the retention
      // schedule. The refusal is the feature.
      if (item.hold && item.hold.on) {
        toast('On legal hold — this clip cannot be deleted while the hold stands.');
        return;
      }
      if (!window.confirm('Delete ' + item.id + '? The chain of custody keeps the record of its life either way.')) return;
      EVIDENCE = EVIDENCE.filter(function (e) { return e.id !== item.id; });
      render();
      counts();
      toast('Removed from this library view. Deletion on the record itself is wired next.');
      return;
    }

    if (act === 'save') {
      // Keeping a copy IS the download flow — it settles the fee and lands
      // in the custody log, so the menu routes there rather than growing a
      // second, quieter way to walk off with a file.
      open(item.id, 'details');
      toast('Saving a copy is the download on the Details tab — it settles the fee first and enters the custody log.');
      return;
    }

    if (act === 'export') {
      var record = {
        exportedAt: new Date().toISOString(),
        id: item.id,
        job: (JOBS[item.job] || { name: item.jobName || 'Job' }).name,
        phase: item.phase,
        workDate: item.workDate,
        capturedAt: item.capturedAt || null,
        uploadedAt: item.uploadedAt || null,
        durationSeconds: item.duration || null,
        sha256: item.hash || null,
        tier: item.tier || null,
        integrity: integrityOf(item),
        checks: item.checks || [],
        analysis: item.analysis || null,
        custody: item.custody || [],
        note: 'Metadata export. The video file itself is obtained through the download flow, which settles the fee and enters the chain of custody.'
      };
      var blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'evidence-' + item.id + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      toast('Record exported: metadata, checks, analysis, custody. The video itself goes through the download flow.');
      return;
    }

    if (act === 'twin') {
      // Twins belong to a filed clip's job — open from the row menu once a
      // video exists, not from the empty library chrome.
      var twinUrl = '/verifier/twin.html';
      if (item.job) twinUrl += '?job=' + encodeURIComponent(item.job);
      var embedded = document.body.hasAttribute('data-atm-embed') ||
        new URLSearchParams(location.search).get('embed') === '1';
      if (embedded) window.open(twinUrl, '_blank', 'noopener');
      else location.href = twinUrl;
      return;
    }
  }

  if (jobMenuEl) {
    Array.prototype.forEach.call(jobMenuEl.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var key = jobMenuFor;
        var act = b.getAttribute('data-job-act');
        closeJobMenu();
        if (!key) return;
        if (act === 'record') openJobRecord(key);
        else openJobFileSheet(key, act);
      });
    });
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || 'Copied.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link', text); done(); });
    } else { window.prompt('Copy this link', text); done(); }
  }

  function jobFileSheetTitle(tab) {
    if (tab === 'invite') return 'Add people to this job';
    if (tab === 'rename') return 'Rename this job file';
    if (tab === 'duplicate') return 'Duplicate this job file';
    return 'Share this job';
  }

  function suggestedDuplicateTitle(name) {
    var base = String(name || 'Job').trim() || 'Job';
    if (/^copy of /i.test(base)) return base.slice(0, 200);
    return ('Copy of ' + base).slice(0, 200);
  }

  function openJobFileSheet(jobKey, tab) {
    closeJobMenu();
    hydrateJobBoard(jobKey);
    jobSheet.key = jobKey;
    jobSheet.tab = tab === 'invite' || tab === 'rename' || tab === 'duplicate' ? tab : 'share';
    jobSheet.made = null;
    jobSheet.error = null;
    jobSheet.busy = false;
    var job = JOBS[jobKey] || { name: 'Job' };
    var title = document.getElementById('jf-title');
    var meta = document.getElementById('jf-meta');
    if (title) title.textContent = jobFileSheetTitle(jobSheet.tab);
    if (meta) meta.textContent = job.name + (job.number ? ' · #' + job.number : '');
    var tabs = document.querySelector('#jobfile-sheet .jf-tabs');
    if (tabs) tabs.hidden = jobSheet.tab === 'rename' || jobSheet.tab === 'duplicate';
    document.querySelectorAll('#jobfile-sheet [data-jf-tab]').forEach(function (btn) {
      btn.setAttribute('aria-selected', btn.getAttribute('data-jf-tab') === jobSheet.tab ? 'true' : 'false');
    });
    var sheet = document.getElementById('jobfile-sheet');
    if (sheet) sheet.setAttribute('data-open', '1');
    paintJobFileSheet();
  }

  function closeJobFileSheet() {
    var sheet = document.getElementById('jobfile-sheet');
    if (sheet) sheet.removeAttribute('data-open');
    jobSheet.key = null;
  }

  function paintJobFileSheet() {
    var body = document.getElementById('jf-body');
    if (!body || !jobSheet.key) return;
    var key = jobSheet.key;
    var job = JOBS[key] || { name: 'Job' };
    var b = JOB_BOARD[key];
    var live = canOpenJobRecord(key);
    if (jobSheet.tab === 'rename' || jobSheet.tab === 'duplicate') {
      var suggested = jobSheet.tab === 'duplicate' ? suggestedDuplicateTitle(job.name) : job.name;
      body.innerHTML =
        '<p class="jf-note">' +
          (jobSheet.tab === 'rename'
            ? 'The name is what shows on the dashboard and in this library.'
            : 'Creates a new job file with the same site, brief, and scope. Footage and people stay on the original.') +
        '</p>' +
        (jobSheet.error ? '<p class="jf-note" style="color:var(--fail)">' + esc(jobSheet.error) + '</p>' : '') +
        '<form id="jf-name-form">' +
          '<label><span>Name</span><input name="title" required minlength="2" maxlength="200" value="' + esc(suggested) + '" /></label>' +
          '<button type="submit" class="jf-submit"' + (jobSheet.busy ? ' disabled' : '') + '>' +
            (jobSheet.busy ? 'Working…' : (jobSheet.tab === 'rename' ? 'Save name' : 'Create copy')) +
          '</button>' +
        '</form>';
      var nameForm = document.getElementById('jf-name-form');
      if (nameForm) {
        nameForm.addEventListener('submit', function (ev) {
          ev.preventDefault();
          submitJobFileName(nameForm);
        });
        var input = nameForm.querySelector('input[name="title"]');
        if (input) { input.focus(); input.select(); }
      }
      return;
    }
    if (jobSheet.tab === 'invite') {
      body.innerHTML =
        '<p class="jf-note">Add a trade, homeowner, or adjuster to this job file. Atmosphere emails the same capture link for the web office and Field Capture.</p>' +
        (jobSheet.error ? '<p class="jf-note" style="color:var(--fail)">' + esc(jobSheet.error) + '</p>' : '') +
        (jobSheet.made ? '<div class="jf-made">' + esc(jobSheet.made.note) +
          (jobSheet.made.path ? '<code>' + esc(jobSheet.made.path) + '</code>' : '') + '</div>' : '') +
        '<form id="jf-invite-form">' +
          '<div class="row2">' +
            '<label><span>Company or name</span><input name="company" required placeholder="Delgado Roofing" /></label>' +
            '<label><span>Trade / role</span><select name="kind" required>' +
              inviteKindOptionsHtml() +
            '</select></label>' +
          '</div>' +
          '<label><span>Email</span><input name="email" type="email" required placeholder="crew@example.com" /></label>' +
          '<button class="jf-submit" type="submit"' + (jobSheet.busy ? ' disabled' : '') + '>Email invite</button>' +
        '</form>' +
        peopleListHtml(b);
      var form = document.getElementById('jf-invite-form');
      if (form) form.addEventListener('submit', function (ev) { ev.preventDefault(); submitInvite(form); });
      return;
    }
    body.innerHTML =
      '<p class="jf-note">Send a read-only progress link — no account needed. Homeowners, HOAs, attorneys, banks, and insurers can see the board and daily site updates.</p>' +
      (jobSheet.error ? '<p class="jf-note" style="color:var(--fail)">' + esc(jobSheet.error) + '</p>' : '') +
      '<form id="jf-share-form">' +
        '<label><span>Who is this for?</span><input name="label" required placeholder="e.g. Cedar Ridge HOA — homeowner" /></label>' +
        '<label><span>Email them (optional)</span><input name="email" type="email" placeholder="Leave blank to copy the link yourself" /></label>' +
        '<label><span>Link expires</span><select name="days">' +
          '<option value="7">In 7 days</option>' +
          '<option value="30" selected>In 30 days</option>' +
          '<option value="90">In 90 days</option>' +
          '<option value="0">Never — until you revoke it</option>' +
        '</select></label>' +
        '<button class="jf-submit" type="submit"' + (jobSheet.busy ? ' disabled' : '') + '>Create link</button>' +
      '</form>' +
      (jobSheet.made ? '<div class="jf-made">' + esc(jobSheet.made.note) +
        (jobSheet.made.path ? '<code>' + esc(jobSheet.made.path) + '</code>' : '') + '</div>' : '') +
      shareListHtml(b, live);
    var shareForm = document.getElementById('jf-share-form');
    if (shareForm) shareForm.addEventListener('submit', function (ev) { ev.preventDefault(); submitShare(shareForm); });
    Array.prototype.forEach.call(body.querySelectorAll('[data-copy]'), function (btn) {
      btn.addEventListener('click', function () {
        copyText(btn.getAttribute('data-copy'), 'Link copied.');
      });
    });
  }

  function peopleListHtml(b) {
    var people = (b && b.people) || [];
    if (!people.length) return '<p class="jf-note" style="margin-top:14px">Nobody is on this job yet.</p>';
    return '<ul class="jf-list">' + people.map(function (p) {
      return '<li><div><div class="who">' + esc(p.name) + '</div><div class="meta">' + esc(roleWord(p.role, p.trade)) +
        (p.email ? ' · ' + esc(p.email) : '') + '</div></div></li>';
    }).join('') + '</ul>';
  }

  function shareListHtml(b) {
    var shares = (b && b.shares) || [];
    if (!shares.length) return '<p class="jf-note" style="margin-top:14px">No progress links issued yet.</p>';
    return '<ul class="jf-list">' + shares.map(function (s) {
      var path = s.path || '';
      var full = path.indexOf('http') === 0 ? path : (location.origin + path);
      var state = s.state || 'live';
      return '<li><div><div class="who">' + esc(s.label || 'Share') + '</div><div class="meta">' +
        esc(state) + (s.recipientEmail || s.recipient_email ? ' · ' + esc(s.recipientEmail || s.recipient_email) : '') +
        '</div></div>' +
        (path ? '<button type="button" class="jf-copy" data-copy="' + esc(full) + '">Copy link</button>' : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function applyRenamedJob(key, title) {
    if (!JOBS[key]) JOBS[key] = { key: key, name: title, number: null, address: '' };
    JOBS[key].name = title;
    render();
  }

  function applyDuplicatedJob(payload) {
    var created = payload && (payload.jobFile || payload.job);
    if (!created) return;
    var id = created.jobId || created.id;
    var name = created.title || created.jobName || 'Job';
    if (!id) return;
    JOBS[id] = {
      key: id,
      name: name,
      number: created.jobNumber != null ? created.jobNumber : null,
      address: ''
    };
    render();
    return id;
  }

  function submitJobFileName(form) {
    var key = jobSheet.key;
    var title = (form.title.value || '').trim();
    if (title.length < 2) {
      jobSheet.error = 'Enter a name for this job file.';
      paintJobFileSheet();
      return;
    }
    jobSheet.busy = true;
    jobSheet.error = null;
    paintJobFileSheet();
    if (!canOpenJobRecord(key)) {
      if (jobSheet.tab === 'rename') {
        applyRenamedJob(key, title);
        jobSheet.busy = false;
        closeJobFileSheet();
        toast('Renamed to ' + title + '.');
        return;
      }
      var demoId = 'copy-' + Date.now();
      JOBS[demoId] = { key: demoId, name: title, number: null, address: '' };
      jobSheet.busy = false;
      closeJobFileSheet();
      render();
      toast('Duplicated as ' + title + '.');
      return;
    }
    var renaming = jobSheet.tab === 'rename';
    var url = '/api/operations/shared/' + encodeURIComponent(key) + (renaming ? '' : '/duplicate');
    apiFetch(url, {
      method: renaming ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      jobSheet.busy = false;
      if (!res.ok) {
        jobSheet.error = (res.body && (res.body.error || res.body.message)) || (renaming ? 'Could not rename that job file.' : 'Could not duplicate that job file.');
        paintJobFileSheet();
        return;
      }
      if (renaming) {
        var next = (res.body.job && res.body.job.title) || title;
        applyRenamedJob(key, next);
        closeJobFileSheet();
        toast('Renamed to ' + next + '.');
        return;
      }
      var newId = applyDuplicatedJob(res.body);
      closeJobFileSheet();
      toast('Duplicated as ' + title + '.');
      if (newId) openJobRecord(newId);
    }).catch(function (err) {
      jobSheet.busy = false;
      jobSheet.error = err && err.message ? err.message : (renaming ? 'Could not rename that job file.' : 'Could not duplicate that job file.');
      paintJobFileSheet();
    });
  }

  function submitShare(form) {
    var key = jobSheet.key;
    var label = (form.label.value || '').trim();
    var email = (form.email.value || '').trim();
    var days = Number(form.days.value);
    if (!label) return;
    jobSheet.busy = true;
    jobSheet.error = null;
    paintJobFileSheet();
    if (!canOpenJobRecord(key)) {
      var fake = { id: 'demo-' + Date.now(), label: label, path: '/progress/demo-' + key, state: 'live', recipientEmail: email || null };
      DEMO_SHARES[key] = (DEMO_SHARES[key] || []).concat([fake]);
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.made = { note: email ? 'Demo link ready for ' + label + '.' : 'Demo link created. Copy it below.', path: location.origin + fake.path };
      jobSheet.busy = false;
      paintJobFileSheet();
      render();
      return;
    }
    apiFetch('/api/evidence-portal/shares', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jobId: key,
        label: label,
        kind: 'progress',
        recipientEmail: email || undefined,
        expiresInDays: days
      })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      jobSheet.busy = false;
      if (!res.ok) {
        jobSheet.error = (res.body && (res.body.error || res.body.message)) || 'Could not create the share.';
        paintJobFileSheet();
        return;
      }
      var path = (res.body.share && res.body.share.path) || (res.body.path);
      jobSheet.made = {
        note: res.body.emailed ? 'Emailed. They can open the link directly — no account needed.' : 'Link created. Copy it and send it yourself:',
        path: path ? (location.origin + path) : ''
      };
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      paintJobFileSheet();
      render();
    }).catch(function (err) {
      jobSheet.busy = false;
      jobSheet.error = err && err.message ? err.message : 'Could not create the share.';
      paintJobFileSheet();
    });
  }

  function submitInvite(form) {
    var key = jobSheet.key;
    var company = (form.company.value || '').trim();
    var kind = form.kind.value || '';
    var parsed = parseInviteKind(kind);
    var role = parsed.role;
    var trade = parsed.trade;
    var email = (form.email.value || '').trim();
    if (!company || !kind) return;
    if (!email) {
      jobSheet.error = 'Enter an email so Atmosphere can send the invite on web and on Field Capture.';
      paintJobFileSheet();
      return;
    }
    jobSheet.busy = true;
    jobSheet.error = null;
    paintJobFileSheet();
    if (!canOpenJobRecord(key)) {
      DEMO_PEOPLE[key] = (DEMO_PEOPLE[key] || []).concat([{ name: company, role: role, trade: trade, email: email || null }]);
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.busy = false;
      jobSheet.made = { note: company + ' added to this job file.' };
      paintJobFileSheet();
      render();
      toast(company + ' added to the job.');
      return;
    }
    apiFetch('/api/operations/shared/' + encodeURIComponent(key) + '/parties', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: company,
        role: role,
        trade: trade || null,
        email: email
      })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      jobSheet.busy = false;
      if (!res.ok) {
        jobSheet.error = (res.body && (res.body.error || res.body.message)) || 'Could not add that person.';
        paintJobFileSheet();
        return;
      }
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.error = null;
      jobSheet.made = {
        note: res.body.emailed
          ? 'Invite emailed to ' + email + '. The same link opens on the web office and Field Capture.'
          : 'Added to the job, but Atmosphere could not send the email. Copy the Field Capture link below.',
        path: res.body.fieldCapturePath
          ? (res.body.fieldCapturePath.indexOf('http') === 0 ? res.body.fieldCapturePath : location.origin + res.body.fieldCapturePath)
          : (res.body.sharePath ? location.origin + res.body.sharePath : '')
      };
      paintJobFileSheet();
      render();
      toast(res.body.emailed ? 'Invite emailed to ' + email + '.' : company + ' added — email did not send.');
    }).catch(function (err) {
      jobSheet.busy = false;
      jobSheet.error = err && err.message ? err.message : 'Could not add that person.';
      paintJobFileSheet();
    });
  }

  /* ------------------------------------------------------------------ *

  var VERDICT_WORD = {
    appears_complete: ['pass', 'Appears complete'],
    in_progress: ['unknown', 'In progress'],
    not_visible: ['neutral', 'Not visible']
  };

  function fillPreviewChrome(item) {

      '<span class="id">' + esc(item.id) + '</span>' +

  function showPreviewScreen() {

  function closePreview() {

    }

  function bindYoutubePlay(item) {
    var btn = document.getElementById('d-yt-play');
    if (btn) btn.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      startPreviewPlayback(item);
    });

  /**
   * YouTube player chrome: the screenshot from the clip, a play button,
   * and the duration. The file itself starts only when asked for.
   */
  function paintPreviewPoster(item, waiting) {
    var poster = thumbFor(item);
    $('#d-frame').innerHTML =
      '<div class="preview-stage" data-preview-state="poster">' +
        '<img class="preview-still" alt="Screenshot from this video" src="' + esc(poster) + '" />' +
        '<button type="button" class="yt-play" id="d-yt-play" aria-label="Play">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>' +
        '</button>' +

  /**
   * Paint the preview with the screenshot the list already has so the screen
   * is never blank while the signed file URL is minted.
   */
  function paintPreviewShell(item, tab) {
    state.open = item;
    state.frame = 0;
    stopPlay();
    fillPreviewChrome(item);
    paintPreviewPoster(item, item._remote && !item._loaded && !item._videoUrl);
    renderDictation(item);
    renderAnalysis(item);

  function paintPreviewVideo(item) {
    var poster = item.poster || thumbFor(item);
    var posterAttr = poster ? ' poster="' + esc(poster) + '"' : '';
    $('#d-frame').innerHTML =
      '<div class="preview-stage" data-preview-state="video">' +
        '<video controls playsinline preload="metadata"' + posterAttr +
        ' src="' + esc(item._videoUrl) + '"></video>' +
      '</div>';
    $('#d-scrub').innerHTML = '';
    $('#d-time').textContent = 'full clip · ' + dur(item.duration);
    var vid = $('#d-frame').querySelector('video');
    if (!vid) return;
    vid.addEventListener('timeupdate', function () { syncAnalysisLog(vid.currentTime); });
    vid.addEventListener('seeked', function () { syncAnalysisLog(vid.currentTime); });
    vid.addEventListener('play', function () { syncAnalysisLog(vid.currentTime); });
    vid.addEventListener('pause', function () { syncAnalysisLog(vid.currentTime); });
    vid.addEventListener('ended', function () { syncAnalysisLog(vid.currentTime); });
    vid.addEventListener('error', function () {
      paintPreviewPoster(item, false);
      var wait = document.getElementById('d-wait');
      if (!wait) {
        var host = $('#d-frame .preview-stage');
        if (host) {
          var pill = document.createElement('div');

          pill.textContent = 'Could not play this file — showing the screenshot on file.';
          host.appendChild(pill);
        }
      }
    });
  }

  function captureVideoScreenshot(url, duration, cb) {
    var video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.crossOrigin = 'anonymous';
    video.src = url;
    var done = false;
    function finish(src) {
      if (done) return;
      done = true;
      try { video.removeAttribute('src'); video.load(); } catch (err) {}
      cb(src);
    }
    video.addEventListener('loadeddata', function () {
      try {
        var length = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : duration;
        video.currentTime = youtubePosterAt(length);
      } catch (err) {
        finish(null);
      }
    });
    video.addEventListener('seeked', function () {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        var ctx = canvas.getContext('2d');
        if (!ctx) { finish(null); return; }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        finish(canvas.toDataURL('image/jpeg', 0.82));
      } catch (err) {
        finish(null);
      }
    });
    video.addEventListener('error', function () { finish(null); });
    setTimeout(function () { finish(null); }, 8000);
  }

  function applyCapturedPoster(item, shot) {
    if (!shot) return;
    item.poster = shot;
    var img = document.querySelector('#d-frame .preview-still');
    if (img && state.open && state.open.id === item.id) img.src = shot;
    var row = document.querySelector('tr[data-id="' + item.id + '"] img.shot');
    if (row) row.src = shot;
  }

  function ensureFrames(item) {
    if (item._frames && item._frames.length) return item._frames;
    item._frames = item._remoteFrames && item._remoteFrames.length
      ? item._remoteFrames
      : frames(item.before || { wet: 0.3, cut: 0.1, gear: 0 },
               item.after || { wet: 0.2, cut: 0.3, gear: 0, seconds: item.duration || 120 },
               item.phase + ' · ' + item.workDate);
    return item._frames;
  }

  function startPreviewPlayback(item) {
    if (!item) return;
    stopPlay();
    if (item._videoUrl) {
      paintPreviewVideo(item);
      var vid = $('#d-frame').querySelector('video');
      if (vid) {
        var attempt = vid.play();
        if (attempt && attempt.catch) {
          attempt.catch(function () {
            vid.muted = true;
            vid.play().catch(function () {});
          });
        }
      }
      return;
    }
    ensureFrames(item);
    $('#d-scrub').innerHTML = item._frames.map(function (f, i) {
      return '<button data-i="' + i + '" aria-pressed="' + (i === 0) + '" aria-label="Frame ' + (i + 1) + '"></button>';
    }).join('');
    Array.prototype.forEach.call($('#d-scrub').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { stopPlay(); setFrame(+b.dataset.i); });
    });
    setFrame(0);
    startFramePlayback();
  }

  function open(id, tab) {
    var item = EVIDENCE.filter(function (e) { return e.id === id; })[0];
    if (!item) return;
    // Show the still the list already has immediately. Custody and the
    // signed file arrive next; a blank wait reads as a missing clip.
    paintPreviewShell(item, tab);
    if (item._remote && !item._loaded) {
      fetchRemoteDetail(item).then(function () {
        if (state.open && state.open.id === item.id) openLoaded(item, tab);
        watchRemoteReading(item);
      });
      return;
    }
    watchRemoteReading(item);
    openLoaded(item, tab);
  }

  function openLoaded(item, tab) {
    state.open = item;
    state.frame = 0;
    stopPlay();
    fillPreviewChrome(item);

    if (item._remoteFrames && item._remoteFrames.length && !item.poster) {
      var mid = item._remoteFrames[Math.min(item._remoteFrames.length - 1, Math.floor(item._remoteFrames.length / 4))];
      if (mid && mid.src) item.poster = mid.src;
    }

    // Keep the YouTube screenshot on screen. The file plays when asked.
    paintPreviewPoster(item, false);
    if (item._videoUrl) {
      captureVideoScreenshot(item._videoUrl, item.duration, function (shot) {
        if (state.open && state.open.id === item.id) applyCapturedPoster(item, shot);
      });
    }

    renderDictation(item);
    renderAnalysis(item);
    setTab(tab || 'integrity');
    showPreviewScreen();
    var back = document.getElementById('d-back');
    if (back) back.focus();
    startNotePlayback(item);
  }

  function renderDictation(item) {
    var a = item.analysis || {};
    var el = $('#d-dictation');
    var pill = $('#d-dictation-pill');
    if (!el) return;

    if (a.state === 'queued') {
      if (pill) pill.textContent = 'Writing…';
      el.innerHTML = '<p style="color:var(--muted)">The assistant is reading this clip now. The dictation will land here when it finishes.</p>';
      return;
    }
    if (a.state === 'failed') {
      if (pill) pill.textContent = 'Failed';
      el.innerHTML = '<p style="color:var(--fail)">The dictation failed after retries. The footage itself is unaffected and can be re-read from the platform.</p>';
      return;
    }
    if (a.state === 'skipped' || a.state === 'none' || !a.state) {
      if (pill) pill.textContent = 'Not yet';
      el.innerHTML = '<p style="color:var(--muted)">' + esc(
        a.reason || 'No AI dictation on this clip yet.'
      ) + '</p>';
      return;
    }

    if (pill) {
      pill.textContent = a.longForm ? 'Workday reading' : 'Clip reading';
    }

    var text = a.dictation || a.summary || '';
    var html = '<p>' + esc(text) + '</p>';
    if (a.actions && a.actions.length) {
      html += '<p class="k" style="margin:14px 0 6px">Actions seen</p><ul class="entries">' + a.actions.map(function (act) {
        var t = act.atSeconds != null ? dur(act.atSeconds) : '';
        var verb = String(act.action || '').replace(/_/g, ' ');
        var body = (verb ? verb + ' — ' : '') + (act.description || '');
        return '<li><span class="t">' + esc(String(t)) + '</span><span>' + esc(body) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (a.dictationEntries && a.dictationEntries.length) {
      html += '<ul class="entries">' + a.dictationEntries.map(function (e) {
        var t = e.atSeconds != null ? dur(e.atSeconds) : (e.t || '');
        var body = e.text || e.note || e.summary || '';
        return '<li><span class="t">' + esc(String(t)) + '</span><span>' + esc(body) + '</span></li>';
      }).join('') + '</ul>';
    }
    el.innerHTML = html;
  }

  function setFrame(i) {
    var item = state.open;
    if (!item) return;
    state.frame = i;
    var f = item._frames[i];
    $('#d-frame').innerHTML =
      '<div class="preview-stage" data-preview-state="frame">' +
        '<img alt="Frame ' + (i + 1) + ' of the clip" src="' + f.src + '" />' +
      '</div>';
    $('#d-time').textContent = 'frame ' + (i + 1) + ' / ' + item._frames.length + ' · ' + dur(f.at);
    Array.prototype.forEach.call($('#d-scrub').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.i === i));
    });
    syncAnalysisLog(f.at);
  }

  function stopPlay() {
    if (state.playing) { clearInterval(state.playing); state.playing = null; }
  }

  function startFramePlayback() {
    if (state.playing) return;
    state.playing = setInterval(function () {
      var item = state.open;
      if (!item || !item._frames) return stopPlay();
      var next = state.frame + 1;
      if (next >= item._frames.length) { stopPlay(); syncAnalysisLog(currentPlayhead()); return; }
      setFrame(next);
    }, 700);
  }

  function startLivePlayback(item) {
    startNotePlayback(item);
  }

  function startNotePlayback(item) {
    if (!item) return;
    if ((item.duration || 0) > 600) {
      syncAnalysisLog(0);
      return;
    }
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid && !vid.paused && !vid.ended) return;
    if (state.playing) return;
    var times = analysisLog(item).map(function (row) { return row.at; });
    if (!times.length) {
      syncAnalysisLog(0);
      return;
    }
    var idx = 0;
    syncAnalysisLog(times[0]);
    idx = 1;
    state.playing = setInterval(function () {
      if (!state.open || state.open.id !== item.id) { stopPlay(); return; }
      var live = $('#d-frame') && $('#d-frame').querySelector('video');
      if (live && !live.paused && !live.ended) { stopPlay(); return; }
      if (idx >= times.length) { stopPlay(); return; }
      syncAnalysisLog(times[idx]);
      idx += 1;
    }, 700);
  }

  function renderAnalysis(item) {
    // Scope / timeline / gaps — the structured reading under the dictation.
    // The spoken description itself lives in renderDictation.
    var a = item.analysis || {};
    var el = $('#d-analysis');
    if (!el) return;

    if (a.state === 'failed') {
      el.innerHTML = '<p style="color:var(--fail)">Scope reading failed with the dictation. Re-run from the platform; the footage is unaffected.</p>';
      return;
    }
    if (a.state === 'queued' || a.state === 'skipped' || a.state === 'none' || !a.state) {
      el.innerHTML = '<p style="color:var(--muted)">' + esc(
        a.reason || 'No scope reading on this clip yet.'
      ) + '</p>';
      return;
    }

    var vl;
    if (a.longForm) {
      var hours = item.duration ? (item.duration / 3600).toFixed(1) : '?';
      vl = ['pass', 'A ' + hours + '-hour workday, read in ' +
        (a.windowsRead != null ? a.windowsRead : '?') + ' of ' +
        (a.windowsTotal != null ? a.windowsTotal : '?') + ' time windows'];
    } else {
      vl = a.materialChange === 'significant'
        ? ['pass', 'Work is visible in this video']
        : a.materialChange === 'minor'
          ? ['unknown', 'Minor visible change only']
          : a.materialChange === 'none'
            ? ['fail', 'No work visible in this video']
            : ['unknown', 'What this video shows'];
    }

    var html = '<div class="verdictline ' + vl[0] + '">' + esc(vl[1]) + '</div>';
    if (a.materialBecause) {
      html += '<p style="font-size:12.5px;color:var(--muted)"><strong style="color:var(--ink-2)">Why:</strong> ' +
        esc(a.materialBecause) + '</p>';
    }

    if (a.scope && a.scope.length) {
      html += '<ul class="scopelist">';
      a.scope.forEach(function (s) {
        var w = VERDICT_WORD[s.verdict] || ['neutral', s.verdict];
        html += '<li><span class="label">' + esc(s.title) +
          (s.because ? '<span style="display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px">' + esc(s.because) +
            (s.seenInWindows && s.seenInWindows.length ? ' <span class="mono" style="color:var(--faint)">· seen in ' + s.seenInWindows.length + ' window' + (s.seenInWindows.length === 1 ? '' : 's') + '</span>' : '') +
            '</span>' : '') +
          '</span><span class="chip ' + w[0] + '">' + esc(w[1]) + '</span></li>';
      });
      html += '</ul>';
    } else {
      html += '<p style="color:var(--muted);font-size:12.5px">No agreed scope lines were attached to this reading.</p>';
    }

    if (a.longForm && a.timeline && a.timeline.length) {
      var hhmm = function (s) {
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h + ':' + String(m).padStart(2, '0');
      };
      html += '<h5 style="margin:14px 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)">The day, hour by hour</h5>';
      html += '<ul class="custody" style="margin-top:4px">' + a.timeline.map(function (t) {
        return '<li><div><span class="act mono" style="font-size:11.5px">' + hhmm(t.startSeconds) + '–' + hhmm(t.endSeconds) + '</span> ' +
          '<span class="by">' + esc(t.summary) + '</span></div></li>';
      }).join('') + '</ul>';
    }

    if (a.couldNotTell && a.couldNotTell.length) {
      html += '<h5 style="margin:14px 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)">What it could not tell</h5>';
      html += '<ul style="margin:0;padding-left:17px;font-size:12.5px;color:var(--muted);line-height:1.6">' +
        a.couldNotTell.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
    }

    html += '<p class="footnote" style="margin-top:14px;padding-top:11px;border-top:1px solid var(--line-soft)">' +
      'This is a reading of the footage by a model, not an inspection. It is recorded as an analysis and ' +
      'never as an acceptance — releasing money is a person\'s act.</p>';

    el.innerHTML = html;
  }

  var ASK_THREADS = {};

  function analysisLog(item) {
    var a = item.analysis || {};
    var rows = [];
    var seen = {};
    function add(at, text, kind) {
      var t = String(text || '').trim();
      if (!t) return;
      var key = at + '|' + t;
      if (seen[key]) return;
      seen[key] = true;
      rows.push({ at: Math.max(0, Number(at) || 0), text: t, kind: kind || 'note' });
    }
    (a.dictationEntries || []).forEach(function (e) {
      add(e.atSeconds, e.text || e.note || e.summary, 'read');
    });
    (a.actions || []).forEach(function (act) {
      var verb = String(act.action || '').replace(/_/g, ' ');
      var room = String(act.room || '').trim();
      var body = act.description || ((verb ? verb + ' — ' : '') + (act.object || ''));
      add(act.atSeconds, (room && body.toLowerCase().indexOf(room.toLowerCase()) === -1 ? room + ': ' : '') + body, 'action');
    });
    (a.timeline || []).forEach(function (t) {
      add(t.startSeconds, t.summary, 'window');
    });
    String(a.transcript || '').split(/\n+/).forEach(function (line) {
      var m = String(line || '').trim().match(/^\[((?:\d+:)+\d+)\]\s*(.+)$/);
      if (!m) return;
      var parts = m[1].split(':').map(Number);
      var at = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];
      add(at, m[2], 'heard');
    });
    if (rows.length < 6 && a.changes && a.changes.length) {
      var d = item.duration || 120;
      a.changes.forEach(function (c, i) {
        add(Math.round((i + 1) * d / (a.changes.length + 1)), c, 'change');
      });
    }
    if (rows.length < 5) {
      var prose = a.dictation || a.summary || '';
      String(prose).split(/(?<=[.!?])\s+/).forEach(function (sentence, i, all) {
        var s = String(sentence || '').trim();
        if (!s) return;
        add(Math.round((i + 0.5) * (item.duration || 120) / Math.max(all.length, 1)), s, 'read');
      });
    }
    if (rows.length < 2 && a.scope && a.scope.length) {
      var d2 = item.duration || 120;
      a.scope.forEach(function (s, i) {
        var w = VERDICT_WORD[s.verdict];
        add(
          Math.round(i * d2 / Math.max(a.scope.length - 1, 1)),
          s.title + (w ? ' — ' + w[1] : ''),
          'scope'
        );
      });
    }
    rows.sort(function (x, y) { return x.at - y.at; });
    return rows;
  }

  function currentPlayhead() {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) return vid.currentTime || 0;
    var item = state.open;
    if (item && item._frames && item._frames[state.frame]) return item._frames[state.frame].at || 0;
    return 0;
  }

  function isFootagePlaying() {
    if (state.playing) return true;
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    return Boolean(vid && !vid.paused && !vid.ended);
  }

  function setAnalysisPill(text) {
    var pill = document.getElementById('alog-pill');
    if (pill) pill.textContent = text;
  }

  function fillNote(li) {
    var span = li.querySelector('[data-full]');
    if (span) span.textContent = span.getAttribute('data-full') || span.textContent || '';
    li.classList.remove('writing');
    li.setAttribute('data-written', '1');
  }

  function syncAnalysisLog(seconds) {
    var list = document.getElementById('alog');
    if (!list) return;
    var items = list.querySelectorAll('[data-at]');
    if (!items.length) return;
    var lastSeen = -1;
    Array.prototype.forEach.call(items, function (li, i) {
      if (seconds + 0.15 >= Number(li.getAttribute('data-at'))) lastSeen = i;
    });
    var empty = document.getElementById('alog-empty');
    var playing = isFootagePlaying();
    Array.prototype.forEach.call(items, function (li, i) {
      var due = i <= lastSeen;
      li.classList.toggle('on', i === lastSeen && lastSeen >= 0);
      li.classList.toggle('seen', i < lastSeen);
      li.classList.toggle('soon', !due);
      if (!due) return;
      if (li.getAttribute('data-written') || li.classList.contains('writing')) return;
      fillNote(li, playing && i === lastSeen);
    });
    if (empty) empty.hidden = false;
    var cur = lastSeen >= 0 ? items[lastSeen] : null;
    if (lastSeen < 0) setAnalysisPill(playing ? 'Watching' : 'Ready');
    else if (playing && lastSeen < items.length - 1) setAnalysisPill('Watching');
    else if (lastSeen === items.length - 1) setAnalysisPill('Caught up');
    else setAnalysisPill('Paused');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function seekTo(seconds) {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) {
      vid.currentTime = seconds;
      syncAnalysisLog(seconds);
      return;
    }
    var item = state.open;
    if (!item || !item._frames || !item._frames.length) {
      syncAnalysisLog(seconds);
      return;
    }
    var best = 0;
    var dist = Infinity;
    item._frames.forEach(function (f, i) {
      var d = Math.abs((f.at || 0) - seconds);
      if (d < dist) { dist = d; best = i; }
    });
    stopPlay();
    setFrame(best);
  }

  function renderScopeLog(item) {
    var a = item.analysis || {};
    var rows = analysisLog(item);
    var saw = String(a.dictation || a.summary || '').trim();
    var heard = String(a.transcript || '').trim();
    var pill = a.state === 'failed' ? 'Failed'
      : a.state === 'skipped' ? 'Could not read'
      : (a.state === 'queued' || a.state === 'none' || !a.state) && !rows.length && !saw && !heard ? 'Writing…'
      : 'Ready';
    var html = '<div class="alog-head"><h4>AI analysis</h4><span class="livepill" id="alog-pill">' + pill + '</span></div>';
    if (!rows.length && !saw && !heard) {
      var wait = a.reason || item.analysisError ||
        (a.state === 'failed'
          ? 'The dictation failed after retries. The footage itself is unaffected.'
          : a.state === 'skipped'
            ? 'This clip could not be read. Open it again to retry, or check that a vision model key is on the server.'
            : 'The assistant is reading this clip. What it sees will land here when the reading finishes.');
      html += '<p class="footnote alog-wait">' + esc(wait) + '</p>';
      return html;
    }
    if (saw) {
      html += '<div class="saw-block" id="d-saw"><p>' + esc(saw) + '</p></div>';
    }
    if (a.scope && a.scope.length) {
      html += '<p class="saw-k">Against the scope</p><ul class="scopelist">';
      a.scope.forEach(function (s) {
        var w = VERDICT_WORD[s.verdict] || ['neutral', s.verdict];
        html += '<li><span class="label">' + esc(s.title) +
          (s.because ? '<span style="display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px">' + esc(s.because) + '</span>' : '') +
          '</span><span class="chip ' + w[0] + '">' + esc(w[1]) + '</span></li>';
      });
      html += '</ul>';
    }
    if (rows.length) {
      html += '<p class="saw-k">What the AI saw, in order</p>';
      html += '<p class="footnote alog-wait" id="alog-empty">You do not have to watch the clip. Times jump the playhead.</p>';
      html += '<ul class="alog" id="alog">' + rows.map(function (r) {
        return '<li data-at="' + r.at + '" class="soon">' +
          '<span class="t">' + dur(r.at) + '</span><span data-full="' + esc(r.text) + '">' + esc(r.text) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (heard || (a.conversationDetails && a.conversationDetails.length)) {
      html += '<p class="saw-k">Heard on the mic</p>';
      if (a.conversationDetails && a.conversationDetails.length) {
        html += '<ul style="margin:0 0 10px;padding-left:17px;font-size:13px;color:var(--ink-2);line-height:1.55">' +
          a.conversationDetails.slice(0, 8).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
      } else {
        html += '<div class="saw-block" style="background:var(--line-soft)"><p>' + esc(heard.slice(0, 1200)) + '</p></div>';
      }
    }
    if (a.couldNotTell && a.couldNotTell.length) {
      html += '<p class="saw-k">What it could not tell</p>';
      html += '<ul style="margin:0;padding-left:17px;font-size:12.5px;color:var(--muted);line-height:1.6">' +
        a.couldNotTell.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
    }
    html += '<p class="footnote" style="margin-top:14px;padding-top:11px;border-top:1px solid var(--line-soft)">' +
      'This is what the model could see in the frames and, when the mic was on, what was said — rooms, agreements, concerns. ' +
      'It does not infer off-camera work, and it is never an acceptance.</p>';
    return html;
  }

  var ASK_STOP = {
    the: 1, a: 1, an: 1, in: 1, on: 1, of: 1, to: 1, and: 1, or: 1, did: 1, does: 1, do: 1,
    is: 1, was: 1, are: 1, were: 1, this: 1, that: 1, it: 1, any: 1, anything: 1, something: 1,
    what: 1, when: 1, where: 1, how: 1, who: 1, why: 1, clip: 1, video: 1, footage: 1, they: 1,
    them: 1, their: 1, there: 1, for: 1, with: 1, from: 1, about: 1, have: 1, has: 1, been: 1,
    show: 1, shows: 1, seen: 1, visible: 1,
    worker: 1, workers: 1, crew: 1, person: 1, people: 1, someone: 1, somebody: 1,
    anyone: 1, anybody: 1, went: 1, going: 1, gone: 1, enter: 1, entered: 1, entering: 1,
    point: 1, anytime: 1, anypoint: 1, ever: 1, into: 1, inside: 1
  };

  function askTokens(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(/\s+/).filter(function (t) {
      return t.length > 2 && !ASK_STOP[t];
    });
  }

  function askTokensOverlap(query, hay) {
    if (query === hay) return true;
    if (query.length < 5 || hay.length < 5) return false;
    return hay.indexOf(query) !== -1 || query.indexOf(hay) !== -1;
  }

  function clipAskCorpus(item) {
    var a = item.analysis || {};
    var rows = [];
    function push(at, text) {
      var t = String(text || '').trim();
      if (t) rows.push({ at: at == null ? null : Number(at), text: t });
    }
    push(null, a.dictation);
    if (a.summary && a.summary !== a.dictation) push(null, a.summary);
    (a.dictationEntries || []).forEach(function (e) { push(e.atSeconds, e.text || e.note || e.summary); });
    (a.actions || []).forEach(function (act) {
      var verb = String(act.action || '').replace(/_/g, ' ');
      var room = String(act.room || '').trim();
      var object = String(act.object || act.objectLabel || '').trim();
      push(act.atSeconds, [room, verb, act.description, object].filter(Boolean).join(' — '));
    });
    (a.timeline || []).forEach(function (t) { push(t.startSeconds, t.summary); });
    (a.changes || []).forEach(function (c) { push(null, c); });
    (a.scope || []).forEach(function (s) {
      push(null, [s.title, s.verdict, s.because].filter(Boolean).join(' — '));
    });
    (a.couldNotTell || []).forEach(function (c) { push(null, c); });
    String(a.transcript || '').split(/\n+/).forEach(function (line) {
      var m = String(line || '').trim().match(/^\[((?:\d+:)+\d+)\]\s*(.+)$/);
      if (m) {
        var parts = m[1].split(':').map(Number);
        var at = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];
        push(at, m[2]);
        return;
      }
      if (line.trim()) push(null, line.trim());
    });
    (a.conversationDetails || []).forEach(function (c) { push(null, c); });
    (a.conversationAgreements || []).forEach(function (c) { push(null, c); });
    (a.conversationConcerns || []).forEach(function (c) { push(null, c); });
    (a.conversationRooms || []).forEach(function (c) { push(null, 'Talked about the ' + c); });
    return rows;
  }

  function answerClipLocally(item, question) {
    var a = item.analysis || {};
    var q = String(question || '').trim();
    var state = a.state || item.analysisState;
    if (state === 'failed' && !clipAskCorpus(item).length) return 'The reading of this clip failed. The footage itself is unaffected.';
    var rows = clipAskCorpus(item);
    if (!rows.length) return 'This clip is still being read. Ask again once the dictation lands.';
    if (/what (did|was) (the )?(homeowner|owner|contractor|they|he|she|worker).*(say|ask|tell|agree|mention)|did (the )?(homeowner|owner|contractor|they).*(say|mention|agree)|what was said|anything said|heard on the mic|conversation|what did they agree/i.test(q)) {
      var spoken = (a.conversationDetails || []).concat(a.conversationAgreements || []).concat(a.conversationConcerns || []).filter(Boolean);
      if (spoken.length) return 'Yes — this is what was said on the recording: ' + spoken.slice(0, 3).join(' ');
      var heardLines = String(a.transcript || '').split(/\n+/).map(function (line) {
        var m = line.trim().match(/^\[(?:\d+:)+\d+\]\s*(.+)$/);
        return (m ? m[1] : line).trim();
      }).filter(Boolean);
      if (heardLines.length) return 'Yes — this is what was said on the recording: ' + heardLines.slice(0, 2).join(' ');
      return 'The footage on file does not include usable speech.';
    }
    if (/what('?s| is| was)? (happening|happing|happeniong|happened|going on)|what (did|work)|did anything|anything happen|what('s| is) (visible|going on|in this|on (the |this )?(clip|video|film|screen))|what do you see|describe (this |the )?(clip|video|film|footage)|any work/i.test(q)) {
      var changes = (a.changes || []).filter(Boolean);
      var actions = (a.actions || []).map(function (act) { return act.description; }).filter(Boolean);
      var date = item.workDate ? ' on ' + item.workDate : '';
      if (changes.length) return 'Yes — the footage' + date + ' shows: ' + changes.slice(0, 4).join('; ') + '.';
      if (actions.length) return 'Yes — the footage' + date + ' shows: ' + actions.slice(0, 4).join('; ') + '.';
      if (a.dictation || a.summary) return 'The reading of this clip' + date + ': ' + (a.dictation || a.summary);
      return 'The footage on file does not show that.';
    }
    var qTokens = askTokens(q);
    if (!qTokens.length) return (a.dictation || a.summary || 'The footage on file does not show that.');
    var yesNo = /^(did|does|do|was|were|is|are|has|have|had|at any|anytime)\b/i.test(q) ||
      /\b(go in|went in|go into|went into|enter|entered|ever go|at any point)\b/i.test(q);
    var need = Math.min(qTokens.length >= 2 ? 2 : 1, qTokens.length);
    var scored = rows.map(function (row) {
      var hay = askTokens(row.text);
      var hits = qTokens.filter(function (t) {
        return hay.some(function (h) { return askTokensOverlap(t, h); });
      });
      return { row: row, score: hits.length };
    }).filter(function (e) { return e.score >= need; }).sort(function (x, y) {
      return y.score - x.score || (x.row.at || 0) - (y.row.at || 0);
    });
    if (!scored.length) {
      return yesNo ? 'No. The footage on file does not show that.' : 'The footage on file does not show that.';
    }
    if (yesNo) {
      var hit = scored.filter(function (e) { return e.row.at != null; })[0] || scored[0];
      var spoken = hit.row.at != null ? durSpoken(hit.row.at) : '';
      var body = hit.row.text.replace(/\.$/, '');
      var denies = /\b(no work|not visible|not worked|untouched|never |none of|did not|does not show)\b/i.test(body);
      if (denies) return spoken ? 'No. ' + body + '. That was ' + spoken + '.' : 'No. ' + body + '.';
      return spoken ? 'Yes. ' + body + '. That happened at ' + spoken + '.' : 'Yes. ' + body + '.';
    }
    var best = scored[0];
    var timed = scored.filter(function (e) { return e.row.at != null; })[0];
    var top = timed && timed !== best ? [best, timed] : scored.slice(0, 2);
    return top.map(function (e) {
      var when = e.row.at != null ? dur(e.row.at) : '';
      var spoken = e.row.at != null ? durSpoken(e.row.at) : '';
      var text = e.row.text.replace(/\.$/, '');
      if (when && spoken) return 'At ' + when + ', ' + text.charAt(0).toLowerCase() + text.slice(1) + '. That was ' + spoken;
      return text;
    }).join('. ') + '.';
  }

  function askClip(item, question, history, cb) {
    var local = answerClipLocally(item, question);
    if (!item._remote) {
      cb(null, local);
      return;
    }
    var url = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/ask'
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id) + '/ask';
    apiFetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, history: history || [] })
    }).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error((body && (body.error || body.message)) || 'Could not answer.');
        cb(null, body.answer || local);
      });
    }).catch(function () {
      cb(null, clipAskCorpus(item).length ? local : 'This clip is still being read. Ask again once the dictation lands.');
    });
  }

  function renderAsk(item) {
    var thread = ASK_THREADS[item.id] || [];
    var html = '<div class="ask-pane">' +
      '<div class="alog-head"><h4>Ask this clip</h4></div>' +
      '<div class="ask-thread" id="ask-thread">';
    if (!thread.length) {
      html += '<p class="ask-empty">Ask about this clip. Answers come from the Scope of Work reading — what the AI saw on screen and, when the mic was on, what was said.</p>' +
        '<div class="ask-suggest">' +
        '<button type="button" data-ask="What is happening in this video?">What is happening?</button>' +
        '<button type="button" data-ask="Did anything happen in this clip?">Did anything happen?</button>' +
        '<button type="button" data-ask="What work is visible?">What work is visible?</button>' +
        '<button type="button" data-ask="At any point did the worker go in the bathroom?">Did they go in the bathroom?</button>' +
        '<button type="button" data-ask="What did the homeowner say?">What did the homeowner say?</button>' +
        '<button type="button" data-ask="Is anything in this footage unfinished?">Anything unfinished?</button>' +
        '</div>';
    } else {
      thread.forEach(function (m) {
        html += '<div class="ask-bubble ' + esc(m.role) + '">' + esc(m.text) + '</div>';
      });
    }
    html += '</div>' +
      '<form id="ask-form" class="ask-form">' +
      '<textarea id="ask-input" maxlength="1000" rows="1" autocomplete="off" placeholder="Ask about this clip…"></textarea>' +
      '<button type="submit">Ask</button>' +
      '</form></div>';
    return html;
  }

  function bindAsk(item) {
    var form = document.getElementById('ask-form');
    var input = document.getElementById('ask-input');
    function send(text) {
      var q = String(text || '').trim();
      if (q.length < 3) return;
      var thread = ASK_THREADS[item.id] || [];
      thread.push({ role: 'user', text: q });
      ASK_THREADS[item.id] = thread;
      var history = thread.slice(0, -1).map(function (m) {
        return { role: m.role === 'assistant' ? 'assistant' : 'user', text: m.text };
      });
      setTab('ask');
      var host = document.getElementById('ask-thread');
      if (host) {
        var pending = document.createElement('div');
        pending.className = 'ask-bubble assistant pending';
        pending.textContent = 'Reading the clip…';
        host.appendChild(pending);
      }
      askClip(item, q, history, function (_err, answer) {
        thread.push({ role: 'assistant', text: answer });
        ASK_THREADS[item.id] = thread;
        if (state.open && state.open.id === item.id && state.tab === 'ask') setTab('ask');
      });
    }
    if (form) {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        send(input && input.value);
        if (input) input.value = '';
      });
    }
    if (input) {
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) {
          ev.preventDefault();
          send(input.value);
          input.value = '';
        }
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-ask]'), function (btn) {
      btn.addEventListener('click', function () { send(btn.getAttribute('data-ask')); });
    });
    if (input) setTimeout(function () { input.focus(); }, 0);
  }

  function setTab(tab) {
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    });
    var side = document.querySelector('.side');
    if (side) side.classList.toggle('ask-mode', tab === 'ask');
    var item = state.open;
    if (!item) return;
    var el = $('#d-panel');

    if (tab === 'integrity') {
      el.innerHTML = renderScopeLog(item);
      Array.prototype.forEach.call(el.querySelectorAll('#alog [data-at]'), function (li) {
        li.addEventListener('click', function () { seekTo(Number(li.getAttribute('data-at'))); });
      });
      var goto = el.querySelector('[data-goto]');
      if (goto) goto.addEventListener('click', function () { open(goto.dataset.goto); });
      syncAnalysisLog(currentPlayhead());
      return;
    }

    if (tab === 'custody') {
      el.innerHTML = '<ul class="custody">' + item.custody.map(function (c) {
        return '<li class="' + (c.role === 'ai' ? 'ai' : '') + '">' +
          '<div><span class="act">' + esc(c.action) + '</span> <span class="by">· ' + esc(c.by) + '</span></div>' +
          '<div class="at">' + stamp(c.at) + (c.detail ? ' · ' + esc(c.detail) : '') + '</div></li>';
      }).join('') + '</ul>' +
      '<p class="footnote">Every access is logged at the moment a viewing link is minted, including external ' +
      'shares. The log is append-only: entries cannot be edited or removed, by anyone, including the account ' +
      'that owns the job.</p>';
      return;
    }

    if (tab === 'ask') {
      el.innerHTML = renderAsk(item);
      bindAsk(item);
      return;
    }

    var g = item.gps;
    var job = JOBS[item.job] || { name: item.jobName || 'Job', address: '' };
    el.innerHTML = '<dl class="kv">' +
      '<dt>Evidence ID</dt><dd class="mono">' + esc(item.id) + '</dd>' +
      '<dt>Job</dt><dd>' + esc(job.name) + '</dd>' +
      '<dt>Address</dt><dd>' + esc(job.address) + '</dd>' +
      '<dt>Capture</dt><dd>' + esc(clipKind(item.phase)) + ' · ' + dayLabel(item.workDate) + '</dd>' +
      '<dt>Filmed</dt><dd>' + (item.capturedAt ? stamp(item.capturedAt) : 'not reported by the device') + '</dd>' +
      '<dt>Received</dt><dd>' + stamp(item.uploadedAt) + '</dd>' +
      '<dt>Duration</dt><dd>' + dur(item.duration) + '</dd>' +
      '<dt>Size</dt><dd>' + mb(item.bytes) + '</dd>' +
      '<dt>Device</dt><dd>' + esc(item.device || 'not recorded') + '</dd>' +
      '<dt>Location</dt><dd>' + (g ? g.lat.toFixed(4) + ', ' + g.lon.toFixed(4) + ' (±' + g.accuracy + ' ft)' : 'not reported') + '</dd>' +
      '<dt>From site</dt><dd>' + (g && g.distanceFt != null ? (g.distanceFt > 1000 ? (g.distanceFt / 5280).toFixed(2) + ' mi' : g.distanceFt + ' ft') : '—') + '</dd>' +
      '<dt>SHA-256</dt><dd class="mono">' + esc(item.hash || 'not recorded') + '</dd>' +
      '<dt>Episode tier</dt><dd>Tier ' + item.tier + '</dd>' +
      '</dl>' +
      '<p class="footnote">The hash is of the original bytes as uploaded. Re-uploading the same file on another ' +
      'day or another job is caught by it, which is the cheapest fraud there is and the cheapest to catch.</p>' +
      (item._remote && (SHARE_TOKEN || ORG_MODE)
        ? '<div id="dl-block" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)">' +
          '<button id="dl-btn" class="navitem" style="width:auto;border:1px solid var(--line);font-weight:600">Download original file</button>' +
          '<p id="dl-msg" class="footnote" style="margin-top:8px">' +
          (ORG_MODE
            ? 'Free for your organization \u2014 the download still lands on the access log, because "who holds a copy" should always be a query.'
            : 'Viewing is free. Keeping a copy carries the sharing organization\u2019s download fee, and every download is on the access log.') +
          '</p></div>'
        : '');

    var dlBtn = document.getElementById('dl-btn');
    if (dlBtn) dlBtn.addEventListener('click', function () { requestDownload(item, null); });
  }

  /**
   * Watching is free; keeping a copy settles a fee first. The 402 carries the
   * price and the ledger row; Pay settles it (Stripe in production, the dev
   * path here) and the retry mints the real file.
   */
  function requestDownload(item, downloadId) {
    var msg = document.getElementById('dl-msg');
    var btn = document.getElementById('dl-btn');
    if (ORG_MODE) {
      // The org's own copy of its own evidence: no fee, same ledger.
      apiFetch('/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/download')
        .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
        .then(function (res) {
          if (res.status >= 400) {
            if (msg) msg.textContent = (res.body && res.body.error) || 'The download could not be prepared.';
            return;
          }
          if (msg) msg.textContent = 'Ready — the link is good for ten minutes, and this download is now on the access log.';
          window.open(res.body.url, '_blank');
        })
        .catch(function () { if (msg) msg.textContent = 'The download could not be prepared.'; });
      return;
    }
    var base = '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN);
    apiFetch(base + '/evidence/' + encodeURIComponent(item.id) + '/download', { method: 'POST' })
      .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
      .then(function (res) {
        if (res.status === 402) {
          if (msg) msg.textContent = res.body.message + ' Every download is on the access log.';
          if (btn) {
            btn.textContent = 'Pay $' + (res.body.feeCents / 100).toFixed(2) + ' and download';
            btn.onclick = function () {
              apiFetch(base + '/downloads/' + encodeURIComponent(res.body.downloadId) + '/pay', { method: 'POST' })
                .then(function (r2) { return r2.json(); })
                .then(function () { requestDownload(item, res.body.downloadId); })
                .catch(function () { if (msg) msg.textContent = 'Payment did not go through. Try again.'; });
            };
          }
          return;
        }
        if (res.status >= 400) {
          if (msg) msg.textContent = (res.body && res.body.error) || 'The download could not be prepared.';
          return;
        }
        if (msg) msg.textContent = 'Ready \u2014 the link is good for ten minutes, and this download is now on the access log.';
        window.open(res.body.url, '_blank');
      })
      .catch(function () { if (msg) msg.textContent = 'The download could not be prepared.'; });
  }

  /* ------------------------------------------------------------------ *
   * Wiring
   * ------------------------------------------------------------------ */

  var EMBEDDED = document.body.hasAttribute('data-atm-embed') ||

  /* Light ↔ dark. Same keys as the React console and the marketing site so a
     tap here is visible everywhere on this origin. */
  var THEME_KEY = 'atmosphere.theme';
  var PREFS_KEY = 'atmosphere.preferences';
  var LEGACY_THEME_KEY = 'atm-theme';

  function osTheme() {
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {
      return 'dark';
    }
  }

  function coerceTheme(p) {
    if (p === 'light' || p === 'dark') return p;
    return osTheme();
  }

  function readThemePref() {
    try {
      var stored = localStorage.getItem(THEME_KEY);
      if (stored === 'light' || stored === 'dark' || stored === 'system') return coerceTheme(stored);
      try {
        var prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'system') {
          return coerceTheme(prefs.theme);
        }
      } catch (e) { /* ignore */ }
      stored = localStorage.getItem(LEGACY_THEME_KEY);
      if (stored === 'light' || stored === 'dark') return stored;
    } catch (e) { /* private mode */ }
    return osTheme();
  }

  function persistThemePref(pref) {
    pref = coerceTheme(pref);
    try {
      localStorage.setItem(THEME_KEY, pref);
      var prefs = {};
      try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch (e) { prefs = {}; }
      prefs.theme = pref;
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      localStorage.setItem(LEGACY_THEME_KEY, pref);
    } catch (e) { /* private mode */ }
    return pref;
  }

  function applyThemePref(pref) {
    pref = coerceTheme(pref);
    document.documentElement.setAttribute('data-theme', pref);
    document.documentElement.setAttribute('data-theme-preference', pref);
    return pref;
  }

  function themeLabel(pref) {
    return pref === 'light' ? 'Light' : 'Dark';
  }

  function labelThemeToggle(toggle, pref) {
    var next = pref === 'dark' ? 'light' : 'dark';
    toggle.setAttribute('aria-label', 'Switch to ' + next + ' mode');
    toggle.setAttribute('title', themeLabel(pref) + ' mode. Click for ' + next + '.');
    var text = toggle.querySelector('.theme-toggle-label');
    if (text) text.textContent = 'Appearance: ' + themeLabel(pref);
  }

  function labelAllThemeToggles(pref) {
    var el = document.getElementById('theme-toggle');
    if (el) labelThemeToggle(el, pref);
  }

  function setThemePref(pref, opts) {
    pref = persistThemePref(pref);
    applyThemePref(pref);
    labelAllThemeToggles(pref);
    if (EMBEDDED && !(opts && opts.fromParent)) {
      window.parent.postMessage({ atmosphere: 'theme', preference: pref }, '*');
    }
    return pref;
  }

  function bindThemeToggle(toggle) {
    if (!toggle) return;
    labelThemeToggle(toggle, readThemePref());
    toggle.addEventListener('click', function () {
      setThemePref(readThemePref() === 'dark' ? 'light' : 'dark');
    });
  }

  function initThemeToggle() {
    var pref = readThemePref();
    persistThemePref(pref);
    applyThemePref(pref);
    bindThemeToggle(document.getElementById('theme-toggle'));
    window.addEventListener('storage', function (event) {
      if (event.key !== THEME_KEY && event.key !== PREFS_KEY && event.key !== LEGACY_THEME_KEY) return;
      var next = readThemePref();
      applyThemePref(next);
      labelAllThemeToggles(next);
    });
  }
