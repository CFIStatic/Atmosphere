        (path ? '<button type="button" class="jf-copy" data-copy="' + esc(full) + '">Copy link</button>' : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function submitShare(form) {
    var key = jobSheet.key;
    var label = (form.label.value || '').trim();
    var email = (form.email.value || '').trim();
    var days = Number(form.days.value);
    if (!label) return;
    jobSheet.busy = true;
    jobSheet.error = null;
    paintJobFileSheet();
    if (!canOpenJobRecord(key)) {
      var fake = { id: 'demo-' + Date.now(), label: label, path: '/progress/demo-' + key, state: 'live', recipientEmail: email || null };
      DEMO_SHARES[key] = (DEMO_SHARES[key] || []).concat([fake]);
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.made = { note: email ? 'Demo link ready for ' + label + '.' : 'Demo link created. Copy it below.', path: location.origin + fake.path };
      jobSheet.busy = false;
      paintJobFileSheet();
      render();
      return;
    }
    fetch('/api/evidence-portal/shares', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jobId: key,
        label: label,
        kind: 'progress',
        recipientEmail: email || undefined,
        expiresInDays: days
      })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      jobSheet.busy = false;
      if (!res.ok) {
        jobSheet.error = (res.body && (res.body.error || res.body.message)) || 'Could not create the share.';
        paintJobFileSheet();
        return;
      }
      var path = (res.body.share && res.body.share.path) || (res.body.path);
      jobSheet.made = {
        note: res.body.emailed ? 'Emailed. They can open the link directly — no account needed.' : 'Link created. Copy it and send it yourself:',
        path: path ? (location.origin + path) : ''
      };
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      paintJobFileSheet();
      render();
    }).catch(function (err) {
      jobSheet.busy = false;
      jobSheet.error = err && err.message ? err.message : 'Could not create the share.';
      paintJobFileSheet();
    });
  }

  function submitInvite(form) {
    var key = jobSheet.key;
    var company = (form.company.value || '').trim();
    var kind = form.kind.value || '';
    var parsed = parseInviteKind(kind);
    var role = parsed.role;
    var trade = parsed.trade;
    var email = (form.email.value || '').trim();
    if (!company || !kind) return;
    jobSheet.busy = true;
    jobSheet.error = null;
    paintJobFileSheet();
    if (!canOpenJobRecord(key)) {
      DEMO_PEOPLE[key] = (DEMO_PEOPLE[key] || []).concat([{ name: company, role: role, trade: trade, email: email || null }]);
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.busy = false;
      jobSheet.made = { note: company + ' added to this job file.' };
      paintJobFileSheet();
      render();
      toast(company + ' added to the job.');
      return;
    }
    fetch('/api/operations/shared/' + encodeURIComponent(key) + '/parties', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: company,
        role: role,
        trade: trade || null,
        email: email || null
      })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      jobSheet.busy = false;
      if (!res.ok) {
        jobSheet.error = (res.body && (res.body.error || res.body.message)) || 'Could not add that person.';
        paintJobFileSheet();
        return;
      }
      JOB_BOARD[key] = null;
      hydrateJobBoard(key);
      jobSheet.error = null;
      paintJobFileSheet();
      render();
      toast(company + ' added to the job.');
    }).catch(function (err) {
      jobSheet.busy = false;
      jobSheet.error = err && err.message ? err.message : 'Could not add that person.';
      paintJobFileSheet();
    });
  }

  (function initJobFileSheet() {
    var close = document.getElementById('jf-close');
    var sheet = document.getElementById('jobfile-sheet');
    if (close) close.addEventListener('click', closeJobFileSheet);
    if (sheet) {
      sheet.addEventListener('click', function (ev) {
        if (ev.target === sheet) closeJobFileSheet();
      });
    }
    document.querySelectorAll('#jobfile-sheet [data-jf-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        jobSheet.tab = btn.getAttribute('data-jf-tab');
        jobSheet.made = null;
        jobSheet.error = null;
        var title = document.getElementById('jf-title');
        if (title) title.textContent = jobSheet.tab === 'invite' ? 'Add people to this job' : 'Share this job';
        document.querySelectorAll('#jobfile-sheet [data-jf-tab]').forEach(function (t) {
          t.setAttribute('aria-selected', t.getAttribute('data-jf-tab') === jobSheet.tab ? 'true' : 'false');
        });
        paintJobFileSheet();
      });
    });
  })();

  /* ------------------------------------------------------------------ *
   * Detail
   * ------------------------------------------------------------------ */

  var VERDICT_WORD = {
    appears_complete: ['pass', 'Appears complete'],
    in_progress: ['unknown', 'In progress'],
    not_visible: ['neutral', 'Not visible']
  };

  function open(id, tab) {
    var item = EVIDENCE.filter(function (e) { return e.id === id; })[0];
    if (!item) return;
    // Against a live backend the list is thin: custody and frames arrive when
    // a clip is opened, which is also the moment the access gets logged.
    if (item._remote && !item._loaded) {
      fetchRemoteDetail(item).then(function () { openLoaded(item, tab); });
      return;
    }
    openLoaded(item, tab);
  }

  function openLoaded(item, tab) {
    state.open = item;
    state.frame = 0;
    stopPlay();

    $('#d-title').textContent = (JOBS[item.job] || { name: item.jobName || 'Job' }).name;
    $('#d-meta').innerHTML =
      '<span class="id">' + esc(item.id) + '</span> · ' + esc(item.phase) + ' · ' +
      dayLabel(item.workDate) + ' · ' + esc(item.company) + ' · ' + dur(item.duration) + ' · ' + mb(item.bytes);

    // Prefer the real file when the portal minted a URL. Frames remain the
    // fallback for the demo artifact and for clips whose file URL expired.
    if (item._videoUrl) {
      // The poster is the same still the list showed, so the player opens on
      // the clip rather than on the black rectangle a browser picks.
      var posterAttr = item.poster ? ' poster="' + esc(item.poster) + '"' : '';
      $('#d-frame').innerHTML =
        '<video controls playsinline preload="metadata"' + posterAttr +
        ' src="' + esc(item._videoUrl) + '"></video>';
      $('#d-scrub').innerHTML = '';
      $('#d-time').textContent = 'full clip · ' + dur(item.duration);
      var vid = $('#d-frame').querySelector('video');
      if (vid) {
        vid.addEventListener('timeupdate', function () {
          syncAnalysisLog(vid.currentTime);
          if (!vid.paused && !vid.ended) tickWatch(item, false);
        });
        vid.addEventListener('seeked', function () { syncAnalysisLog(vid.currentTime); });
        vid.addEventListener('play', function () {
          syncAnalysisLog(vid.currentTime);
          tickWatch(item, true);
        });
        vid.addEventListener('pause', function () { syncAnalysisLog(vid.currentTime); });
        vid.addEventListener('ended', function () { syncAnalysisLog(vid.currentTime); });
        vid.addEventListener('loadeddata', function () { tickWatch(item, true); });
      }
    } else {
      item._frames = item._remoteFrames && item._remoteFrames.length
        ? item._remoteFrames
        : frames(item.before || { wet: 0.3, cut: 0.1, gear: 0 },
                 item.after || { wet: 0.2, cut: 0.3, gear: 0, seconds: item.duration || 120 },
                 item.phase + ' · ' + item.workDate);

      $('#d-scrub').innerHTML = item._frames.map(function (f, i) {
        return '<button data-i="' + i + '" aria-pressed="' + (i === 0) + '" aria-label="Frame ' + (i + 1) + '"></button>';
      }).join('');
      Array.prototype.forEach.call($('#d-scrub').querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () { stopPlay(); setFrame(+b.dataset.i); });
      });
      setFrame(0);
    }

    renderDictation(item);
    renderAnalysis(item);
    setTab(tab || 'analysis');
    $('#detail').setAttribute('data-open', '1');
    $('#d-close').focus();
    startLivePlayback(item);
  }

  function renderDictation(item) {
    var a = item.analysis || {};
    var el = $('#d-dictation');
    var pill = $('#d-dictation-pill');
    if (!el) return;

    if (a.state === 'queued') {
      if (pill) pill.textContent = 'Writing…';
      el.innerHTML = '<p style="color:var(--muted)">The assistant is reading this clip now. The dictation will land here when it finishes.</p>';
      return;
    }
    if (a.state === 'failed') {
      if (pill) pill.textContent = 'Failed';
      el.innerHTML = '<p style="color:var(--fail)">The dictation failed after retries. The footage itself is unaffected and can be re-read from the platform.</p>';
      return;
    }
    if (a.state === 'paired' || a.state === 'skipped' || a.state === 'none' || !a.state) {
      if (pill) pill.textContent = 'Not yet';
      el.innerHTML = '<p style="color:var(--muted)">' + esc(
        a.reason || (a.state === 'paired'
          ? 'This is the before half of a day. Open the after clip for the dictation of what changed.'
          : 'No AI dictation on this clip yet.')
      ) + '</p>';
      return;
    }

    if (pill) {
      pill.textContent = a.longForm ? 'Workday reading' : 'Clip reading';
    }

    var text = a.dictation || a.summary || '';
    var html = '<p>' + esc(text) + '</p>';
    if (a.actions && a.actions.length) {
      html += '<p class="k" style="margin:14px 0 6px">Actions seen</p><ul class="entries">' + a.actions.map(function (act) {
        var t = act.atSeconds != null ? dur(act.atSeconds) : '';
        var verb = String(act.action || '').replace(/_/g, ' ');
        var body = (verb ? verb + ' — ' : '') + (act.description || '');
        return '<li><span class="t">' + esc(String(t)) + '</span><span>' + esc(body) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (a.dictationEntries && a.dictationEntries.length) {
      html += '<ul class="entries">' + a.dictationEntries.map(function (e) {
        var t = e.atSeconds != null ? dur(e.atSeconds) : (e.t || '');
        var body = e.text || e.note || e.summary || '';
        return '<li><span class="t">' + esc(String(t)) + '</span><span>' + esc(body) + '</span></li>';
      }).join('') + '</ul>';
    }
    el.innerHTML = html;
  }

  function setFrame(i) {
    var item = state.open;
    if (!item) return;
    state.frame = i;
    var f = item._frames[i];
    $('#d-frame').innerHTML = '<img alt="Frame ' + (i + 1) + ' of the clip" src="' + f.src + '" />';
    $('#d-time').textContent = 'frame ' + (i + 1) + ' / ' + item._frames.length + ' · ' + dur(f.at);
    Array.prototype.forEach.call($('#d-scrub').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.i === i));
    });
    syncAnalysisLog(f.at);
  }

  function stopPlay() {
    if (state.playing) { clearInterval(state.playing); state.playing = null; }
  }

  function startFramePlayback() {
    if (state.playing) return;
    state.playing = setInterval(function () {
      var item = state.open;
      if (!item || !item._frames) return stopPlay();
      var next = state.frame + 1;
      if (next >= item._frames.length) { stopPlay(); syncAnalysisLog(currentPlayhead()); return; }
      setFrame(next);
    }, 700);
  }

  function startLivePlayback(item) {
    if (!item) return;
    resetWatch(item);
    if ((item.duration || 0) > 600) {
      tickWatch(item, true);
      return;
    }
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) {
      var attempt = vid.play();
      if (attempt && attempt.catch) {
        attempt.catch(function () {
          vid.muted = true;
          vid.play().catch(function () {});
        });
      }
      tickWatch(item, true);
      return;
    }
    if (item._frames && item._frames.length > 1) startFramePlayback();
    tickWatch(item, true);
  }

  var WATCH = { inflight: false, lastAt: -99, failed: null, itemId: null };

  function resetWatch(item) {
    WATCH.inflight = false;
    WATCH.lastAt = -99;
    WATCH.failed = null;
    WATCH.itemId = item && item.id;
    if (item) {
      item.analysis = item.analysis || { state: item.analysis && item.analysis.state };
      item.analysis.watchNotes = item.analysis.watchNotes || [];
    }
  }

  function grabPlayheadJpeg(cb) {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid && vid.readyState >= 2 && vid.videoWidth) {
      try {
        var canvas = document.createElement('canvas');
        var w = Math.min(640, vid.videoWidth || 640);
        var h = Math.max(1, Math.round(((vid.videoHeight || 360) / (vid.videoWidth || 640)) * w));
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(vid, 0, 0, w, h);
        var data = canvas.toDataURL('image/jpeg', 0.72);
        cb(data.replace(/^data:image\/jpeg;base64,/, ''));
        return;
      } catch (_err) { /* fall through */ }
    }
    var item = state.open;
    if (item && item._frames && item._frames[state.frame] && item._frames[state.frame].src) {
      var src = item._frames[state.frame].src;
      var marker = 'base64,';
      var idx = src.indexOf(marker);
      cb(idx >= 0 ? src.slice(idx + marker.length) : null);
      return;
    }
    cb(null);
  }

  function rememberWatchNote(item, at, text) {
    item.analysis = item.analysis || {};
    item.analysis.watchNotes = item.analysis.watchNotes || [];
    var t = String(text || '').trim();
    if (!t) return false;
    if (item.analysis.watchNotes.some(function (n) {
      return Math.abs((n.atSeconds || 0) - at) < 2 && n.text === t;
    })) return false;
    item.analysis.watchNotes.push({ atSeconds: at, text: t });
    return true;
  }

  function tickWatch(item, force) {
    if (!item || !item._remote) return;
    if (WATCH.inflight) return;
    var at = currentPlayhead();
    if (!force && Math.abs(at - WATCH.lastAt) < 4) return;
    WATCH.inflight = true;
    WATCH.lastAt = at;
    setAnalysisPill('Writing…');
    grabPlayheadJpeg(function (frame) {
      var url = ORG_MODE
        ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/watch'
        : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id) + '/watch';
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var hang = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
      fetch(url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ atSeconds: at, frameBase64: frame || undefined }),
        signal: ctrl && ctrl.signal
      }).then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) {
            var err = new Error((body && (body.error || body.message)) || 'Could not read this moment.');
            err.code = body && body.code;
            throw err;
          }
          return body;
        });
      }).then(function (body) {
        if (body && body.note && rememberWatchNote(item, body.atSeconds != null ? body.atSeconds : at, body.note)) {
          if (state.open && state.open.id === item.id && isAnalysisTab()) {
            ensureAnalysisNotes(item);
          }
        }
        WATCH.failed = null;
      }).catch(function (err) {
        WATCH.failed = (err && err.message) || 'Could not read this moment.';
        if (state.open && state.open.id === item.id) {
          setAnalysisPill(err && err.code === 'model_provider_unconfigured' ? 'Needs key' : 'Retrying');
          var empty = document.getElementById('alog-empty');
          if (empty && err && err.code === 'model_provider_unconfigured') {
            empty.textContent = WATCH.failed;
            empty.hidden = false;
          }
        }
      }).finally(function () {
        clearTimeout(hang);
        WATCH.inflight = false;
        if (state.open && state.open.id === item.id) syncAnalysisLog(currentPlayhead());
      });
    });
  }

  function renderAnalysis(item) {
    // Scope / timeline / gaps — the structured reading under the dictation.
    // The spoken description itself lives in renderDictation.
    var a = item.analysis || {};
    var el = $('#d-analysis');
    if (!el) return;

    if (a.state === 'failed') {
      el.innerHTML = '<p style="color:var(--fail)">Scope reading failed with the dictation. Re-run from the platform; the footage is unaffected.</p>';
      return;
    }
    if (a.state === 'queued' || a.state === 'skipped' || a.state === 'paired' || a.state === 'none' || !a.state) {
      el.innerHTML = '<p style="color:var(--muted)">' + esc(
        a.reason || (a.state === 'paired'
          ? 'Open the after clip for the scope reading of this day.'
          : 'No scope reading on this clip yet.')
      ) + '</p>' + (a.pairedWith
        ? '<p><button class="navitem" style="width:auto;margin:6px 0 0;border:1px solid var(--line)" data-goto="' + a.pairedWith + '">Open ' + esc(a.pairedWith) + '</button></p>'
        : '');
      var goto = el.querySelector('[data-goto]');
      if (goto) goto.addEventListener('click', function () { open(goto.dataset.goto); });
      return;
    }

    var vl;
    if (a.longForm) {
      var hours = item.duration ? (item.duration / 3600).toFixed(1) : '?';
      vl = ['pass', 'A ' + hours + '-hour workday, read in ' +
        (a.windowsRead != null ? a.windowsRead : '?') + ' of ' +
        (a.windowsTotal != null ? a.windowsTotal : '?') + ' time windows'];
    } else {
      vl = a.materialChange === 'significant'
        ? ['pass', 'Work materially changed between the two clips']
        : a.materialChange === 'minor'
          ? ['unknown', 'Minor visible change only']
          : a.materialChange === 'none'
            ? ['fail', 'No visible change between the two clips']
            : ['unknown', 'Could not compare the two clips'];
    }

    var html = '<div class="verdictline ' + vl[0] + '">' + esc(vl[1]) + '</div>';
    if (a.materialBecause) {
      html += '<p style="font-size:12.5px;color:var(--muted)"><strong style="color:var(--ink-2)">Why:</strong> ' +
        esc(a.materialBecause) + '</p>';
    }

    if (a.scope && a.scope.length) {
      html += '<ul class="scopelist">';
      a.scope.forEach(function (s) {
        var w = VERDICT_WORD[s.verdict] || ['neutral', s.verdict];
        html += '<li><span class="label">' + esc(s.title) +
          (s.because ? '<span style="display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px">' + esc(s.because) +
            (s.seenInWindows && s.seenInWindows.length ? ' <span class="mono" style="color:var(--faint)">· seen in ' + s.seenInWindows.length + ' window' + (s.seenInWindows.length === 1 ? '' : 's') + '</span>' : '') +
            '</span>' : '') +
          '</span><span class="chip ' + w[0] + '">' + esc(w[1]) + '</span></li>';
      });
      html += '</ul>';
    } else {
      html += '<p style="color:var(--muted);font-size:12.5px">No agreed scope lines were attached to this reading.</p>';
    }

    if (a.longForm && a.timeline && a.timeline.length) {
      var hhmm = function (s) {
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h + ':' + String(m).padStart(2, '0');
      };
      html += '<h5 style="margin:14px 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)">The day, hour by hour</h5>';
      html += '<ul class="custody" style="margin-top:4px">' + a.timeline.map(function (t) {
        return '<li><div><span class="act mono" style="font-size:11.5px">' + hhmm(t.startSeconds) + '–' + hhmm(t.endSeconds) + '</span> ' +
          '<span class="by">' + esc(t.summary) + '</span></div></li>';
      }).join('') + '</ul>';
    }

    if (a.couldNotTell && a.couldNotTell.length) {
      html += '<h5 style="margin:14px 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)">What it could not tell</h5>';
      html += '<ul style="margin:0;padding-left:17px;font-size:12.5px;color:var(--muted);line-height:1.6">' +
        a.couldNotTell.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
    }

    html += '<p class="footnote" style="margin-top:14px;padding-top:11px;border-top:1px solid var(--line-soft)">' +
      'This is a reading of the footage by a model, not an inspection. It is recorded as an analysis and ' +
      'never as an acceptance — releasing money is a person\'s act.</p>';

    el.innerHTML = html;
  }

  var ASK_THREADS = {};

  function analysisLog(item) {
    var a = item.analysis || {};
    var rows = [];
    var seen = {};
    function add(at, text, kind) {
      var t = String(text || '').trim();
      if (!t) return;
      var key = at + '|' + t;
      if (seen[key]) return;
      seen[key] = true;
      rows.push({ at: Math.max(0, Number(at) || 0), text: t, kind: kind || 'note' });
    }
    (a.watchNotes || []).forEach(function (e) {
      add(e.atSeconds, e.text, 'watch');
    });
    (a.dictationEntries || []).forEach(function (e) {
      add(e.atSeconds, e.text || e.note || e.summary, 'read');
    });
    (a.actions || []).forEach(function (act) {
      var verb = String(act.action || '').replace(/_/g, ' ');
      add(act.atSeconds, (verb ? verb + ' — ' : '') + (act.description || ''), 'action');
    });
    (a.timeline || []).forEach(function (t) {
      add(t.startSeconds, t.summary, 'window');
    });
    if (rows.length < 6 && a.changes && a.changes.length) {
      var d = item.duration || 120;
      a.changes.forEach(function (c, i) {
        add(Math.round((i + 1) * d / (a.changes.length + 1)), c, 'change');
      });
    }
    if (rows.length < 5) {
      var prose = a.dictation || a.summary || '';
      String(prose).split(/(?<=[.!?])\s+/).forEach(function (sentence, i, all) {
        var s = String(sentence || '').trim();
        if (!s) return;
        add(Math.round((i + 0.5) * (item.duration || 120) / Math.max(all.length, 1)), s, 'read');
      });
    }
    if (rows.length < 2 && a.scope && a.scope.length) {
      var d2 = item.duration || 120;
      a.scope.forEach(function (s, i) {
        var w = VERDICT_WORD[s.verdict];
        add(
          Math.round(i * d2 / Math.max(a.scope.length - 1, 1)),
          s.title + (w ? ' — ' + w[1] : ''),
          'scope'
        );
      });
    }
    rows.sort(function (x, y) { return x.at - y.at; });
    return rows;
  }

  function currentPlayhead() {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) return vid.currentTime || 0;
    var item = state.open;
    if (item && item._frames && item._frames[state.frame]) return item._frames[state.frame].at || 0;
    return 0;
  }

  function isFootagePlaying() {
    if (state.playing) return true;
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    return Boolean(vid && !vid.paused && !vid.ended);
  }

  function setAnalysisPill(text) {
    var pill = document.getElementById('alog-pill');
    if (pill) pill.textContent = text;
  }

  function fillNote(li, animate) {
    var span = li.querySelector('[data-full]');
    if (!span) {
      li.setAttribute('data-written', '1');
      return;
    }
    var full = span.getAttribute('data-full') || '';
    if (li._typeTimer) {
      clearTimeout(li._typeTimer);
      li._typeTimer = null;
    }
    if (!animate || li.getAttribute('data-written')) {
      span.textContent = full;
      li.classList.remove('writing');
      li.setAttribute('data-written', '1');
      return;
    }
    li.classList.add('writing');
    var i = 0;
    function tick() {
      i += Math.max(2, Math.ceil(full.length / 40));
      span.textContent = full.slice(0, i);
      if (i >= full.length) {
        li.classList.remove('writing');
        li.setAttribute('data-written', '1');
        li._typeTimer = null;
        setAnalysisPill(isFootagePlaying() ? 'Watching' : 'Paused');
        return;
      }
      li._typeTimer = setTimeout(tick, 18);
    }
    span.textContent = '';
    tick();
  }

  function syncAnalysisLog(seconds) {
    var list = document.getElementById('alog');
    if (!list) return;
    var items = list.querySelectorAll('[data-at]');
    if (!items.length) return;
    var lastSeen = -1;
    Array.prototype.forEach.call(items, function (li, i) {
      if (seconds + 0.15 >= Number(li.getAttribute('data-at'))) lastSeen = i;
    });
    var empty = document.getElementById('alog-empty');
    var playing = isFootagePlaying();
    Array.prototype.forEach.call(items, function (li, i) {
      var due = i <= lastSeen;
      li.classList.toggle('on', i === lastSeen && lastSeen >= 0);
      li.classList.toggle('seen', i < lastSeen);
      li.classList.toggle('soon', !due);
      if (!due) return;
      if (li.getAttribute('data-written') || li.classList.contains('writing')) return;
      fillNote(li, playing && i === lastSeen);
    });
    if (empty) empty.hidden = lastSeen >= 0;
    var cur = lastSeen >= 0 ? items[lastSeen] : null;
    if (lastSeen < 0) setAnalysisPill(playing ? 'Writing…' : 'Ready');
    else if (cur && cur.classList.contains('writing')) setAnalysisPill('Writing…');
    else if (playing && lastSeen < items.length - 1) setAnalysisPill('Watching');
    else if (lastSeen === items.length - 1) setAnalysisPill('Caught up');
    else setAnalysisPill('Paused');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function seekTo(seconds) {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) {
      vid.currentTime = seconds;
      syncAnalysisLog(seconds);
      return;
    }
    var item = state.open;
    if (!item || !item._frames || !item._frames.length) {
      syncAnalysisLog(seconds);
      return;
    }
    var best = 0;
    var dist = Infinity;
    item._frames.forEach(function (f, i) {
      var d = Math.abs((f.at || 0) - seconds);
      if (d < dist) { dist = d; best = i; }
    });
    stopPlay();
    setFrame(best);
  }

  function isAnalysisTab(tab) {
    var t = tab || state.tab;
    return t === 'analysis' || t === 'integrity' || t === 'ask';
  }

  function normalizeTab(tab) {
    if (!tab || tab === 'integrity' || tab === 'ask') return 'analysis';
    return tab;
  }

  function analysisEmptyCopy(item) {
    var a = item.analysis || {};
    if (WATCH.failed) return WATCH.failed;
    if (a.reason) return a.reason;
    if (a.state === 'paired') {
      return 'This is the before half of the day. Play it anyway — notes still write as the footage plays.';
    }
    if (a.state === 'failed') {
      return 'The filed reading failed. Play the clip and the assistant will still describe what is on screen.';
    }
    return 'Play the clip. Notes appear here as the footage plays.';
  }

  function analysisPillLabel(item) {
    var a = item.analysis || {};
    var rows = analysisLog(item);
    if (a.state === 'failed') return 'Failed';
    if (WATCH.failed && WATCH.failed.indexOf('model key') >= 0) return 'Needs key';
    if ((a.state === 'queued' || a.state === 'none' || !a.state) && !rows.length) return 'Writing…';
    if (a.state === 'paired' || a.state === 'skipped') return 'Watching';
    return 'Ready';
  }

  function renderScopeLog(item) {
    var a = item.analysis || {};
    var rows = analysisLog(item);
    var html = '<div class="alog-head"><h4>Live notes</h4><span class="livepill" id="alog-pill">' +
      analysisPillLabel(item) + '</span></div>';
    html += '<p class="alog-wait" id="alog-empty">' + esc(analysisEmptyCopy(item)) + '</p>';
    if (a.pairedWith && !rows.length) {
      html += '<p><button class="navitem" style="width:auto;margin:6px 0 0;border:1px solid var(--line)" data-goto="' +
        a.pairedWith + '">Open ' + esc(a.pairedWith) + '</button></p>';
    }
    if (rows.length) {
      html += '<ul class="alog" id="alog">' + rows.map(function (r) {
        return '<li data-at="' + r.at + '" class="soon">' +
          '<span class="t">' + dur(r.at) + '</span><span data-full="' + esc(r.text) + '"></span></li>';
      }).join('') + '</ul>';
    }
    return html;
  }

  function bindNoteSeek(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('#alog [data-at]'), function (li) {
      if (li._boundSeek) return;
      li._boundSeek = true;
      li.addEventListener('click', function () { seekTo(Number(li.getAttribute('data-at'))); });
    });
    var goto = (root || document).querySelector('[data-goto]');
    if (goto && !goto._boundGoto) {
      goto._boundGoto = true;
      goto.addEventListener('click', function () { open(goto.dataset.goto); });
    }
  }

  function noteKey(at, text) {
    return String(at) + '|' + String(text || '');
  }

  function ensureAnalysisNotes(item) {
    var host = document.querySelector('.analysis-notes');
    if (!host) return;
    var rows = analysisLog(item);
    var list = document.getElementById('alog');
    if (!list) {
      host.innerHTML = renderScopeLog(item);
      bindNoteSeek(host);
      syncAnalysisLog(currentPlayhead());
      return;
    }
    var have = {};
    Array.prototype.forEach.call(list.querySelectorAll('[data-at]'), function (li) {
      var span = li.querySelector('[data-full]');
      have[noteKey(li.getAttribute('data-at'), span && span.getAttribute('data-full'))] = true;
    });
    rows.forEach(function (r) {
      if (have[noteKey(r.at, r.text)]) return;
      var li = document.createElement('li');
      li.setAttribute('data-at', String(r.at));
      li.className = 'soon';
      li.innerHTML = '<span class="t">' + dur(r.at) + '</span><span data-full="' + esc(r.text) + '"></span>';
      list.appendChild(li);
    });
    bindNoteSeek(host);
    syncAnalysisLog(currentPlayhead());
  }

  var ASK_STOP = {
    the: 1, a: 1, an: 1, in: 1, on: 1, of: 1, to: 1, and: 1, or: 1, did: 1, does: 1, do: 1,
    is: 1, was: 1, are: 1, were: 1, this: 1, that: 1, it: 1, any: 1, anything: 1, something: 1,
    what: 1, when: 1, where: 1, how: 1, who: 1, why: 1, clip: 1, video: 1, footage: 1, they: 1,
    them: 1, their: 1, there: 1, for: 1, with: 1, from: 1, about: 1, have: 1, has: 1, been: 1,
    show: 1, shows: 1, seen: 1, visible: 1
  };

  function askTokens(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(/\s+/).filter(function (t) {
      return t.length > 2 && !ASK_STOP[t];
    });
  }

  function clipAskCorpus(item) {
    var a = item.analysis || {};
    var rows = [];
    function push(at, text) {
      var t = String(text || '').trim();
      if (t) rows.push({ at: at == null ? null : Number(at), text: t });
    }
    push(null, a.dictation);
    if (a.summary && a.summary !== a.dictation) push(null, a.summary);
    (a.dictationEntries || []).forEach(function (e) { push(e.atSeconds, e.text || e.note || e.summary); });
    (a.actions || []).forEach(function (act) {
      var verb = String(act.action || '').replace(/_/g, ' ');
      push(act.atSeconds, (verb ? verb + ' — ' : '') + (act.description || ''));
    });
    (a.timeline || []).forEach(function (t) { push(t.startSeconds, t.summary); });
    (a.changes || []).forEach(function (c) { push(null, c); });
    (a.scope || []).forEach(function (s) {
      push(null, [s.title, s.verdict, s.because].filter(Boolean).join(' — '));
    });
    (a.couldNotTell || []).forEach(function (c) { push(null, c); });
    (a.watchNotes || []).forEach(function (n) { push(n.atSeconds, n.text); });
    return rows;
  }

  function answerClipLocally(item, question) {
    var a = item.analysis || {};
    var q = String(question || '').trim();
    var rows = clipAskCorpus(item);
    if (!rows.length && (a.state === 'paired' || a.state === 'waiting_on_after')) {
      return 'This is the before half of the day. Open the after clip — that is where the reading of what changed lives.';
    }
    if (!rows.length && a.state === 'queued') return 'This clip is still being read. Ask again once the dictation lands.';
    if (!rows.length && a.state === 'failed') return 'The reading of this clip failed. The footage itself is unaffected.';
    if (!rows.length && a.state === 'skipped') return 'There is no after video on file for this day, so there is nothing to compare against.';
    if (!rows.length) return 'This clip has not been read yet, so there is nothing to answer from.';
    if (/what (happened|did|work)|did anything|anything happen|what('s| is) (visible|going on)|any work/i.test(q)) {
      var changes = (a.changes || []).filter(Boolean);
      var actions = (a.actions || []).map(function (act) { return act.description; }).filter(Boolean);
      var watched = (a.watchNotes || []).map(function (n) { return n.text; }).filter(Boolean);
      var date = item.workDate ? ' on ' + item.workDate : '';
      if (changes.length) return 'Yes — the footage' + date + ' shows: ' + changes.slice(0, 4).join('; ') + '.';
      if (actions.length) return 'Yes — the footage' + date + ' shows: ' + actions.slice(0, 4).join('; ') + '.';
      if (watched.length) return 'Yes — the footage' + date + ' shows: ' + watched.slice(0, 4).join('; ') + '.';
      if (a.dictation || a.summary) return 'The reading of this clip' + date + ': ' + (a.dictation || a.summary);
      return 'The footage on file does not show work happening.';
    }
    var qTokens = askTokens(q);
    if (!qTokens.length) return (a.dictation || a.summary || 'The footage on file does not show that.');
    var need = Math.min(2, qTokens.length);
    var scored = rows.map(function (row) {
      var hay = askTokens(row.text);
      var hits = qTokens.filter(function (t) {
        return hay.some(function (h) { return h.indexOf(t) !== -1 || t.indexOf(h) !== -1; });
      });
      return { row: row, score: hits.length };
    }).filter(function (e) { return e.score >= need; }).sort(function (x, y) {
      return y.score - x.score || (x.row.at || 0) - (y.row.at || 0);
    });
    if (!scored.length) return 'The footage on file does not show that.';
    var best = scored[0];
    var timed = scored.filter(function (e) { return e.row.at != null; })[0];
    var top = timed && timed !== best ? [best, timed] : scored.slice(0, 2);
    return top.map(function (e) {
      var when = e.row.at != null ? dur(e.row.at) : '';
      var text = e.row.text.replace(/\.$/, '');
      return when ? 'At ' + when + ', ' + text.charAt(0).toLowerCase() + text.slice(1) : text;
    }).join('. ') + '.';
  }

  function watchNotesPayload(item) {
    var notes = ((item.analysis || {}).watchNotes) || [];
    return notes.filter(function (n) { return n && n.text; }).slice(-40).map(function (n) {
      return { atSeconds: n.atSeconds, text: n.text };
    });
  }

  function askClip(item, question, history, cb) {
    var local = answerClipLocally(item, question);
    if (!item._remote) {
      cb(null, local);
      return;
    }
    var url = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/ask'
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id) + '/ask';
    fetch(url, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, history: history || [], watchNotes: watchNotesPayload(item) })
    }).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error((body && (body.error || body.message)) || 'Could not answer.');
        cb(null, body.answer || local);
      });
    }).catch(function () { cb(null, local); });
  }

  function renderAskThreadHtml(item, pending) {
    var thread = ASK_THREADS[item.id] || [];
    if (!thread.length && !pending) {
      return '<div class="ask-suggest">' +
        '<button type="button" data-ask="Did anything happen in this clip?">Did anything happen?</button>' +
        '<button type="button" data-ask="What work is visible?">What work is visible?</button>' +
        '<button type="button" data-ask="Is anything in this footage unfinished?">Anything unfinished?</button>' +
        '</div>';
    }
    return thread.map(function (m) {
      return '<div class="ask-bubble ' + esc(m.role) + '">' + esc(m.text) + '</div>';
    }).join('') + (pending ? '<div class="ask-bubble assistant pending">Reading the clip…</div>' : '');
  }

  function renderAsk(item) {
    return '<div class="ask-thread" id="ask-thread">' + renderAskThreadHtml(item, false) + '</div>' +
      '<form id="ask-form" class="ask-form">' +
      '<input id="ask-input" maxlength="1000" autocomplete="off" placeholder="Ask about this clip…" />' +
      '<button type="submit">Ask</button>' +
      '</form>';
  }

  function paintAskThread(item, pending) {
    var host = document.getElementById('ask-thread');
    if (!host) return;
    host.innerHTML = renderAskThreadHtml(item, pending);
    Array.prototype.forEach.call(host.querySelectorAll('[data-ask]'), function (btn) {
      btn.addEventListener('click', function () { sendAsk(item, btn.getAttribute('data-ask')); });
    });
    host.scrollTop = host.scrollHeight;
  }

  function sendAsk(item, text) {
    var q = String(text || '').trim();
    if (q.length < 3) return;
    var thread = ASK_THREADS[item.id] || [];
    thread.push({ role: 'user', text: q });
    ASK_THREADS[item.id] = thread;
    var history = thread.slice(0, -1).map(function (m) {
      return { role: m.role === 'assistant' ? 'assistant' : 'user', text: m.text };
    });
    var input = document.getElementById('ask-input');
    if (input) input.value = '';
    paintAskThread(item, true);
    askClip(item, q, history, function (_err, answer) {
      thread.push({ role: 'assistant', text: answer });
      ASK_THREADS[item.id] = thread;
      if (state.open && state.open.id === item.id) paintAskThread(item, false);
    });
  }

  function bindAsk(item) {
    var form = document.getElementById('ask-form');
    var input = document.getElementById('ask-input');
    if (form) {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        sendAsk(item, input && input.value);
      });
    }
    paintAskThread(item, false);
  }

  function renderAnalysisPane(item) {
    return '<div class="analysis-pane">' +
      '<div class="analysis-notes">' + renderScopeLog(item) + '</div>' +
      '<div class="analysis-ask">' + renderAsk(item) + '</div>' +
      '</div>';
  }

  function bindAnalysisPane(item) {
    bindNoteSeek(document.getElementById('d-panel'));
    bindAsk(item);
    syncAnalysisLog(currentPlayhead());
  }

  function setTab(tab) {
    tab = normalizeTab(tab);
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    });
    var item = state.open;
    if (!item) return;
    var el = $('#d-panel');
    el.className = tab === 'analysis' ? 'panel-analysis' : '';

    if (tab === 'analysis') {
      if (el.getAttribute('data-item') === item.id && el.querySelector('#ask-form')) {
        ensureAnalysisNotes(item);
        return;
      }
      el.setAttribute('data-item', item.id);
      el.innerHTML = renderAnalysisPane(item);
      bindAnalysisPane(item);
      return;
    }

    el.removeAttribute('data-item');
    if (tab === 'custody') {
      el.innerHTML = '<ul class="custody">' + item.custody.map(function (c) {
        return '<li class="' + (c.role === 'ai' ? 'ai' : '') + '">' +
          '<div><span class="act">' + esc(c.action) + '</span> <span class="by">· ' + esc(c.by) + '</span></div>' +
          '<div class="at">' + stamp(c.at) + (c.detail ? ' · ' + esc(c.detail) : '') + '</div></li>';
      }).join('') + '</ul>' +
      '<p class="footnote">Every access is logged at the moment a viewing link is minted, including external ' +
      'shares. The log is append-only: entries cannot be edited or removed, by anyone, including the account ' +
      'that owns the job.</p>';
      return;
    }

    var g = item.gps;
    var job = JOBS[item.job] || { name: item.jobName || 'Job', address: '' };
    el.innerHTML = '<dl class="kv">' +
      '<dt>Evidence ID</dt><dd class="mono">' + esc(item.id) + '</dd>' +
      '<dt>Job</dt><dd>' + esc(job.name) + '</dd>' +
      '<dt>Address</dt><dd>' + esc(job.address) + '</dd>' +
      '<dt>Capture</dt><dd>' + esc(item.phase) + ' · ' + dayLabel(item.workDate) + '</dd>' +
      '<dt>Filmed</dt><dd>' + (item.capturedAt ? stamp(item.capturedAt) : 'not reported by the device') + '</dd>' +
      '<dt>Received</dt><dd>' + stamp(item.uploadedAt) + '</dd>' +
      '<dt>Duration</dt><dd>' + dur(item.duration) + '</dd>' +
      '<dt>Size</dt><dd>' + mb(item.bytes) + '</dd>' +
      '<dt>Device</dt><dd>' + esc(item.device || 'not recorded') + '</dd>' +
      '<dt>Location</dt><dd>' + (g ? g.lat.toFixed(4) + ', ' + g.lon.toFixed(4) + ' (±' + g.accuracy + ' ft)' : 'not reported') + '</dd>' +
      '<dt>From site</dt><dd>' + (g && g.distanceFt != null ? (g.distanceFt > 1000 ? (g.distanceFt / 5280).toFixed(2) + ' mi' : g.distanceFt + ' ft') : '—') + '</dd>' +
      '<dt>SHA-256</dt><dd class="mono">' + esc(item.hash || 'not recorded') + '</dd>' +
      '<dt>Episode tier</dt><dd>Tier ' + item.tier + '</dd>' +
      '</dl>' +
      '<p class="footnote">The hash is of the original bytes as uploaded. Re-uploading the same file on another ' +
      'day or another job is caught by it, which is the cheapest fraud there is and the cheapest to catch.</p>' +
      (item._remote && (SHARE_TOKEN || ORG_MODE)
        ? '<div id="dl-block" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)">' +
          '<button id="dl-btn" class="navitem" style="width:auto;border:1px solid var(--line);font-weight:600">Download original file</button>' +
          '<p id="dl-msg" class="footnote" style="margin-top:8px">' +
          (ORG_MODE
            ? 'Free for your organization \u2014 the download still lands on the access log, because "who holds a copy" should always be a query.'
            : 'Viewing is free. Keeping a copy carries the sharing organization\u2019s download fee, and every download is on the access log.') +
          '</p></div>'
        : '');

    var dlBtn = document.getElementById('dl-btn');
    if (dlBtn) dlBtn.addEventListener('click', function () { requestDownload(item, null); });
  }

  /**
   * Watching is free; keeping a copy settles a fee first. The 402 carries the
   * price and the ledger row; Pay settles it (Stripe in production, the dev
   * path here) and the retry mints the real file.
   */
  function requestDownload(item, downloadId) {
    var msg = document.getElementById('dl-msg');
    var btn = document.getElementById('dl-btn');
    if (ORG_MODE) {
      // The org's own copy of its own evidence: no fee, same ledger.
      fetch('/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/download', { credentials: 'include' })
        .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
        .then(function (res) {
          if (res.status >= 400) {
            if (msg) msg.textContent = (res.body && res.body.error) || 'The download could not be prepared.';
            return;
          }
          if (msg) msg.textContent = 'Ready — the link is good for ten minutes, and this download is now on the access log.';
          window.open(res.body.url, '_blank');
        })
        .catch(function () { if (msg) msg.textContent = 'The download could not be prepared.'; });
      return;
    }
    var base = '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN);
    fetch(base + '/evidence/' + encodeURIComponent(item.id) + '/download', { method: 'POST', credentials: 'include' })
      .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
      .then(function (res) {
        if (res.status === 402) {
          if (msg) msg.textContent = res.body.message + ' Every download is on the access log.';
          if (btn) {
            btn.textContent = 'Pay $' + (res.body.feeCents / 100).toFixed(2) + ' and download';
            btn.onclick = function () {
              fetch(base + '/downloads/' + encodeURIComponent(res.body.downloadId) + '/pay', { method: 'POST', credentials: 'include' })
                .then(function (r2) { return r2.json(); })
                .then(function () { requestDownload(item, res.body.downloadId); })
                .catch(function () { if (msg) msg.textContent = 'Payment did not go through. Try again.'; });
            };
          }
          return;
        }
        if (res.status >= 400) {
          if (msg) msg.textContent = (res.body && res.body.error) || 'The download could not be prepared.';
          return;
        }
        if (msg) msg.textContent = 'Ready \u2014 the link is good for ten minutes, and this download is now on the access log.';
        window.open(res.body.url, '_blank');
      })
      .catch(function () { if (msg) msg.textContent = 'The download could not be prepared.'; });
  }

  /* ------------------------------------------------------------------ *
   * Wiring
   * ------------------------------------------------------------------ */

  var EMBEDDED = document.body.hasAttribute('data-atm-embed') ||
    new URLSearchParams(location.search).get('embed') === '1';
  var RAIL_ONLY = document.body.hasAttribute('data-atm-rail-only') ||
    new URLSearchParams(location.search).get('rail') === '1';
  if (RAIL_ONLY) document.body.setAttribute('data-atm-rail-only', '1');

  /* Light ↔ dark. Same keys as the React console and the marketing site so a
     tap here is visible everywhere on this origin. */
  var THEME_KEY = 'atmosphere.theme';
  var PREFS_KEY = 'atmosphere.preferences';
  var LEGACY_THEME_KEY = 'atm-theme';

  function osTheme() {
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {
      return 'dark';
    }
  }

  function coerceTheme(p) {
    if (p === 'light' || p === 'dark') return p;
    return osTheme();
  }

  function readThemePref() {
    try {
      var stored = localStorage.getItem(THEME_KEY);
      if (stored === 'light' || stored === 'dark' || stored === 'system') return coerceTheme(stored);
      try {
        var prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'system') {
          return coerceTheme(prefs.theme);
        }
      } catch (e) { /* ignore */ }
      stored = localStorage.getItem(LEGACY_THEME_KEY);
      if (stored === 'light' || stored === 'dark') return stored;
    } catch (e) { /* private mode */ }
    return osTheme();
  }

  function persistThemePref(pref) {
    pref = coerceTheme(pref);
    try {
      localStorage.setItem(THEME_KEY, pref);
      var prefs = {};
      try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch (e) { prefs = {}; }
      prefs.theme = pref;
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      localStorage.setItem(LEGACY_THEME_KEY, pref);
    } catch (e) { /* private mode */ }
    return pref;
  }

  function applyThemePref(pref) {
    pref = coerceTheme(pref);
    document.documentElement.setAttribute('data-theme', pref);
    document.documentElement.setAttribute('data-theme-preference', pref);
    return pref;
  }

  function themeLabel(pref) {
    return pref === 'light' ? 'Light' : 'Dark';
  }

  function labelThemeToggle(toggle, pref) {
    var next = pref === 'dark' ? 'light' : 'dark';
    toggle.setAttribute('aria-label', 'Switch to ' + next + ' mode');
    toggle.setAttribute('title', themeLabel(pref) + ' mode. Click for ' + next + '.');
  }

  function setThemePref(pref, opts) {
    pref = persistThemePref(pref);
    applyThemePref(pref);
    var toggle = document.getElementById('theme-toggle');
    if (toggle) labelThemeToggle(toggle, pref);
    if (EMBEDDED && !(opts && opts.fromParent)) {
      window.parent.postMessage({ atmosphere: 'theme', preference: pref }, '*');
    }
    return pref;
  }

  function initThemeToggle() {
    var toggle = document.getElementById('theme-toggle');
    var pref = readThemePref();
    persistThemePref(pref);
    applyThemePref(pref);
    if (toggle) {
      labelThemeToggle(toggle, pref);
      toggle.addEventListener('click', function () {
        setThemePref(readThemePref() === 'dark' ? 'light' : 'dark');
      });
    }
    window.addEventListener('storage', function (event) {
      if (event.key !== THEME_KEY && event.key !== PREFS_KEY && event.key !== LEGACY_THEME_KEY) return;
      var next = readThemePref();
      applyThemePref(next);
      if (toggle) labelThemeToggle(toggle, next);
    });
  }

  initThemeToggle();

  var activeRoute = '/verifier-library';
  // Which rail row owns the orange overlay. Dashboard and the Videos filters
  // share /verifier-library in the shell, so route alone cannot tell them apart
  // — only the last clicked bar should light up.
  var activeRailItem = 'dashboard';

  function syncSidebarActive() {
    document.querySelectorAll('.rail .navitem').forEach(function (btn) {
      btn.removeAttribute('aria-current');
    });

    if (activeRoute === '/field' || activeRoute.indexOf('/field/') === 0) {
      var fieldBtn = document.getElementById('nav-field');
      if (fieldBtn) fieldBtn.setAttribute('aria-current', 'true');
      return;
    }
    if (activeRoute === '/jobs' || activeRoute.indexOf('/jobs/') === 0) {
      var jobsBtn = document.getElementById('nav-jobs');
      if (jobsBtn) jobsBtn.setAttribute('aria-current', 'true');
      return;
    }
    if (activeRoute === '/intake') {
      var startJob = document.getElementById('nav-start-job');
      if (startJob) startJob.setAttribute('aria-current', 'true');
      return;
    }
    if (activeRoute === '/shared' || activeRoute === '/job-progress') {
      // Job record is a Dashboard detail — keep Dashboard lit.
      var dashOnRecord = document.querySelector('#platform-nav .app-nav[data-screen="dashboard"]');
      if (dashOnRecord) dashOnRecord.setAttribute('aria-current', 'true');
      return;
    }
    if (activeRoute === '/settings') {
      var settings = document.getElementById('nav-settings');
      if (settings) settings.setAttribute('aria-current', 'true');
      return;
    }

    // Library: exactly one of Dashboard or a Videos filter.
    if (activeRailItem === 'dashboard') {
      var dashBtn = document.querySelector('#platform-nav .app-nav[data-screen="dashboard"]');
      if (dashBtn) dashBtn.setAttribute('aria-current', 'true');
      return;
    }
    if (activeRailItem.indexOf('view:') === 0) {
      var view = activeRailItem.slice(5);
      document.querySelectorAll('.navitem[data-view]').forEach(function (btn) {
        if (btn.dataset.view === view) btn.setAttribute('aria-current', 'true');
      });
    }
  }

  function setActiveRoute(path) {
    var prev = activeRoute;
    activeRoute = path || '/verifier-library';
    if (activeRoute === '/verifier-library') {
      // Keep Dashboard vs Videos selection; only reset when arriving from
      // another top-level route without a rail click.
      if (activeRailItem !== 'dashboard' && activeRailItem.indexOf('view:') !== 0) {
        activeRailItem = 'dashboard';
      }
      if (prev !== '/verifier-library' && !SHARE_TOKEN) loadOrgLibrary();
    } else {
      activeRailItem = '';
    }
    syncSidebarActive();
  }

  function setRailOnly(on) {
    if (on) document.body.setAttribute('data-atm-rail-only', '1');
    else document.body.removeAttribute('data-atm-rail-only');
  }

  document.querySelectorAll('.navitem[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.view = b.dataset.view;
      activeRoute = '/verifier-library';
      activeRailItem = 'view:' + b.dataset.view;
      syncSidebarActive();
      $('#viewtitle').textContent = b.dataset.label || (b.querySelector('.label') && b.querySelector('.label').textContent) || b.textContent.trim();
      if (EMBEDDED && RAIL_ONLY) {
        window.parent.postMessage({ atmosphere: 'navigate', to: '/verifier-library' }, '*');
        return;
      }
      if (EMBEDDED) setScreen('dashboard');
      render();
    });
  });

  // When the portal is the platform's whole screen, Settings appears at the
  // bottom of this sidebar and hands navigation back to the shell — the
  // portal itself stays a page that knows nothing about the app around it.
  // Opening a job name is the same handoff for the record the portal has no
  // screen for: scope, whether it can be verified yet, and inviting a crew.
  function setScreen(name) {
    var dash = document.getElementById('screen-dashboard');
    if (dash) dash.hidden = name !== 'dashboard';
    if (name === 'dashboard') {
      activeRoute = '/verifier-library';
      // setScreen is used for showing the library pane; do not steal the orange
      // overlay from a Videos filter the user just chose.
      if (!activeRailItem || activeRailItem.indexOf('view:') !== 0) {
        activeRailItem = 'dashboard';
      }
      syncSidebarActive();
    }
  }

  function initialsFrom(fullName, email) {
    var name = (fullName && String(fullName).trim()) || (email && String(email).split('@')[0]) || '';
    var words = name.split(/[\s._-]+/).filter(Boolean);
    if (words.length >= 2) return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
    return name.slice(0, 2).toUpperCase() || '—';
  }

  function applySession(payload) {
    if (!payload || !payload.user) return;
    var u = payload.user;
    var name = u.name || 'Teammate';
    var email = u.email || '';
    var init = u.initials || initialsFrom(name, email);
    var sub = u.orgName || email || 'Atmosphere';

    var whoName = document.getElementById('who-name');
    var whoSub = document.getElementById('who-sub');
    var whoAvatar = document.getElementById('who-avatar');
    var menuName = document.getElementById('menu-name');
    var menuEmail = document.getElementById('menu-email');
    var menuMeta = document.getElementById('menu-meta');
    if (whoName) whoName.textContent = name;
    if (whoSub) whoSub.textContent = sub;
    if (whoAvatar) whoAvatar.textContent = init;
    if (menuName) menuName.textContent = name;
    if (menuEmail) menuEmail.textContent = email;
    if (menuMeta) menuMeta.textContent = u.orgName || '';
  }

  function loadAccountFromApi() {
    function jsonOrNull(r) { return r.ok ? r.json() : Promise.resolve(null); }
    Promise.all([
      fetch('/api/auth/me', { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; }),
      fetch('/api/profile', { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; }),
      fetch('/api/org/me', { credentials: 'include' }).then(jsonOrNull).catch(function () { return null; })
    ]).then(function (parts) {
      var me = parts[0] && parts[0].user;
      var profile = parts[1] && parts[1].profile;
      var membership = parts[2] && parts[2].membership;
      if (!me && !profile) return;
      var meta = (me && me.metadata) || {};
      var fullName = (profile && profile.fullName) || meta.full_name || meta.fullName || meta.name || null;
      var email = (profile && profile.email) || (me && me.email) || '';
      var orgName = membership && membership.org && membership.org.name;
      applySession({
        user: {
          name: (fullName && String(fullName).trim()) || (email ? String(email).split('@')[0] : '') || 'Teammate',
          email: email,
          initials: initialsFrom(fullName, email),
          orgName: orgName || null
        }
      });
    });
  }

  function initAccountMenu() {
    var btn = document.getElementById('who-btn');
    var menu = document.getElementById('who-menu');
    if (!btn || !menu) return;

    function closeMenu() {
      menu.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !menu.hidden;
      if (open) closeMenu();
      else {
        menu.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
      }
    });

    document.addEventListener('click', function (e) {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) closeMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeMenu();
    });

    var menuSettings = document.getElementById('menu-settings');
    if (menuSettings) {
      menuSettings.addEventListener('click', function () {
        closeMenu();
        if (EMBEDDED) window.parent.postMessage({ atmosphere: 'navigate', to: '/settings' }, '*');
        else location.href = '/settings';
      });
    }

    var menuSignout = document.getElementById('menu-signout');
    if (menuSignout) {
      menuSignout.addEventListener('click', function () {
        closeMenu();
        if (EMBEDDED) window.parent.postMessage({ atmosphere: 'sign-out' }, '*');
        else location.href = '/login';
      });
    }
  }

  initAccountMenu();

  function goHome() {
    // Brand / home lands on the Dashboard — job folders and clips.
    activeRoute = '/verifier-library';
    activeRailItem = 'dashboard';
    syncSidebarActive();
    if (EMBEDDED) {
      window.parent.postMessage({ atmosphere: 'navigate', to: '/verifier-library' }, '*');
    } else {
      location.href = '/verifier-library';
    }
  }

  var brandHome = document.getElementById('brand-home');
  var brandFallback = document.getElementById('brand-home-fallback');
  if (brandHome) brandHome.addEventListener('click', goHome);
  if (brandFallback) brandFallback.addEventListener('click', goHome);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.atmosphere === 'session') applySession(d);
    if (d && d.atmosphere === 'active-route') setActiveRoute(d.path);
    if (d && d.atmosphere === 'layout') setRailOnly(!!d.railOnly);
    if (d && d.atmosphere === 'theme') setThemePref(d.preference, { fromParent: true });
  });

  var appFrame = document.getElementById('app-frame');
  if (appFrame) appFrame.classList.add('has-sidebar');

  if (EMBEDDED) {
    window.parent.postMessage({ atmosphere: 'request-session' }, '*');
    loadAccountFromApi();
    var railHead = document.getElementById('rail-head');
    var platformNav = document.getElementById('platform-nav');
    var railFooter = document.getElementById('rail-footer');
    if (railHead) railHead.hidden = false;
    if (platformNav) platformNav.hidden = false;
    if (railFooter) railFooter.hidden = false;
    document.querySelectorAll('.app-nav[data-screen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (EMBEDDED) {
          state.view = 'all';
          activeRoute = '/verifier-library';
          activeRailItem = 'dashboard';
          syncSidebarActive();
          window.parent.postMessage({ atmosphere: 'navigate', to: '/verifier-library' }, '*');
          return;
        }
        activeRailItem = 'dashboard';
        setScreen(btn.dataset.screen);
      });
    });
    function goShell(path) {
      activeRoute = path;
      activeRailItem = '';
      syncSidebarActive();
      window.parent.postMessage({ atmosphere: 'navigate', to: path }, '*');
    }
    var navField = document.getElementById('nav-field');
    if (navField) navField.addEventListener('click', function () { goShell('/field'); });
    var navStartJob = document.getElementById('nav-start-job');
    if (navStartJob) {
      navStartJob.addEventListener('click', function () { goShell('/intake'); });
    }
    var navJobs = document.getElementById('nav-jobs');
    if (navJobs) navJobs.addEventListener('click', function () { goShell('/jobs'); });
    var navSettings = document.getElementById('nav-settings');
    if (navSettings) {
      navSettings.addEventListener('click', function () {
        activeRoute = '/settings';
        activeRailItem = '';
        syncSidebarActive();
        window.parent.postMessage({ atmosphere: 'navigate', to: '/settings' }, '*');
      });
    }
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.tab); });
  });

  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });

  var colheads = document.getElementById('colheads');
  if (colheads) {
    colheads.addEventListener('click', function (ev) {
      var btn = ev.target.closest('button');
      if (!btn) return;
      var th = btn.closest('th[data-sort-key]');
      if (!th) return;
      setColumnSort(th.getAttribute('data-sort-key'));
    });
  }

  $('#d-close').addEventListener('click', function () {
    stopPlay();
    $('#detail').setAttribute('data-open', '0');
    state.open = null;
  });
  $('#detail').addEventListener('click', function (e) {
    if (e.target === $('#detail')) $('#d-close').click();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.open) $('#d-close').click();
  });

  $('#d-play').addEventListener('click', function () {
    var host = $('#d-frame');
    var vid = host && host.querySelector('video');
    if (vid) {
      if (vid.paused) vid.play().catch(function () {});
      else vid.pause();
      return;
    }
    if (state.playing) { stopPlay(); syncAnalysisLog(currentPlayhead()); return; }
    startFramePlayback();
  });

  function boot() {
    initFacets();
    counts();
    syncSidebarActive();
    render();
  }

  /* ------------------------------------------------------------------ *
   * Live mode.
   *
   * Opened as /verifier/?share=<token>, the page trades the token for one
   * job's evidence at /api/verifier-share/<token> — the outward door the
   * backend guards. Every mapping below narrows the API shape onto the shape
   * this page already renders, so live and demo rows go through identical
   * code and cannot drift apart.
   * ------------------------------------------------------------------ */

  var SHARE_TOKEN = new URLSearchParams(location.search).get('share');
  // Inside the platform the same page hydrates with the org's whole library —
  // no token, the signed-in session is the credential.
  var ORG_MODE = false;

  function mapRemoteItem(raw, jobKey) {
    return {
      _remote: true,
      id: raw.id,
      job: jobKey || 'shared',
      jobName: raw.jobName,
      company: raw.company || '—',
      person: raw.person || raw.company || '—',
      phase: raw.phase,
      workDate: raw.workDate,
      capturedAt: raw.capturedAt,
      uploadedAt: raw.uploadedAt,
      duration: raw.durationSeconds,
      bytes: raw.byteSize,
      // A signed still out of the clip itself, minted with the list.
      poster: raw.posterUrl || null,
      device: null,
      gps: raw.gps ? { lat: raw.gps.lat, lon: raw.gps.lon, accuracy: raw.gps.accuracyM, distanceFt: null } : null,
      hash: raw.hash,
      tier: raw.tier || 1,
      hold: raw.legalHold ? { on: true, reason: 'This clip is under legal hold. Retention cannot delete it while the hold stands.', by: '', at: '' } : null,
      checks: raw.checks || [],
      analysis: raw.analysisState === 'done'
        ? {
            state: 'done',
            materialChange: raw.analysis && raw.analysis.materialChange,
            materialBecause: raw.analysis && raw.analysis.materialBecause,
            summary: (raw.analysis && raw.analysis.summary) || '',
            dictation: (raw.analysis && (raw.analysis.dictation || raw.analysis.summary)) || '',
            dictationEntries: (raw.analysis && raw.analysis.dictationEntries) || [],
            actions: (raw.analysis && raw.analysis.actions) || [],
            changes: (raw.analysis && raw.analysis.changes) || [],
            scope: (raw.analysis && raw.analysis.scope) || [],
            couldNotTell: (raw.analysis && raw.analysis.couldNotTell) || [],
            longForm: Boolean(raw.analysis && raw.analysis.longForm),
            timeline: (raw.analysis && raw.analysis.timeline) || null,
            windowsTotal: raw.analysis ? raw.analysis.windowsTotal : null,
            windowsRead: raw.analysis ? raw.analysis.windowsRead : null
          }
        : raw.analysisState === 'paired'
          ? { state: 'paired' }
          : raw.analysisState === 'waiting_on_after'
            ? { state: 'skipped', reason: 'No after video has been filed for this day, so there is nothing to compare against.' }
            : raw.analysisState === 'queued'
              ? { state: 'queued', reason: 'Queued for analysis. The model has not read the day yet.' }
              : raw.analysisState === 'failed'
                ? { state: 'failed' }
                : { state: 'none' },
      custody: [],
      _loaded: false
    };
  }

  function fetchRemoteDetail(item) {
    var detailUrl = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id)
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id);
    var videoUrl = ORG_MODE
      ? '/api/evidence-portal/evidence/' + encodeURIComponent(item.id) + '/video'
      : '/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN) + '/evidence/' + encodeURIComponent(item.id) + '/video';
    return Promise.all([
      fetch(detailUrl, { credentials: 'include' }).then(function (r) {
        if (!r.ok) throw new Error('detail');
        return r.json();
      }),
      fetch(videoUrl, { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
    ])
      .then(function (parts) {
        var payload = parts[0];
        var video = parts[1];
        // Prefer the freshest analysis/dictation from the detail payload.
        if (payload.item) {
          var mapped = mapRemoteItem(payload.item, item.job);
          item.analysis = mapped.analysis;
          item.checks = mapped.checks;
          item.hold = mapped.hold;
        }
        item.custody = (payload.custody || []).map(function (c) {
          return {
            action: c.action,
            by: c.by,
            role: c.by === 'Atmosphere' ? 'ai' : (c.role || ''),
            at: c.at,
            detail: c.detail || ''
          };
        });
        item._remoteFrames = (payload.frames || []).map(function (f) {
          return { at: f.atSeconds, src: f.url };
        });
        item._videoUrl = video && video.url ? video.url : null;
        item._loaded = true;
      })
      .catch(function () {
        // The list still opens; the tabs just say less. An error here must
        // not eat the click.
        item._loaded = true;
      });
  }

  function deadLink(status, body) {
    var main = document.querySelector('.main');
    document.querySelector('.rail').innerHTML = '';

    // Evidence is shared account-to-account. No session, or the wrong one,
    // is not a dead link — it is a door that knows who it opens for.
    if (status === 401) {
      main.innerHTML =
        '<div class="empty" style="padding-top:120px">' +
        '<p style="font-size:16px;font-weight:650;color:var(--ink)">Sign in to view this evidence.</p>' +
        '<p style="margin-top:8px">This record was shared with your Atmosphere account. Signing in is what puts your name — rather than \u201csomeone with the link\u201d — on the access log.</p>' +
        '<p style="margin-top:14px"><a href="/login?src=verifier-share" style="display:inline-block;background:var(--accent);color:#fff;font-weight:600;border-radius:8px;padding:9px 16px;text-decoration:none">Sign in</a>' +
        '<a href="/login?mode=signup&src=verifier-share" style="display:inline-block;margin-left:10px;color:var(--accent);font-weight:600;text-decoration:none">Create a free account</a></p>' +
        '</div>';
      return;
    }
    if (status === 403) {
      main.innerHTML =
        '<div class="empty" style="padding-top:120px">' +
        '<p style="font-size:16px;font-weight:650;color:var(--ink)">This share belongs to a different account.</p>' +
        '<p style="margin-top:8px">' + esc((body && body.error) || 'Sign in with the account the share was issued to.') + '</p>' +
        '</div>';
      return;
    }

    var word = (body && body.code === 'revoked') ? 'revoked'
      : (body && body.code === 'expired') ? 'expired'
      : status === 404 ? 'not recognised' : 'unavailable';
    main.innerHTML =
      '<div class="empty" style="padding-top:120px">' +
      '<p style="font-size:16px;font-weight:650;color:var(--ink)">This evidence link is ' + word + '.</p>' +
      '<p style="margin-top:8px">Ask the person who sent it to issue a new one — links are scoped, expiring, and revocable by design.</p>' +
      '</div>';
  }

  function applyOrgLibrary(payload) {
    ORG_MODE = true;
    JOBS = {};
    (payload.jobs || []).forEach(function (j) {
      if (!j || !j.jobId) return;
      JOBS[j.jobId] = {
        key: j.jobId,
        name: j.jobName || 'Job',
        number: j.jobNumber != null ? j.jobNumber : null,
        address: ''
      };
    });
    (payload.items || []).forEach(function (raw) {
      if (raw.jobId && !JOBS[raw.jobId]) {
        JOBS[raw.jobId] = {
          key: raw.jobId,
          name: raw.jobName || 'Job',
          number: raw.jobNumber != null ? raw.jobNumber : null,
          address: ''
        };
      }
    });
    EVIDENCE = (payload.items || []).map(function (raw) { return mapRemoteItem(raw, raw.jobId); });
  }

  function loadOrgLibrary() {
    var wantDemo = new URLSearchParams(location.search).get('demo') === '1';
    return fetch('/api/evidence-portal/library', { credentials: 'include' })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          if (wantDemo) { boot(); return null; }
          // Signed-out library: same empty chrome as an org with no uploads —
          // no sign-in banner shoved above the table, no twin shortcut here.
          ORG_MODE = false;
          EVIDENCE = [];
          JOBS = {};
          boot();
          return null;
        }
        if (!r.ok) throw new Error('no library');
        return r.json();
      })
      .then(function (payload) {
        if (!payload) return;
        applyOrgLibrary(payload);
        boot();
      })
      .catch(function () {
        if (wantDemo) boot();
        else {
          EVIDENCE = [];
          boot();
        }
      });
  }

  if (SHARE_TOKEN) {
    fetch('/api/verifier-share/' + encodeURIComponent(SHARE_TOKEN), { credentials: 'include' })
      .then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) { deadLink(r.status, body); return null; }
          return body;
        });
      })
      .then(function (payload) {
        if (!payload) return;
        JOBS = {
          shared: {
            key: 'shared',
            name: payload.job ? payload.job.title : 'Shared job',
            number: payload.job ? payload.job.number : null,
            address: payload.job && payload.job.claimNumber ? 'Claim ' + payload.job.claimNumber : ''
          }
        };
        EVIDENCE = (payload.items || []).map(function (raw) { return mapRemoteItem(raw); });
        if (payload.share) {
          // Its own element — #resultcount belongs to render() and would
          // overwrite anything written there on the next filter change.
          var badge = document.createElement('span');
          badge.className = 'result';
          badge.textContent = 'shared with ' + payload.share.label +
            (payload.share.expiresAt ? ' · expires ' + payload.share.expiresAt.slice(0, 10) : '');
          var anchor = document.getElementById('resultcount');
          anchor.parentNode.insertBefore(badge, anchor.nextSibling);
        }
        boot();
      })
      .catch(function () { deadLink(0, null); });
  } else {
    loadOrgLibrary();
  }
})();
</script>
</body>
</html>
