# Chat eval: real questions people have asked Chat, run against the real
# models on a made-up job (no customer data). Fails when fewer than 90% of the
# cases pass, so Chat can't quietly get worse. Costs well under a dollar.
name: Chat eval

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main']
    paths:
      - backend/src/shared/ask*.ts
      - backend/src/shared/jobFileAsk.ts
      - backend/src/lib/askModel.ts
      - backend/scripts/askAgentEval.ts
      - .github/workflows/chat-eval.yml

concurrency:
  group: chat-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Chat answers real questions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Keys
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || vars.TAVILY_API_KEY }}
      # Same Chat models production resolves to.
      ANTHROPIC_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Ask the questions
        working-directory: backend
        run: npx tsx scripts/askAgentEval.ts
