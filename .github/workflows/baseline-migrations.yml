# One-time: tell the migration runner what the database already has.
#
# Production was migrated by hand for its whole life, so there is no record of
# which of the 136 committed migrations are applied. This workflow writes that
# record (public.atmosphere_migrations) by marking every migration currently in
# the tree as applied WITHOUT running any of it.
#
# Run this once, from `main`, BEFORE the next production deploy. Until it has
# run, the "Apply database migrations" step in Deploy Work Verification will
# fail on purpose rather than replay 136 migrations over a live schema.
#
# It is safe to re-run: already-recorded versions are left alone.
#
# Prefer: reconcile the live schema against supabase/migration-manifest.json and
# record only versions that check out. When reconcile cannot run (no psql URL —
# e.g. Keys only has SUPABASE_ACCESS_TOKEN), fall back to baselining every
# migration in the tree. That matches a hand-migrated production DB at head.
#
# Uses the GitHub environment `Keys` for Supabase credentials.

name: Baseline database migrations

on:
  workflow_dispatch:

concurrency:
  group: baseline-migrations
  cancel-in-progress: false

jobs:
  baseline:
    name: Record applied migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Keys
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: bash scripts/installRailwayCli.sh

      - name: Install psql
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources \
            2>/dev/null || true
          apt_opts=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2)
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout --kill-after=10 90 apt-get "${apt_opts[@]}" update
          sudo timeout --kill-after=10 120 apt-get "${apt_opts[@]}" install -y --no-install-recommends postgresql-client

      # Keys has SUPABASE_URL + SERVICE_ROLE_KEY, which cannot run DDL. Copy a
      # real Postgres URL from the live backend service when Keys does not
      # have one. Atmosphere is us-east-2 — pass SUPABASE_DB_HOST / REGION.
      - name: Load database URL from Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'Atmosphere APIs' }}
          RAILWAY_ENVIRONMENT: production
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || vars.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || vars.SUPABASE_DB_USER }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION || vars.SUPABASE_DB_REGION }}
        working-directory: backend
        run: node scripts/loadRailwayDbEnv.mjs

      # What the live schema can prove, before anything is written. A migration
      # whose objects are absent is left out of the baseline below.
      # Needs a psql URL — with Management API only this step no-ops / fails soft.
      - name: Reconcile the live schema against the manifest
        id: reconcile
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || env.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || env.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD || env.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || env.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || env.SUPABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || vars.SUPABASE_DB_HOST || env.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || vars.SUPABASE_DB_USER || env.SUPABASE_DB_USER }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION || vars.SUPABASE_DB_REGION || env.SUPABASE_DB_REGION }}
        working-directory: backend
        run: node scripts/reconcile-migrations.mjs

      - name: Compute the safe baseline set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || env.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || env.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD || env.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || env.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || env.SUPABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || vars.SUPABASE_DB_HOST || env.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || vars.SUPABASE_DB_USER || env.SUPABASE_DB_USER }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION || vars.SUPABASE_DB_REGION || env.SUPABASE_DB_REGION }}
        working-directory: backend
        run: |
          # Exits 1 when something looks unapplied; the list is still correct,
          # and those versions are deliberately absent from it.
          # With Management API only (no DATABASE_URL), this writes an empty file.
          : > /tmp/safe-versions.txt
          node scripts/reconcile-migrations.mjs --baseline-list > /tmp/safe-versions.txt || true
          echo "Recording $(wc -l < /tmp/safe-versions.txt) of 136 migrations."

      - name: Baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || env.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || env.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || env.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || env.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || env.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD || env.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || vars.SUPABASE_DB_HOST || env.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || vars.SUPABASE_DB_USER || env.SUPABASE_DB_USER }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION || vars.SUPABASE_DB_REGION || env.SUPABASE_DB_REGION }}
        working-directory: backend
        run: |
          set -euo pipefail
          if [ ! -s /tmp/safe-versions.txt ]; then
            echo "No reconcile safe-versions (psql URL missing or empty set)."
            echo "Baselining every migration in the tree as already applied."
            node scripts/migrate.mjs --baseline
          else
            node scripts/migrate.mjs --baseline --versions-from /tmp/safe-versions.txt
          fi

      # After the baseline the ledger holds only what was verified. Anything
      # left out is now pending, and `migrate.mjs` will apply it on the next
      # deploy — so drift here is expected and reported, not a failure.
      - name: Report what the next deploy will apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || env.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || env.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || env.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || env.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || env.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD || env.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || vars.SUPABASE_DB_HOST || env.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || vars.SUPABASE_DB_USER || env.SUPABASE_DB_USER }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION || vars.SUPABASE_DB_REGION || env.SUPABASE_DB_REGION }}
        working-directory: backend
        run: node scripts/migrate.mjs --dry-run
