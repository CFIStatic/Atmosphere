name: Deploy website

# Two hosts for website/:
#   Railway service `website` in outstanding-kindness (Hobby plan is at cap,
#   so this updates that service instead of creating Atmosphere-website)
#     Config File = /website/railway.toml
#     healthcheck GET /health (also answered at /api/health, never proxied)
#   GitHub Pages — optional; skipped until Settings → Pages → GitHub Actions
#
# One-time on the Railway `website` service (Settings → Config-as-code):
#   Config File = /website/railway.toml
# This job copies that file over the upload root for `railway up`, but GitHub
# autodeploys on the service read the real repo — without the setting they
# resolve the backend's /railway.toml (which used to crash-loop nginx on
# `node dist/index.js` and fail the healthcheck; the root file no longer sets
# a startCommand, so that misresolution now boots nginx and survives).
# See docs/production.md → "If the website service fails its healthcheck".
#
# Corporate Website stays on `npm install -g @railway/cli`. Official Railway
# CLI 5.43+ treats GitHub's CI=true as --ci, so `railway up` exits after the
# Metal image push and the Railway dashboard never shows a finished replica
# (see the cursor/bigger-logo-16cc ships). Do not point this job at
# scripts/installRailwayCli.sh.
on:
  push:
    branches:
      - main
      - cursor/host-corporate-website-51c8
      - cursor/fix-railway-office-deploy-157d
      - cursor/reverse-website-cli-2de8
    paths:
      - 'website/**'
      - '.dockerignore'
      - 'api.upstream'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-enabled:
    name: Check Pages
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect whether GitHub Pages is configured
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is configured — deploy will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not configured yet — skipping deploy (enable under Settings → Pages)."
          fi

  deploy:
    name: deploy
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stamp absolute URLs with the Pages origin
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          sed -i "s|https://REPLACE-WITH-YOUR-DOMAIN|${base}|g" website/sitemap.xml website/robots.txt
          sed -i "s|content=\"/assets/og.png\"|content=\"${base}/assets/og.png\"|g" website/*.html

      # The careers and contact forms post to the backend. On a static host
      # that is a different origin — set the WEBSITE_API_ORIGIN repository
      # variable (Settings → Secrets and variables → Actions → Variables) to
      # the hosted backend's https origin and the forms are wired on the next
      # deploy. Until then they degrade to a clear could-not-reach message.
      - name: Point forms at the hosted backend
        if: vars.WEBSITE_API_ORIGIN != ''
        run: |
          sed -i "s|data-api=\"\"|data-api=\"${{ vars.WEBSITE_API_ORIGIN }}\"|" \
            website/careers.html website/contact.html

      # The bridge from marketing to product. Set the WEBSITE_APP_ORIGIN
      # repository variable to the hosted app's https origin and every
      # sign-in / get-started CTA on the site routes into the real app
      # (site.js reads the stamp and rewrites the auth surfaces).
      - name: Connect auth surfaces to the hosted app
        if: vars.WEBSITE_APP_ORIGIN != ''
        run: |
          sed -i "s|<html lang=\"en\">|<html lang=\"en\" data-app-origin=\"${{ vars.WEBSITE_APP_ORIGIN }}\">|" \
            website/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  railway:
    name: Deploy Railway website
    runs-on: ubuntu-latest
    environment: Keys
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
      RAILWAY_WEBSITE_SERVICE: ${{ secrets.RAILWAY_WEBSITE_SERVICE || vars.RAILWAY_WEBSITE_SERVICE || 'website' }}
      # Empty unless someone hosts the site outside the BFF's Railway project.
      # The default is the private mesh URL in api.upstream — see the step below.
      API_UPSTREAM_OVERRIDE: ${{ vars.API_UPSTREAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add RAILWAY_TOKEN to the GitHub environment Keys."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        # npm wrapper on purpose — see the workflow header. Official CLI 5.43+
        # in this job hid the Corporate Website replica from the dashboard.
        run: npm install -g @railway/cli

      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment production || railway link --project "$RAILWAY_PROJECT_ID" || true

      - name: Point the website service at nginx, not the API
        env:
          RAILWAY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          # Do not railway add here — the Hobby plan is at its service cap.
          # Live name is Corporate Website; `website` is the old alias.
          # railway variable set rejects names that are not on the canvas.
          #
          # The careers and contact forms post to /api on this host. Proxying
          # that to the public https BFF URL leaves the mesh and comes back in
          # through the edge, which 502s for a few seconds; the private domain
          # in api.upstream stays inside the project. Same rule as the office
          # console and the staff console.
          service="$(node backend/scripts/resolveRailwayService.mjs "$RAILWAY_WEBSITE_SERVICE")"
          echo "Resolved '$RAILWAY_WEBSITE_SERVICE' to $service"
          echo "RAILWAY_WEBSITE_SERVICE=$service" >> "$GITHUB_ENV"
          upstream="${API_UPSTREAM_OVERRIDE:-}"
          if [ -z "$upstream" ]; then
            upstream="$(tr -d '\n' < api.upstream)"
          fi
          printf '%s' "$upstream" | railway variable set API_UPSTREAM --stdin --skip-deploys --service "$service"
          printf '%s' 'website/Dockerfile' | railway variable set RAILWAY_DOCKERFILE_PATH --stdin --skip-deploys --service "$service"
          # Stamp nginx + GET /health onto the service so GitHub Autodeploy
          # does not inherit the backend Dockerfile and 300s /api/health probe.
          chmod +x website/scripts/apply-railway-config.sh
          RAILWAY_WEBSITE_SERVICE="$service" website/scripts/apply-railway-config.sh

      - name: Smoke the nginx image
        run: |
          set -euo pipefail
          docker build -f website/Dockerfile -t atmosphere-website:ci .
          docker run -d --name atmosphere-website-ci -e PORT=8080 -p 18080:8080 atmosphere-website:ci
          cleanup() { docker rm -f atmosphere-website-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sleep 2
          # Capture before matching. `curl … | grep -q` races: grep -q exits on
          # its first match, curl is still writing the page, takes EPIPE and
          # exits 23, and pipefail fails the job. The assignment still
          # propagates a curl failure under `set -e`.
          probe="$(curl -fsS http://127.0.0.1:18080/health)"; grep -qx 'ok' <<<"$probe"
          # Must be the nginx probe, not a proxied BFF JSON body.
          probe="$(curl -fsS http://127.0.0.1:18080/api/health)"; grep -qx 'ok' <<<"$probe"
          page="$(curl -fsS http://127.0.0.1:18080/)"; grep -q 'Atmosphere' <<<"$page"

      - name: Deploy corporate site
        env:
          RAILWAY_ENVIRONMENT: production
          RAILWAY_UP_ATTEMPTS: '8'
        run: |
          cp website/railway.toml railway.toml
          cp website/railway.json railway.json
          # Each attempt must change a file under website/** or Railway skips
          # the rebuild after a failed healthcheck and we treat that as success.
          echo "# railway-up $(date -u +%s)" > website/.railway-up-stamp
          export RAILWAY_UP_STAMP_FILE="$PWD/website/.railway-up-stamp"
          export RAILWAY_SERVICE="$RAILWAY_WEBSITE_SERVICE"
          echo "Deploying Railway service: $RAILWAY_SERVICE"
          chmod +x backend/scripts/railwayUp.sh
          backend/scripts/railwayUp.sh

      - name: Generate a public domain
        id: domain
        run: |
          set -euo pipefail
          railway domain --service "$RAILWAY_WEBSITE_SERVICE" || true
          BUNDLE="$( { railway domain --service "$RAILWAY_WEBSITE_SERVICE" || true; railway status --json --service "$RAILWAY_WEBSITE_SERVICE" || true; } 2>&1 )"
          echo "$BUNDLE"
          DOMAIN="$(printf '%s' "$BUNDLE" | node website/scripts/railwayDomain.mjs || true)"
          if [ -z "${DOMAIN:-}" ]; then
            echo "Deployed the nginx image. Generate Domain on the website service in Railway if the URL is missing."
            exit 0
          fi
          echo "Corporate site: $DOMAIN"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

