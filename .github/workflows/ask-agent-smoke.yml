# Live check of the new single-agent job Chat on a made-up job (no customer
# data). Prints each answer, the tools used, time to first word, and token
# use including prompt-cache reads. Costs a few cents per run.
name: Chat agent smoke test

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - backend/src/shared/askAgent.ts
      - backend/scripts/askAgentSmoke.ts
      - .github/workflows/ask-agent-smoke.yml

concurrency:
  group: ask-agent-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Ask the new Chat real questions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Keys
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || vars.TAVILY_API_KEY }}
      # Same Chat models production resolves to.
      ANTHROPIC_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Ask the questions
        working-directory: backend
        run: npx tsx scripts/askAgentSmoke.ts
