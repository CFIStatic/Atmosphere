name: CI

# Runs on every branch, not just the default one. Work here lands through many
# parallel branches that merge into main constantly, so a branch needs to know
# it is green before it is merged, not after.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Default job timeout is 6h. Keep this well below that so a stuck
    # apt/mirror wait cannot burn a runner until SIGTERM (exit 143).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Synthetic A/V pipeline tests spawn ffmpeg; without it they fail with ENOENT.
      # GitHub-hosted runners resolve Ubuntu packages through Azure mirrors
      # (/etc/apt/apt-mirrors.txt). When those mirrors stall, `apt-get update`
      # sits until the 6-hour job timeout. Prefer archive.ubuntu.com and bound
      # every apt wait so a mirror outage fails in minutes, not hours.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi

          install_static_ffmpeg() {
            echo "Falling back to static ffmpeg binary (apt mirror flaky)"
            local url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/ffmpeg-static.tar.xz
            rm -rf /tmp/ffmpeg-static
            mkdir -p /tmp/ffmpeg-static
            tar -xJf /tmp/ffmpeg-static.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo install -m 755 /tmp/ffmpeg-static/bin/ffmpeg /tmp/ffmpeg-static/bin/ffprobe /usr/local/bin/
            hash -r
            ffmpeg -version
          }

          # Prefer apt when mirrors are healthy; never let apt timeout kill Backend CI.
          set +e
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources \
            2>/dev/null || true
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          apt_opts=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1)
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout --kill-after=5 45 apt-get "${apt_opts[@]}" update \
            && sudo timeout --kill-after=5 60 apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg
          apt_rc=$?
          set -e
          if [ "$apt_rc" -eq 0 ] && command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi
          install_static_ffmpeg
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      # Lint errors fail the build. `any` is a warning capped at today's count,
      # so it can only go down: lower the cap when you remove some.
      - name: Lint (no new `any`)
        run: npx eslint . --max-warnings 193
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Migration inventory
        run: npm run check:migrations
        working-directory: backend
      - name: Railway upload healthcheck matcher
        run: bash backend/scripts/railwayUp.healthcheck.test.sh
      - name: Railway CLI install pin
        run: bash scripts/installRailwayCli.test.sh
      - name: docker build retry wrapper
        run: bash scripts/dockerBuildRetry.test.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Field Capture hold-to-finish
        run: node fieldcapture/js/hold-to-finish.test.mjs
      # `npm run build` runs `tsc -b` first, so this covers the typecheck too.
      - run: npm run build
        working-directory: frontend

  mobile:
    name: Mobile (App Store checks + Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Codemagic builds start by hand, so this is the only build a branch gets
    # before merge. Mirrors codemagic.yaml's android-debug-apk workflow; the
    # iOS build needs a Mac and stays on Codemagic.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
        working-directory: apps/mobile
      - name: App Store basics (plist, privacy manifest, icons)
        run: npm test
        working-directory: apps/mobile
      - name: Sync Capacitor Android project
        run: |
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        working-directory: apps/mobile
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android

  internal:
    name: Internal site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/package-lock.json
      - run: npm ci
        working-directory: internal
      - run: npm test
        working-directory: internal
      - run: npm run build
        working-directory: internal

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    # Applies the real migrations to a throwaway Postgres and asserts the
    # behaviour they promise — the capture triggers, the append-only guarantee,
    # and cross-organization isolation. The suite deliberately tries to delete
    # history, so it needs a database it is allowed to destroy; that is why this
    # never points at a Supabase project.
    services:
      postgres:
        # Pulled from AWS ECR Public's mirror of the official image, not Docker
        # Hub: a `services:` container is pulled by the runner before any step,
        # so it cannot be wrapped in a retry, and Docker Hub throttles
        # unauthenticated pulls from shared runners (toomanyrequests). The
        # mirror is the same upstream postgres image with no such limit.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Agent Memory schema tests
        env:
          PGPASSWORD: postgres
        run: backend/supabase/tests/run.sh -h localhost -p 5432 -U postgres
      - name: Project Manager schema tests
        env:
          PGPASSWORD: postgres
        run: supabase/tests/run.sh -h localhost -p 5432 -U postgres
      - name: CRM audit trigger drop without old-product tables
        env:
          PGPASSWORD: postgres
        run: supabase/tests/03_crm_audit_trigger_drop.sh -h localhost -p 5432 -U postgres

  docker-backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: bash scripts/dockerBuildRetry.sh -f backend/Dockerfile -t atmosphere-backend:ci ./backend

  docker-app:
    name: Office app image
    runs-on: ubuntu-latest
    # Building is not enough. nginx resolves its /api proxy target at startup,
    # so an API_UPSTREAM Railway could not resolve ("http://:") used to stop the
    # container from starting at all — the login page and the dashboard went
    # down with the API proxy, and the deploy failed its healthcheck. Boot the
    # image on that exact value here, where it costs a branch check instead of
    # production.
    steps:
      - uses: actions/checkout@v5
      - name: Build office app image
        run: bash scripts/dockerBuildRetry.sh -f frontend/Dockerfile -t atmosphere-app:ci .
      - name: Serve the office app with an unusable API_UPSTREAM
        run: |
          set -euo pipefail
          docker run -d --name atmosphere-app-ci \
            -e PORT=8080 -e API_UPSTREAM='http://:' -e RAILWAY_ENVIRONMENT=production \
            -p 18080:8080 atmosphere-app:ci
          trap 'docker logs atmosphere-app-ci || true; docker rm -f atmosphere-app-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Capture before matching. `curl … | grep -q` races: grep -q exits on
          # its first match, curl is still writing the page, takes EPIPE and
          # exits 23, and pipefail fails the job. The assignment still
          # propagates a curl failure under `set -e`.
          # Railway's deploy probe, and the two a mis-pointed Config File uses.
          probe="$(curl -fsS http://127.0.0.1:18080/healthz)"; grep -qx 'ok' <<<"$probe"
          probe="$(curl -fsS http://127.0.0.1:18080/health)"; grep -qx 'ok' <<<"$probe"
          probe="$(curl -fsS http://127.0.0.1:18080/api/health)"; grep -qx 'ok' <<<"$probe"
          # The login shell itself must render, upstream or no upstream.
          page="$(curl -fsS http://127.0.0.1:18080/)"; grep -qi '<div id="root"' <<<"$page"
          curl -fsS -o /dev/null http://127.0.0.1:18080/login

  docker-website:
    name: Marketing site image
    runs-on: ubuntu-latest
    # Only the deploy workflow built this image, and only on main. nginx
    # resolves the /api proxy target at startup, so a bad API_UPSTREAM default
    # takes the whole container down rather than just the forms — worth
    # catching on the branch instead of after the merge.
    steps:
      - uses: actions/checkout@v5
      - name: Build and serve the marketing site image
        run: |
          set -euo pipefail
          bash scripts/dockerBuildRetry.sh -f website/Dockerfile -t atmosphere-website:ci .
          # Same unresolved-reference value the office app is booted on: a
          # Railway reference that matches no service resolves to an empty
          # string, so the container receives "http://:".
          docker run -d --name atmosphere-website-ci \
            -e PORT=8080 -e API_UPSTREAM='http://:' -p 18081:8080 atmosphere-website:ci
          trap 'docker logs atmosphere-website-ci || true; docker rm -f atmosphere-website-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          probe="$(curl -fsS http://127.0.0.1:18081/health)"; grep -qx 'ok' <<<"$probe"
          probe="$(curl -fsS http://127.0.0.1:18081/api/health)"; grep -qx 'ok' <<<"$probe"
          page="$(curl -fsS http://127.0.0.1:18081/)"; grep -q 'Atmosphere' <<<"$page"

  docker-internal:
    name: Internal site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build internal site image
        run: bash scripts/dockerBuildRetry.sh -f internal/Dockerfile -t atmosphere-internal:ci .

  docker-fieldcapture:
    name: Field Capture image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and serve the Field Capture image
        run: |
          set -euo pipefail
          bash scripts/dockerBuildRetry.sh -f fieldcapture/Dockerfile -t atmosphere-fieldcapture:ci .
          docker run -d --name atmosphere-fieldcapture-ci \
            -e PORT=8080 -p 18082:8080 atmosphere-fieldcapture:ci
          trap 'docker logs atmosphere-fieldcapture-ci || true; docker rm -f atmosphere-fieldcapture-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          probe="$(curl -fsS http://127.0.0.1:18082/healthz)"; grep -qx 'ok' <<<"$probe"
          probe="$(curl -fsS http://127.0.0.1:18082/health)"; grep -qx 'ok' <<<"$probe"
          probe="$(curl -fsS http://127.0.0.1:18082/api/health)"; grep -qx 'ok' <<<"$probe"
          page="$(curl -fsS http://127.0.0.1:18082/)"; grep -qi 'Field Capture' <<<"$page"
          page="$(curl -fsS http://127.0.0.1:18082/fieldcapture/)"; grep -qi 'Field Capture' <<<"$page"
          join="$(curl -sS -o /tmp/fc-join.json -w '%{http_code}' -X POST http://127.0.0.1:18082/api/field-app/join \
            -H 'Content-Type: application/json' \
            -d '{\"fullName\":\"Test User\",\"joinCode\":\"ABC123\"}')"
          test "$join" != "405"
          grep -q '\"error\"' /tmp/fc-join.json
