name: CI

# Runs on every branch, not just the default one. Work here lands through many
# parallel branches that merge into main constantly, so a branch needs to know
# it is green before it is merged, not after.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Default job timeout is 6h. Keep this well below that so a stuck
    # apt/mirror wait cannot burn a runner until SIGTERM (exit 143).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Synthetic A/V pipeline tests spawn ffmpeg; without it they fail with ENOENT.
      # GitHub-hosted runners resolve Ubuntu packages through Azure mirrors
      # (/etc/apt/apt-mirrors.txt). When those mirrors stall, `apt-get update`
      # sits until the 6-hour job timeout. Prefer archive.ubuntu.com and bound
      # every apt wait so a mirror outage fails in minutes, not hours.
      - name: Install ffmpeg
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources \
            2>/dev/null || true
          apt_opts=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2)
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout --kill-after=10 90 apt-get "${apt_opts[@]}" update
          sudo timeout --kill-after=10 120 apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Migration inventory
        run: npm run check:migrations
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # `npm run build` runs `tsc -b` first, so this covers the typecheck too.
      - run: npm run build
        working-directory: frontend

  internal:
    name: Internal site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/package-lock.json
      - run: npm ci
        working-directory: internal
      - run: npm test
        working-directory: internal
      - run: npm run build
        working-directory: internal

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - run: npm run typecheck
        working-directory: agent

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    # Applies the real migrations to a throwaway Postgres and asserts the
    # behaviour they promise — the capture triggers, the append-only guarantee,
    # and cross-organization isolation. The suite deliberately tries to delete
    # history, so it needs a database it is allowed to destroy; that is why this
    # never points at a Supabase project.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Agent Memory schema tests
        env:
          PGPASSWORD: postgres
        run: backend/supabase/tests/run.sh -h localhost -p 5432 -U postgres
      - name: Project Manager schema tests
        env:
          PGPASSWORD: postgres
        run: supabase/tests/run.sh -h localhost -p 5432 -U postgres

  docker-backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t atmosphere-backend:ci ./backend

  docker-app:
    name: Office app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build office app image
        run: docker build -f frontend/Dockerfile -t atmosphere-app:ci .

  docker-internal:
    name: Internal site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build internal site image
        run: docker build -f internal/Dockerfile -t atmosphere-internal:ci .
