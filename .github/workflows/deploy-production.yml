# Deploy Work Verification to Railway using the GitHub environment `Keys`.
#
# Railway does not read GitHub Environments on its own. This workflow is the
# bridge: it copies Keys → the backend service, then `railway up`s backend and
# the office app.
#
# Production only. Feature branches must not `railway up` here — that would
# overwrite production. For branch / PR previews, enable Railway PR
# Environments (see docs/production.md → Railway auto-deploy).
#
# This workflow ships the backend (Keys sync + railway up) and the office app.
# If a service also has GitHub Autodeploy on `main`, you will get two deploys
# per push — Disable Autodeploy on that service, or drop the matching
# `railway up` step here (see docs/production.md).
#
# One extra secret in Keys (from Railway → Account → Tokens):
#   RAILWAY_TOKEN
# Optional:
#   RAILWAY_PROJECT_ID     (Project settings → General)
#   RAILWAY_SERVICE        (backend service name, default: Atmosphere APIs)
#   RAILWAY_APP_SERVICE    (office app service name, default: Atmosphere-web / Login & Dashboard)
#   RAILWAY_WEB_SERVICE    (alias of RAILWAY_APP_SERVICE)
#   RAILWAY_INTERNAL_SERVICE (staff site, default: Internal Growth Metrics)
#
# One-time on the Railway **Atmosphere-web** service (Settings → Config-as-code):
#   Config File = /frontend/railway.toml
# Without that, `railway up` from the repo root applies /railway.toml and
# builds the backend image instead. See docs/production.md.
# This job also copies frontend/railway.toml over the root file, stamps
# nginx + GET /healthz onto the service, and sets RAILWAY_DOCKERFILE_PATH so
# a missing Config File still builds the office image.
#
# Put GOOGLE_API_KEY / GOOGLE_MAPS_API_KEY / ANTHROPIC_API_KEY in `Keys`
# as well (not only the "Google API keys" environment) so this job can see them.
#
# Auto-deploys on push to main, the live Atmosphere API branch, the
# job-create memory FK fix branch, the office-service-name fix branch, and
# the internal staff site branch (backend + internal only — not the office app).
# Manual run still works: Actions → Deploy Work Verification → Run workflow.

name: Deploy Work Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/fix-railway-keys-deploy-51c8
      - cursor/fix-job-create-memory-fk-51c8
      - cursor/fix-railway-office-deploy-157d
      - cursor/internal-data-platform-e19d
      - cursor/office-healthcheck-958b
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - 'frontend/**'
      - 'verifier/**'
      - 'fieldcapture/**'
      - 'internal/**'
      - 'Dockerfile'
      - 'api.upstream'
      - 'scripts/railwayPrivateUpstream.sh'
      - '.github/workflows/deploy-production.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        name: Detect backend-image paths
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
            | grep -Eq '^(backend/|Dockerfile$|railway.toml$|supabase/migrations/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Atmosphere APIs — this push did not change the BFF image."
          fi

  backend:
    name: Sync Keys → Railway and deploy backend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: Keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Require Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add RAILWAY_TOKEN to the GitHub environment Keys (Railway → Account → Tokens)."
            exit 1
          fi

      - name: Sync GitHub Keys onto Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'Atmosphere APIs' }}
          NODE_ENV: production
          MEDIA_BACKEND: supabase
          COMPUTER_USE_ENABLED: 'false'
          BACKUP_ENABLED: 'false'
          ALLOW_MOCK_DRIVERS: 'true'
          HOST: '0.0.0.0'
          PORT: '4000'
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://atmosphere-web-production.up.railway.app,https://app.atmosphereteam.com,https://melodious-inspiration-production-5ad9.up.railway.app' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          DEVICE_PEPPER: ${{ secrets.DEVICE_PEPPER || vars.DEVICE_PEPPER }}
          AI_CREDENTIALS_KEY: ${{ secrets.AI_CREDENTIALS_KEY || vars.AI_CREDENTIALS_KEY }}
          AGENT_TOKEN_SECRET: ${{ secrets.AGENT_TOKEN_SECRET || vars.AGENT_TOKEN_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL || 'hello@invites.jettx.ai' }}
          CAREERS_FROM_EMAIL: ${{ vars.CAREERS_FROM_EMAIL || secrets.CAREERS_FROM_EMAIL }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL || secrets.CONTACT_TO_EMAIL }}
          CAREERS_TO_EMAIL: ${{ vars.CAREERS_TO_EMAIL || secrets.CAREERS_TO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || vars.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          VERIFICATION_PRIMARY_MODEL: gemini-2.5-flash
          VERIFICATION_ESCALATION_MODEL: claude-sonnet-5
        working-directory: backend
        run: node scripts/syncGithubEnvToRailway.mjs

      - name: Ensure Resend can send as hello@invites.jettx.ai
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          RESEND_SENDING_DOMAIN: invites.jettx.ai
        working-directory: backend
        run: node scripts/ensureResendSendingDomain.mjs

      - name: Repair memory_events job FK on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD }}
        working-directory: backend
        run: node scripts/applyMemoryCaptureRepair.mjs

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'Atmosphere APIs' }}
          RAILWAY_ENVIRONMENT: production
        run: |
          # Upload the repo root so root railway.toml watchPatterns (backend/**)
          # match. `railway up` from backend/ previously skipped the Docker
          # build ("no changes detected in watch paths") and left production
          # on an image without /api/auth/internal-challenge.
          echo "Deploying Railway service: $RAILWAY_SERVICE from repo root"
          chmod +x backend/scripts/railwayUp.sh
          if service_id="$(node backend/scripts/resolveRailwayService.mjs "$RAILWAY_SERVICE")"; then
            echo "Resolved '$RAILWAY_SERVICE' to $service_id"
            printf '%s' 'Dockerfile' | railway variable set RAILWAY_DOCKERFILE_PATH \
              --stdin --skip-deploys --service "$service_id" \
              --project "$RAILWAY_PROJECT_ID" --environment production || true
            export RAILWAY_SERVICE="$service_id"
          fi
          backend/scripts/railwayUp.sh

  app:
    name: Deploy office app
    if: github.ref_name != 'cursor/internal-data-platform-e19d'
    runs-on: ubuntu-latest
    environment: Keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Require Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add RAILWAY_TOKEN to the GitHub environment Keys (Railway → Account → Tokens)."
            exit 1
          fi

      - name: Deploy office app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
          RAILWAY_APP_SERVICE: ${{ secrets.RAILWAY_APP_SERVICE || vars.RAILWAY_APP_SERVICE }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || vars.RAILWAY_WEB_SERVICE }}
          RAILWAY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          project="${RAILWAY_PROJECT_ID}"
          service="${RAILWAY_APP_SERVICE:-${RAILWAY_WEB_SERVICE:-Login & Dashboard}}"
          echo "Deploying office app to Railway service '$service' in project $project."
          echo "Writing frontend/railway.json onto the service (nginx + /healthz)."
          railway link --project "$project" --environment production --service "$service" \
            || railway link --project "$project" --environment production \
            || railway link --project "$project" \
            || true
          railway status --project "$project" --environment production || railway status || true
          # Live name is Login & Dashboard; Atmosphere-web is the old alias.
          # railway variable set rejects names that are not on the canvas.
          service_id="$(node backend/scripts/resolveRailwayService.mjs "$service")"
          echo "Resolved '$service' to $service_id"
          service="$service_id"
          chmod +x frontend/scripts/apply-railway-config.sh backend/scripts/railwayUp.sh
          RAILWAY_APP_SERVICE="$service" frontend/scripts/apply-railway-config.sh
          # Private HTTP to the BFF. The public https://atmosphere-production URL
          # hairpins out of the mesh (jfk1 → ams1 hops) and 502s /api for ~3s,
          # which is the spinner on /login (api.me() before the form).
          tr -d '\n' < api.upstream | railway variable set API_UPSTREAM --stdin --skip-deploys --service "$service"
          # railway up reads /railway.toml from the upload root. Without this copy
          # the CLI builds the backend Dockerfile and probes /api/health on nginx.
          cp frontend/railway.toml railway.toml
          cp frontend/railway.json railway.json
          # Autodeploy of this SHA may already have uploaded the same
          # frontend/** tree and failed /healthz. railway up then skips watch
          # paths and leaves the old replica. Dirty a watched file so this
          # CLI upload is a new image with office-start.sh.
          printf '\n# gha %s %s\n' "${GITHUB_SHA}" "$(date -u +%Y%m%dT%H%M%SZ)" >> frontend/nginx/default.conf.template
          export RAILWAY_UP_STAMP_FILE="$PWD/frontend/nginx/default.conf.template"
          export RAILWAY_UP_ATTEMPTS=3
          export RAILWAY_SERVICE="$service"
          export RAILWAY_PROJECT_ID="$project"
          backend/scripts/railwayUp.sh

  internal:
    name: Deploy internal site
    runs-on: ubuntu-latest
    environment: Keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Require Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add RAILWAY_TOKEN to the GitHub environment Keys (Railway → Account → Tokens)."
            exit 1
          fi

      - name: Deploy internal site
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID || 'd0af58bd-0eec-431d-bad3-4da4b4a2e2ae' }}
          RAILWAY_INTERNAL_SERVICE: ${{ secrets.RAILWAY_INTERNAL_SERVICE || vars.RAILWAY_INTERNAL_SERVICE }}
          RAILWAY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          project="${RAILWAY_PROJECT_ID}"
          service="${RAILWAY_INTERNAL_SERVICE:-Internal Growth Metrics}"
          echo "Deploying internal site to Railway service '$service' in project $project."
          echo "Writing internal/railway.json onto the service (nginx + /healthz)."
          case "$service" in
            Atmosphere-internal|Atmosphere-Internal) service="Internal Growth Metrics" ;;
          esac
          export RAILWAY_PROJECT_ID="$project"
          export RAILWAY_ENVIRONMENT=production
          railway status --project "$project" --environment production || railway status || true
          service_id="$(node backend/scripts/resolveRailwayService.mjs "$service")"
          echo "Resolved '$service' to $service_id"
          export RAILWAY_INTERNAL_SERVICE="$service_id"
          export RAILWAY_SERVICE="$service_id"
          railway link --project "$project" --environment production --service "$service_id" \
            || railway link --project "$project" --environment production \
            || railway link --project "$project" \
            || true
          chmod +x internal/scripts/apply-railway-config.sh backend/scripts/railwayUp.sh
          internal/scripts/apply-railway-config.sh
          # Public BFF on purpose: the private mesh 504s from this nginx.
          upstream="https://atmosphere-production.up.railway.app"
          echo "API_UPSTREAM=$upstream"
          printf '%s' "$upstream" | railway variable set API_UPSTREAM \
            --stdin --skip-deploys --service "$service_id" \
            --project "$project" --environment production
          # Autodeploy of this SHA may already have uploaded the same
          # internal/** tree and crashed on empty API_UPSTREAM. railway up
          # then skips watch paths and leaves the old replica. Dirty a
          # watched file so this CLI upload is a new image with the var set.
          printf '\n# gha %s %s\n' "${GITHUB_SHA}" "$(date -u +%Y%m%dT%H%M%SZ)" >> internal/nginx/default.conf.template
          export RAILWAY_UP_STAMP_FILE="$PWD/internal/nginx/default.conf.template"
          export RAILWAY_UP_ATTEMPTS=3
          cp internal/railway.toml railway.toml
          cp internal/railway.json railway.json
          backend/scripts/railwayUp.sh
