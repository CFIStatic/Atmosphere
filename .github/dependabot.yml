# Keep dependency PRs small and non-breaking.
# First enablement opened a flood of majors; this config groups patch/minor
# updates and ignores major bumps until we take them on deliberately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ['dependencies', 'backend']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      backend-patch-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ['dependencies', 'frontend']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      frontend-patch-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ['dependencies', 'agent']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      agent-patch-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ['dependencies', 'ci']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
