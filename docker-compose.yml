# Local production-shaped stack for the Work Verification path.
# Requires a real Supabase project (Auth + Postgres + Storage).
#
#   cp backend/.env.example backend/.env   # fill production values
#   docker compose up --build
#
# Frontend: http://localhost:8080
# Backend:  http://localhost:4000  (GET /api/health, /api/ready)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
