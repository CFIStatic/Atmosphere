# Corporate site (atmosphereteam.com), static HTML + assets/site.js.
# Included from the server and again from every location that sets add_header.
#
# Pages load Google Fonts, same-origin assets/site.js, an inline theme script,
# and inline styles. Careers and contact forms POST to same-origin /api.
# Stripe hardware checkout is a top-level link to buy.stripe.com, not a script.
# No analytics, tag manager, or third-party frames.
#
# Residual gap: 'unsafe-inline' scripts and styles (theme bootstrap + page
# style attributes). GitHub Pages, if enabled later, does not use this file.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
