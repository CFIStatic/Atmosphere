# Standalone Field Capture host (app.atmosphereteam.com).
# Included from the server and again from every location that sets add_header.
#
# No Google Fonts on this page (system fonts + an inline stylesheet).
# Scripts are js/capture-core.js, js/app.js, and one inline theme script.
# Uploads PUT to signed Supabase URLs. Live view uses same-origin /api
# WebSocket plus the default Google STUN servers. The Platform tab iframes
# https://platform.atmosphereteam.com only (loopback ?office= is dev-only and
# intentionally not allowed here).
#
# Residual gaps: 'unsafe-inline' scripts and styles; turn: is open because
# LIVE_TURN_URLS is not a host in this repo. No analytics tags are loaded.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co stun:stun.l.google.com:19302 stun:stun1.l.google.com:19302 turn:; frame-src 'self' https://platform.atmosphereteam.com; form-action 'self'; frame-ancestors 'self'" always;
