# Standalone Field Capture host (app.atmosphereteam.com).
# Included from the server and again from every location that sets add_header.
#
# No Google Fonts on this page (system fonts + an inline stylesheet).
# Scripts are js/capture-core.js, js/app.js, and one inline theme script.
# Uploads PUT to signed Supabase HTTPS URLs. There is no Supabase Realtime
# client, so wss://*.supabase.co is not allowed.
# Profile photos are public objects on the same host
# (https://<project>.supabase.co/storage/v1/object/public/avatars/…).
# img-src must allow that host or the account chip's <img> is blocked and
# the page falls back to initials. Platform already allows it. data: covers
# the small data-URL fallback used when object storage is not configured.
# resolveApiBase() on this host returns https://platform.atmosphereteam.com
# (LIVE_OFFICE_ORIGIN). Login and the rest of /api are fetch() to that origin.
# Office Live signaling rewrites the same base to
# wss://platform.atmosphereteam.com (liveSignalUrl). 'self' stays so the nginx
# /api proxy and a same-origin WebSocket still work. Default Google STUN
# servers, plus turn: because LIVE_TURN_URLS is not a host in this repo.
# The Platform tab iframes https://platform.atmosphereteam.com only
# (loopback ?office= is dev-only and intentionally not allowed here).
#
# Residual gaps: 'unsafe-inline' scripts and styles; turn: is open because
# LIVE_TURN_URLS is not a host in this repo. No analytics tags are loaded.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://platform.atmosphereteam.com wss://platform.atmosphereteam.com stun:stun.l.google.com:19302 stun:stun1.l.google.com:19302 turn:; frame-src 'self' https://platform.atmosphereteam.com; form-action 'self'; frame-ancestors 'self'" always;
