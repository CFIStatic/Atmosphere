# Railway service named "Field Capture" (GitHub check
# "Atmosphere - Field Capture"). Serves the crew web app at / and proxies
# /api to the Atmosphere BFF so Field Capture sign-in works.
#
# Office Overview lives in the Platform iframe on this host, not in this
# nginx image.
#
# Trio with Atmosphere APIs + Platform: watch backend/** (and migrations) so
# GitHub Autodeploy rebuilds Field Capture when APIs change. A frontend-only
# SHA still skips these paths; Deploy Work Verification (`fieldcapture` job)
# `railway up`s this service on every production deploy so FC never lags APIs.
# repair-field-capture-config.yml remains for path-triggered / manual repair.
#
# Rebuild stamp 2026-09-02T18:00Z: ship the office 72px header-line alignment
# with this main. The office image already embeds /fieldcapture/; this stamp
# rebuilds the standalone Field Capture host from current main.
#
# One-time on this service (Settings → Config-as-code), or via
# fieldcapture/scripts/apply-railway-config.sh:
#   Config File    = /fieldcapture/railway.toml
#   Root Directory = /
# Optional: API_UPSTREAM = the Atmosphere APIs private HTTP URL.
# See docs/production.md → Field Capture web host.

[build]
builder = "DOCKERFILE"
dockerfilePath = "fieldcapture/Dockerfile"
watchPatterns = [
  "fieldcapture/**",
  "backend/**",
  "supabase/migrations/**",
  "fieldcapture/Dockerfile",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "/docker-entrypoint.sh nginx -g 'daemon off;'"
