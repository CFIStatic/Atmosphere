# Railway service named "Field Capture" (GitHub check
# "Atmosphere - Field Capture"). Serves the crew web app at / and proxies
# /api to the Atmosphere BFF so name + office-code connect works.
#
# Office Overview lives in the Platform iframe on this host, not in this
# nginx image. A frontend-only SHA skips these watch paths, so production
# can sit behind the office app until this file (or anything else under
# fieldcapture/) changes — or until Repair Field Capture Railway is run.
#
# Rebuild stamp 2026-08-31T15:15Z: last CLI/GHA replica was 04:00Z (PR #244).
# Phone Start a job, job-file Ask, Legal hold removal, job-file height, and
# billing metering landed on main after that image. This file change rebuilds
# the live Field Capture host from current main.
#
# One-time on this service (Settings → Config-as-code), or via
# fieldcapture/scripts/apply-railway-config.sh:
#   Config File    = /fieldcapture/railway.toml
#   Root Directory = /
# Optional: API_UPSTREAM = the Atmosphere APIs private HTTP URL.
# See docs/production.md → Field Capture web host.

[build]
builder = "DOCKERFILE"
dockerfilePath = "fieldcapture/Dockerfile"
watchPatterns = [
  "fieldcapture/**",
  "fieldcapture/Dockerfile",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "/docker-entrypoint.sh nginx -g 'daemon off;'"
