# Office image (Platform + Verifier + /fieldcapture/ on one origin).
# Included from the server and again from every location that sets add_header:
# nginx drops parent add_header directives in that case.
#
# Moderately strict CSP. script-src and style-src keep 'unsafe-inline' because
# the Vite shell, Verifier, and Field Capture all ship inline scripts and style
# attributes. Hashing those would break on the next HTML edit.
#
# Origins below are ones these pages actually load:
# - fonts.googleapis.com / fonts.gstatic.com — index.html and verifier/index.html
# - https://*.supabase.co — signed storage URLs for proof video, posters, uploads
# - stun:stun.l.google.com:19302 and stun:stun1.l.google.com:19302 — default ICE
# - turn: — LIVE_TURN_URLS is operator-set and not named in the repo
# - frame-ancestors — Field Capture hosts that iframe the office (unchanged list)
#
# Residual gaps (do not tighten without a product pass):
# - 'unsafe-inline' scripts and styles
# - Optional VITE_SENTRY_DSN posts are blocked: the ingest host is not in the repo
# - Ask / Gemini / address lookup go through same-origin /api ('self')

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com stun:stun.l.google.com:19302 stun:stun1.l.google.com:19302 turn:; frame-src 'self'; form-action 'self'; frame-ancestors 'self' https://app.atmosphereteam.com https://www.app.atmosphereteam.com https://field-capture.up.railway.app https://field-capture-production.up.railway.app https://field-capture-staging.up.railway.app" always;
