<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0eee9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Atmosphere — sign in to your workspace." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atmosphere" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/atmosphere-180.png" />
    <title>Atmosphere · Sign in</title>
    <script>
      // Resolve appearance before first paint so routes never flash the wrong
      // palette. Preference is light or dark only.
      (function () {
        try {
          var pref = localStorage.getItem('atmosphere.theme');
          if (pref !== 'light' && pref !== 'dark') {
            try {
              var prefs = JSON.parse(localStorage.getItem('atmosphere.preferences') || '{}');
              pref = prefs.theme;
            } catch (e) {}
          }
          if (pref !== 'light' && pref !== 'dark') {
            pref = localStorage.getItem('atm-theme');
          }
          if (pref !== 'light' && pref !== 'dark') {
            pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', pref);
          document.documentElement.setAttribute('data-theme-preference', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme-preference', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
