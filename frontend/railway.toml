# Office console service. GitHub Actions swaps this in for `railway up`
# on Atmosphere-web so the repo-root backend railway.toml is not used.

[build]
builder = "DOCKERFILE"
dockerfilePath = "frontend/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
