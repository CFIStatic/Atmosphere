# Railway service config for the office app (console + Verifier + Field Capture).
#
# Root Directory = /   (repo root — the Dockerfile copies verifier/ and fieldcapture/)
# New services cannot set Config File. The deploy job applies these same
# settings with frontend/scripts/apply-railway-config.sh.
#
# office-start.sh uses the public BFF on Railway (private mesh 504s from this nginx).

[build]
builder = "DOCKERFILE"
dockerfilePath = "frontend/Dockerfile"
watchPatterns = [
  "frontend/**",
  "verifier/**",
  "fieldcapture/**",
  "frontend/Dockerfile",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Own entrypoint (envsubst of PORT). Never node dist/index.js.
startCommand = "/usr/local/bin/office-start.sh"
