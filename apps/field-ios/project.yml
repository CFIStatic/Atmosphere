# XcodeGen spec — on a Mac: `brew install xcodegen && xcodegen generate`
name: AtmosphereFieldCapture
options:
  bundleIdPrefix: com.atmosphere
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: AtmosphereFieldCapture/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AtmosphereFieldCapture:
    type: application
    platform: iOS
    sources:
      - path: AtmosphereFieldCapture
        excludes:
          - PrivacyInfo.xcprivacy
      # App Store privacy manifest — copied into the app bundle as a resource.
      - path: AtmosphereFieldCapture/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atmosphere.fieldcapture
        PRODUCT_NAME: Field Capture
        # Simulator: no Apple Team required — just press Run.
        # Physical iPhone: Xcode → Signing & Capabilities → your Personal Team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: AtmosphereFieldCapture/Info.plist
      # Keep in sync with AtmosphereFieldCapture/Info.plist — `xcodegen generate`
      # rewrites that file from these properties.
      properties:
        CFBundleDisplayName: Field Capture
        CFBundleName: Atmosphere Field Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Field Capture films the workday so the office can verify work on site.
        NSMicrophoneUsageDescription: Field Capture records microphone audio with the day film so the office can hear the site, not only see it.
        NSLocationWhenInUseUsageDescription: Field Capture uses your location while you film to suggest the job you are at and to note where each film was recorded. You can still pick the job yourself.
        ATMOSPHERE_API_BASE: https://atmosphere-production.up.railway.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.atmosphere.fieldcapture
            CFBundleURLSchemes:
              - atmosphere-field
    entitlements:
      path: AtmosphereFieldCapture/FieldCapture.entitlements
